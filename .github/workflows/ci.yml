name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  packs:
    name: Mascot packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/validate-pack.py Resources/mascots/*.json
      # Pure stdlib checks: run them here for the fast Linux answer as well as in ./test.sh.
      - run: python3 tools/check-web-strings.py
      - run: python3 tools/check-web-ids.py

  tests:
    name: Swift tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: ./test.sh

  ubuntu-core-probe:
    name: Ubuntu 24.04 amd64 Core probe
    runs-on: ubuntu-24.04
    container:
      image: swift:6.1.3-noble@sha256:1d10836ca929943d70b2254e555b17247b132f6eed984654351cb6a8cc531613
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run the listed Core boundary
        run: ./tools/ubuntu-core-probe.sh

  swift-core-application-linux:
    name: Ubuntu 24.04 amd64 — real ClawdlineLinux product graph
    runs-on: ubuntu-24.04
    container:
      image: swift:6.1.3-noble@sha256:1d10836ca929943d70b2254e555b17247b132f6eed984654351cb6a8cc531613
    steps:
      - uses: actions/checkout@v4
      # W3-1/W3-2: the real Package.swift target graph and Linux executable, not
      # tools/ubuntu-core-probe.sh's separate
      # materialized probe. This runner is real amd64 hardware, not the QEMU emulation a Clawdline
      # dev Mac uses to reach amd64 — see tools/swift-core-application-linux-build.sh's own comment
      # for why local runs there default to -c debug -j 1.
      - name: Compile and execute the real ClawdlineLinux product contract
        run: SWIFT_CORE_APPLICATION_LINUX_BUILD_CONFIGURATION=release SWIFT_CORE_APPLICATION_LINUX_BUILD_JOBS=2 ./tools/swift-core-application-linux-build.sh

  build:
    name: App builds
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # Package.swift is the compiler-owned product graph used by the bundle wrapper below.
      - name: The SwiftPM product graph resolves
        run: swift build
      - run: CLAWDLINE_APP="$RUNNER_TEMP/Clawdline.app" CLAWDLINE_BUILD_ONLY=1 ./build.sh
      - name: The bundle carries what it needs
        run: |
          APP="$RUNNER_TEMP/Clawdline.app"
          test -x "$APP/Contents/MacOS/Clawdline"
          test -f "$APP/Contents/Resources/iterm.js"
          test -f "$APP/Contents/Resources/mascots/clawd.json"
          # The installed SKILL.md is a stub that points at these two. If the bundle ships
          # without them the stub resolves a reader that is not there, and nothing says so
          # until an agent tries to load the guide.
          test -x "$APP/Contents/Resources/clawdline-skill.sh"
          test -f "$APP/Contents/Resources/skill-guides/clawdline.md"
          test -f "$APP/Contents/Resources/skill-guides/clawdline.zh-TW.md"
          test -f "$APP/Contents/Info.plist"
