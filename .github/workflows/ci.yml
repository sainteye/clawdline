name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each kind of check is its own job, and inside a job every check after the
# setup runs even when an earlier one failed. On 2026-10-07..09 one job ran
# twenty steps in a row: a red Go test skipped the console tests and a red
# console test was only seen once the Go test was fixed, so the two failures
# took turns hiding each other for two days. A check step here therefore reads
# `if: ${{ !cancelled() && steps.ready.outcome == 'success' }}`: it runs after
# any earlier check, failed or not, but not after a broken setup, whose
# failure is the one worth reading.
jobs:
  static:
    name: Formatting, vet, cross-builds and guards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup is complete
        id: ready
        run: 'true'

      - name: Check formatting
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        shell: bash
        run: |
          changed=$(gofmt -l internal cmd)
          if [[ -n "$changed" ]]; then
            printf 'gofmt is required for:\n%s\n' "$changed" >&2
            exit 1
          fi

      - name: Vet Linux
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: go vet ./...

      - name: Build Linux
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: go build ./...

      - name: Build static Linux daemon
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/clawdline

      - name: Build static Windows daemon
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/clawdline

      - name: Vet Windows, including Windows-only tests
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: GOOS=windows go vet ./...

      - name: Check generated Go and TypeScript contracts
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: go run ./tools/contract-gen -check

      - name: Check the safe public remote guard
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: tools/test-public-remote-guard.sh

      - name: Check that pre-push refuses a push onto a red main
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: tools/test-pre-push-red-main.sh

      - name: Check that pre-push reads the commits a push would add
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: tools/test-pre-push-privacy.sh

      - name: Check that main turning red is told once
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: tools/test-ci-notify-red.sh

      - name: Check that a quarantined Go test expires
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: tools/test-go-ci-quarantine.sh

      - name: Check explicit CI modes
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: tools/test-ci-check-modes.sh

      - name: Check the copied files against their pinned manifest
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: tools/check-legacy-css.sh

      - name: Check machine-neutral screen text
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: tools/check-machine-words.sh

      # CI does not run tools/check.sh, so the release evidence checks
      # (docs/security/release-evidence.md) are run here by name. Linux covers
      # the SBOM, provenance, rebuild and gate cases; the darwin job adds the
      # Mach-O and release-signature cases.
      - name: Check that the release evidence fails on what it exists to catch
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bash tools/release/supply-chain.test.sh

  go-linux:
    name: Go tests on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install process and terminal test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes lsof tmux

      - name: Run Go tests with four named host exclusions and the quarantine list
        run: tools/test-go-ci.sh

  console:
    name: Console type-check, builds and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install console dependencies
        working-directory: web
        run: npm ci

      - name: Setup is complete
        id: ready
        run: 'true'

      - name: Test linked-worktree dependency preparation
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        working-directory: web
        run: npm run test:deps

      - name: Type-check the console
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        working-directory: web
        run: npm run check

      - name: Build the local console
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        working-directory: web
        run: npm run build

      - name: Build the hosted console
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        working-directory: web
        env:
          VITE_HOSTED_CONSOLE: '{"v":1,"app_origin":"https://app.example.invalid","api_origin":"https://api.example.invalid","relay_url":"wss://relay.example.invalid/v1/connect"}'
        run: npm run build

      - name: Check that every console test file is run
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: node tools/check-console-tests.mjs

      - name: Run console tests
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        working-directory: web
        run: npm test

  darwin:
    name: macOS and Darwin-only paths
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install tmux integration-test dependency
        run: command -v tmux >/dev/null || brew install tmux

      - name: Setup is complete
        id: ready
        run: 'true'

      - name: Vet Darwin
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: go vet ./...

      - name: Build Darwin
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: go build ./...

      - name: Run Darwin tests with four named host exclusions and the quarantine list
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: tools/test-go-ci.sh

      # check.sh does not run in CI; the native shell's pairing flow is
      # exercised here, on the runner's own architecture.
      - name: Check that the native shell saves a pairing's permission before showing its code
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: sh tools/test-shell-pairing-permission.sh

      - name: Check the release evidence, including the macOS signature cases
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bash tools/release/supply-chain.test.sh

  # Runs last on every push to main and tells the person once when main goes
  # from green to red; tools/ci-notify-red.sh says how. The URL is the
  # repository secret CLAWDLINE_CI_NOTIFY_URL; without it the job prints a
  # notice and succeeds.
  notify-red:
    name: Tell the person when main turns red
    needs: [static, go-linux, console, darwin]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Compare with the previous run on main and notify on green to red
        env:
          GH_TOKEN: ${{ github.token }}
          CLAWDLINE_CI_NOTIFY_URL: ${{ secrets.CLAWDLINE_CI_NOTIFY_URL }}
        run: >-
          tools/ci-notify-red.sh
          "${{ needs.static.result }}"
          "${{ needs.go-linux.result }}"
          "${{ needs.console.result }}"
          "${{ needs.darwin.result }}"
