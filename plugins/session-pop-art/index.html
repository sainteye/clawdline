<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Session Pop</title>
<style>
/* Session Pop: a comic-page reading of Session states. Every colour is paired with a word and a
 * pattern, so the state never depends on colour alone. Motion lives only in decoration. */
:root{color-scheme:light;--paper:#f7efd9;--dot:rgba(230,40,90,.16);--ink:#141218;--card:#fffaf0;--muted:#4a4552;--focus:#1f5bff;
 --red:#ff3d3d;--blue:#2459ff;--yellow:#ffd60a;--violet:#8c4dff;--orange:#ff8b1f;--mint:#17c27a;--teal:#00a6b3;--grey:#b8b2a6;
 --display:"Arial Black","Helvetica Neue",Impact,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
 --text:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
body.dark{color-scheme:dark;--paper:#17141f;--dot:rgba(255,214,10,.10);--muted:#d8d0c2}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background-color:var(--paper);color:var(--ink);font:16px/1.45 var(--text);
 background-image:radial-gradient(var(--dot) 22%,transparent 24%),radial-gradient(var(--dot) 22%,transparent 24%);
 background-size:18px 18px;background-position:0 0,9px 9px;animation:drift 40s linear infinite;padding:20px 24px 40px}
body.dark .page-text{color:#f7efd9}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Masthead */
.mast{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;position:relative;
 background:var(--yellow);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:14px 18px 14px 120px;overflow:hidden;min-height:104px}
.sun{position:absolute;left:-46px;top:50%;width:170px;height:170px;margin-top:-85px;border-radius:50%;
 background:repeating-conic-gradient(var(--red) 0 10deg,transparent 10deg 20deg);animation:spin 30s linear infinite}
.sun::after{content:"";position:absolute;inset:44px;border-radius:50%;background:var(--red);border:4px solid var(--ink);
 background-image:radial-gradient(rgba(255,255,255,.55) 26%,transparent 28%);background-size:9px 9px}
h1{margin:0;font:900 clamp(30px,5vw,56px)/.95 var(--display);letter-spacing:-.02em;text-transform:uppercase;
 color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);overflow-wrap:anywhere}
.scope{margin:6px 0 0;font-weight:700;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.conn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);background:#fff;padding:1px 8px;font-size:14px;font-weight:800;text-transform:uppercase}
.conn::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--mint);border:2px solid var(--ink)}
.conn.off::before{background:var(--grey);border-radius:0}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tool{min-height:44px;min-width:44px;padding:8px 14px;border:3px solid var(--ink);background:#fff;font-weight:800;box-shadow:3px 3px 0 var(--ink)}
.tool:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.tool:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.tool[aria-pressed=true]{background:var(--ink);color:#fff}
.tool:disabled{cursor:not-allowed;color:var(--muted);box-shadow:none;border-style:dashed}

/* Headline strip and tallies */
.headline{display:flex;align-items:center;gap:18px;margin:26px 0 8px;flex-wrap:wrap}
.burst{position:relative;flex:none;width:118px;height:118px;display:grid;place-items:center;text-align:center}
.burst::before{content:"";position:absolute;inset:0;background:var(--red);border:0;
 clip-path:polygon(50% 0,61% 22%,85% 9%,79% 35%,100% 40%,82% 58%,95% 82%,68% 78%,62% 100%,50% 82%,38% 100%,32% 78%,5% 82%,18% 58%,0 40%,21% 35%,15% 9%,39% 22%);
 animation:breathe 3.2s ease-in-out infinite;filter:drop-shadow(4px 4px 0 var(--ink))}
.burst b{position:relative;font:900 40px/1 var(--display);color:#fff;-webkit-text-stroke:1.5px var(--ink)}
.headline p{margin:0;font:900 clamp(22px,3.4vw,36px)/1.1 var(--display);text-transform:uppercase;max-width:30ch}
.headline small{display:block;font:600 15px/1.4 var(--text);text-transform:none;color:var(--muted);margin-top:4px}
.tally{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px;padding:0}
.tally button{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 12px 6px 6px;border:3px solid var(--ink);background:var(--card);font-weight:800;color:var(--ink)}
.tally .sw{width:28px;height:28px;border:2px solid var(--ink)}
.banner{margin:14px 0;padding:10px 14px;border:3px solid var(--ink);font-weight:800;color:var(--ink);
 background:repeating-linear-gradient(135deg,var(--yellow) 0 18px,#fff 18px 36px)}
.banner span{background:#fff;padding:2px 6px}
.banner:empty{display:none}
#problem{margin:10px 0;font-weight:800;color:var(--ink)}
#problem:empty{display:none}
#problem:not(:empty){background:#fff;border:3px solid var(--red);padding:8px 12px;box-shadow:4px 4px 0 var(--red)}

/* Panels */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}
body.selecting .layout{grid-template-columns:minmax(0,1fr) 360px}
.chapter{margin-top:22px}
.chapter h2{display:inline-flex;align-items:center;gap:10px;margin:0 0 12px;padding:4px 14px;background:var(--ink);color:#fff;
 font:900 18px/1.3 var(--display);text-transform:uppercase;transform:skewX(-8deg)}
.chapter h2 span{transform:skewX(8deg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:18px}
.panel{position:relative;display:flex;flex-direction:column;text-align:left;padding:0;border:4px solid var(--ink);background:var(--card);color:var(--ink);
 box-shadow:6px 6px 0 var(--ink);min-height:178px;transition:transform .18s ease,box-shadow .18s ease;transform-style:preserve-3d;
 transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.panel:hover,.panel:focus-visible{box-shadow:9px 9px 0 var(--ink)}
.panel[aria-pressed=true]{box-shadow:9px 9px 0 var(--focus);outline:4px solid var(--focus);outline-offset:2px}
.art{position:relative;display:block;height:64px;border-bottom:4px solid var(--ink);overflow:hidden}
.sfx{position:absolute;right:10px;bottom:4px;font:900 26px/1 var(--display);color:#fff;-webkit-text-stroke:1.5px var(--ink);
 text-shadow:3px 3px 0 var(--ink);transform:rotate(-6deg);white-space:nowrap}
.bubble{position:absolute;left:10px;top:12px;max-width:calc(100% - 20px);background:#fff;border:3px solid var(--ink);border-radius:18px;padding:3px 10px;
 font-weight:900;font-size:14px;text-transform:uppercase;letter-spacing:.02em;line-height:1.25}
.bubble::after{content:"";position:absolute;left:18px;bottom:-11px;width:14px;height:12px;background:#fff;border:3px solid var(--ink);border-top:0;border-left:0;transform:skewX(30deg) rotate(18deg)}
.body{display:flex;flex-direction:column;gap:8px;padding:12px 14px 14px;flex:1}
.title{font-weight:800;font-size:17px;line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;font-size:13px;font-weight:700}
.tag{border:2px solid var(--ink);padding:0 6px;background:#fff;overflow-wrap:anywhere;max-width:100%}
.tag.none{border-style:dashed;color:var(--muted)}
.tag.warn{background:var(--ink);color:#fff}
.panel.old{background:#ece6d7;box-shadow:6px 6px 0 #7b7568;border-style:dashed}
.panel.old .art{filter:grayscale(.85) contrast(.9)}
.panel.arrive{animation:pop .42s cubic-bezier(.2,1.6,.4,1) both;animation-delay:var(--delay,0ms)}
.panel.changed .art::after{content:"POW!";position:absolute;left:50%;top:50%;font:900 22px/1 var(--display);color:var(--yellow);-webkit-text-stroke:1.5px var(--ink);animation:pow .7s ease-out both}
:lang(zh-Hant) .panel.changed .art::after{content:"砰！"}

/* State art: each state has its own colour, pattern and words. */
.s-waiting_you .art{background:var(--red) radial-gradient(#fff 24%,transparent 26%) 0 0/14px 14px}
.s-working .art{background:var(--blue) repeating-linear-gradient(115deg,rgba(255,255,255,.5) 0 6px,transparent 6px 22px);background-size:60px 100%;animation:speed 1.4s linear infinite}
.s-waiting_session .art{background:var(--violet) radial-gradient(rgba(255,255,255,.55) 18%,transparent 20%) 0 0/9px 9px}
.s-holding .art{background:var(--orange) repeating-linear-gradient(0deg,var(--ink) 0 4px,transparent 4px 14px)}
.s-ready .art{background:var(--yellow) radial-gradient(var(--ink) 20%,transparent 22%) 0 0/12px 12px}
.s-milestone_complete .art{background:var(--teal) conic-gradient(#fff 25%,transparent 0 50%,#fff 0 75%,transparent 0) 0 0/16px 16px}
.s-work_complete .art{background:var(--mint) repeating-linear-gradient(45deg,rgba(20,18,24,.25) 0 3px,transparent 3px 10px)}
.s-unknown .art{background:var(--grey) repeating-linear-gradient(45deg,rgba(20,18,24,.3) 0 2px,transparent 2px 8px),repeating-linear-gradient(-45deg,rgba(20,18,24,.3) 0 2px,transparent 2px 8px)}
.s-waiting_you .sfx{animation:nudge 2.6s ease-in-out infinite}
.sw.s-waiting_you{background:var(--red) radial-gradient(#fff 24%,transparent 26%) 0 0/8px 8px}
.sw.s-working{background:var(--blue) repeating-linear-gradient(115deg,rgba(255,255,255,.6) 0 3px,transparent 3px 9px)}
.sw.s-waiting_session{background:var(--violet) radial-gradient(rgba(255,255,255,.6) 18%,transparent 20%) 0 0/6px 6px}
.sw.s-holding{background:var(--orange) repeating-linear-gradient(0deg,var(--ink) 0 3px,transparent 3px 8px)}
.sw.s-ready{background:var(--yellow) radial-gradient(var(--ink) 20%,transparent 22%) 0 0/7px 7px}
.sw.s-milestone_complete{background:var(--teal) conic-gradient(#fff 25%,transparent 0 50%,#fff 0 75%,transparent 0) 0 0/10px 10px}
.sw.s-work_complete{background:var(--mint) repeating-linear-gradient(45deg,rgba(20,18,24,.3) 0 2px,transparent 2px 6px)}
.sw.s-unknown{background:var(--grey) repeating-linear-gradient(45deg,rgba(20,18,24,.35) 0 2px,transparent 2px 5px)}

/* Plain list */
.rows{list-style:none;margin:20px 0 0;padding:0;border:4px solid var(--ink);background:var(--card);box-shadow:6px 6px 0 var(--ink)}
.rows li+li{border-top:2px solid var(--ink)}
.rows button{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 12px;width:100%;min-height:56px;padding:10px 14px;text-align:left;border:0;background:transparent;color:var(--ink)}
.rows button[aria-pressed=true]{background:#e7edff}
.rows .sw{grid-row:span 2;width:28px;height:28px;border:2px solid var(--ink);align-self:center}
.rows b{overflow-wrap:anywhere}
.rows span.line{font-size:14px;font-weight:600;color:var(--muted);overflow-wrap:anywhere}

/* Detail: the zoomed-in panel */
#detail{position:sticky;top:16px;background:var(--card);color:var(--ink);border:4px solid var(--ink);box-shadow:10px 10px 0 var(--ink);display:none}
body.selecting #detail{display:block}
#detail .art{height:120px}
#detail .sfx{font-size:44px;right:16px;bottom:10px}
#detail .bubble{font-size:16px;top:16px;left:16px}
.d-body{padding:16px 18px 18px;display:grid;gap:12px}
.d-body h2{margin:0;font:800 22px/1.25 var(--text);overflow-wrap:anywhere}
.d-body dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:15px}
.d-body dt{font-weight:800}
.d-body dd{margin:0;overflow-wrap:anywhere}
.d-close{position:absolute;right:10px;top:10px;width:44px;height:44px;border:3px solid var(--ink);background:#fff;font-weight:900;font-size:20px;z-index:1}
.go{min-height:52px;border:4px solid var(--ink);background:var(--red);color:#fff;font:900 18px/1 var(--display);text-transform:uppercase;box-shadow:5px 5px 0 var(--ink);padding:12px}
.go:hover:not(:disabled){background:#e62020}
.go:active:not(:disabled){transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.go:disabled{background:#d8d2c4;color:#3b3742;border-style:dashed;box-shadow:none;cursor:not-allowed}
.why{margin:0;font-size:14px;font-weight:600;color:#3b3742}
.why:empty{display:none}

.empty{margin-top:24px;display:grid;place-items:center;text-align:center;padding:44px 20px;border:4px solid var(--ink);background:var(--card);box-shadow:8px 8px 0 var(--ink);
 background-image:radial-gradient(rgba(36,89,255,.18) 22%,transparent 24%);background-size:14px 14px}
.empty b{font:900 clamp(26px,4vw,40px)/1.1 var(--display);text-transform:uppercase;background:#fff;border:3px solid var(--ink);padding:8px 16px;transform:rotate(-2deg)}
.empty p{margin:16px 0 0;font-weight:700;background:#fff;padding:2px 8px}

/* Motion is ornamental; a still page keeps the full composition. */
body.still,body.still *,body.still *::before,body.still *::after{animation:none!important;transition:none!important}
body.still .panel{transform:none}
@keyframes drift{to{background-position:180px 90px,189px 99px}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.05) rotate(4deg)}}
@keyframes speed{to{background-position:60px 0}}
@keyframes nudge{0%,80%,100%{transform:rotate(-6deg)}86%{transform:rotate(-12deg) scale(1.08)}93%{transform:rotate(0) scale(1.08)}}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-4deg)}to{opacity:1;transform:none}}
@keyframes pow{from{opacity:1;transform:translate(-50%,-50%) scale(.4)}60%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}to{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}

@media (max-width:860px){
 body.selecting .layout{grid-template-columns:minmax(0,1fr)}
 #detail{position:fixed;left:12px;right:12px;bottom:12px;top:auto;max-height:72vh;overflow:auto;z-index:5}
 body.selecting main{padding-bottom:50vh}
}
@media (max-width:560px){
 body{padding:12px 16px 32px}
 .mast{grid-template-columns:1fr;padding:12px 12px 12px 92px}
 .sun{width:130px;height:130px;margin-top:-65px;left:-40px}.sun::after{inset:34px}
 .tools{justify-content:flex-start}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
 .panel{min-height:160px;box-shadow:4px 4px 0 var(--ink)}
 .art{height:52px}.sfx{font-size:20px}.bubble{font-size:12px;padding:2px 8px;top:8px}
 .body{padding:10px}.title{font-size:15px}
 .burst{width:88px;height:88px}.burst b{font-size:30px}
}
</style>
<body class="still">
<header class="mast">
 <span class="sun" aria-hidden="true"></span>
 <div><h1 id="title">Session Pop!</h1><p class="scope"><span id="scope"></span><span id="conn" class="conn"></span></p></div>
 <div class="tools" role="toolbar" id="tools">
  <button class="tool" id="btnPanels" aria-pressed="true"></button>
  <button class="tool" id="btnList" aria-pressed="false"></button>
  <button class="tool" id="btnMotion" aria-pressed="true"></button>
  <button class="tool" id="btnClose"></button>
 </div>
</header>
<p class="banner" id="banner" role="status"></p>
<section class="headline" aria-live="polite"><div class="burst" aria-hidden="true"><b id="burstNum">·</b></div><p id="headline"></p></section>
<ul class="tally" id="tally"></ul>
<p id="problem" role="alert"></p>
<div class="layout">
 <main id="board" aria-labelledby="title"></main>
 <aside id="detail" aria-labelledby="dTitle">
  <button class="d-close" id="dClose">×</button>
  <span class="art" id="dArt" aria-hidden="true"><span class="sfx" id="dSfx"></span></span>
  <div class="d-body">
   <span id="dState" class="visually-hidden"></span>
   <h2 id="dTitle"></h2>
   <dl><dt id="dtState"></dt><dd id="ddState"></dd><dt id="dtProject"></dt><dd id="ddProject"></dd><dt id="dtFresh"></dt><dd id="ddFresh"></dd></dl>
   <button class="go" id="dOpen"></button>
   <p class="why" id="dWhy"></p>
  </div>
 </aside>
</div>
<!-- CLAWDLINE_SDK -->
<script>
(() => {
  "use strict";
  // States in reading order: what needs the person first, settled work last.
  const ORDER = ["waiting_you","waiting_session","working","holding","ready","milestone_complete","work_complete","unknown"];
  const WORDS = {
    en: {
      title: "Session Pop!", panels: "Panels", list: "List", motionOn: "Motion on", motionOff: "Motion off", motionSystem: "Reduced motion",
      close: "Close", closeDetail: "Close details", open: "Open Session", opening: "Opening…",
      connected: "Live", disconnected: "Disconnected", loading: "Reading Sessions…",
      noProject: "No Project", stale: "May be stale", unknownFresh: "Freshness unknown", fresh: "Current",
      dState: "State", dProject: "Project", dFresh: "Reading",
      gone: "This Session is no longer in the current reading.",
      whyDisconnected: "Disconnected: the last reading is shown and opening is off until a new reading arrives.",
      whyStale: "This reading may be stale, so opening is off.",
      whyUnknown: "Freshness is unknown, so opening is off.",
      banner: "Disconnected — showing the last reading. Rows may be stale and cannot be opened.",
      emptyTitle: "Nothing on the page!", emptyBody: "There are no Sessions in this reading.",
      total: n => `${n} Session${n === 1 ? "" : "s"} on the page`,
      lead: (n, word) => `${n} · ${word}`,
      quiet: "All quiet", quietBody: "No Session is waiting for you or another Session.",
      chapter: (word, n) => `${word} · ${n}`,
      jump: (word, n) => `${word}: ${n}`,
      hostDown: "Host connection unavailable.",
      errors: {
        permission_denied: "Opening is not permitted for this view.", scope_changed: "Access changed. Reopen the view to read again.",
        session_unavailable: "That Session is no longer available.", host_unavailable: "Clawdline is not answering this view.",
        busy: "Clawdline is busy. Wait a moment, then choose again.", request_timeout: "No answer in time; the outcome is uncertain. Check Clawdline before trying again.",
        too_many_sessions: "The reading has more Sessions than a view may show, so the host refused it.", message_too_large: "The reading is too large for a view.",
        protocol_mismatch: "This view does not match the host version.", invalid_request: "The host refused the request.", method_not_supported: "The host does not support this action."
      },
      failed: code => `Could not complete: ${code}`
    },
    zh: {
      title: "Session 普普風！", panels: "漫畫格", list: "清單", motionOn: "動態：開", motionOff: "動態：關", motionSystem: "已減少動態",
      close: "關閉", closeDetail: "關閉詳情", open: "開啟 Session", opening: "開啟中…",
      connected: "連線中", disconnected: "已中斷", loading: "正在讀取 Session…",
      noProject: "未指定 Project", stale: "資料可能過時", unknownFresh: "新鮮度不明", fresh: "最新",
      dState: "狀態", dProject: "Project", dFresh: "讀取",
      gone: "這個 Session 已不在目前的讀取結果中。",
      whyDisconnected: "已中斷連線：顯示的是上一次讀取，收到新的讀取前無法開啟。",
      whyStale: "這筆資料可能過時，所以無法開啟。",
      whyUnknown: "無法確認資料是否最新，所以無法開啟。",
      banner: "已中斷連線——顯示上一次的讀取，資料可能過時，無法開啟。",
      emptyTitle: "這頁空空的！", emptyBody: "這次讀取沒有任何 Session。",
      total: n => `這頁共有 ${n} 個 Session`,
      lead: (n, word) => `${n} 個 · ${word}`,
      quiet: "一切安靜", quietBody: "沒有 Session 在等你或等另一個 Session。",
      chapter: (word, n) => `${word} · ${n}`,
      jump: (word, n) => `${word}：${n}`,
      hostDown: "無法連線至宿主。",
      errors: {
        permission_denied: "這個視圖沒有開啟的權限。", scope_changed: "存取範圍已變更，請重新開啟視圖。",
        session_unavailable: "這個 Session 已無法使用。", host_unavailable: "Clawdline 沒有回應這個視圖。",
        busy: "Clawdline 忙碌中，請稍候再選一次。", request_timeout: "逾時未回應，結果不確定。請先到 Clawdline 確認再試。",
        too_many_sessions: "Session 數量超過視圖上限，宿主拒絕了這次讀取。", message_too_large: "這次讀取太大，視圖無法顯示。",
        protocol_mismatch: "這個視圖與宿主版本不相容。", invalid_request: "宿主拒絕了這個請求。", method_not_supported: "宿主不支援這個動作。"
      },
      failed: code => `無法完成：${code}`
    }
  };
  const STATES = {
    en: {ready:"Ready",working:"Working",holding:"On hold",waiting_you:"Waiting for you",waiting_session:"Waiting for a Session",unknown:"Unknown",milestone_complete:"Milestone complete",work_complete:"Work complete"},
    zh: {ready:"待命",working:"工作中",holding:"暫停保留",waiting_you:"等你回覆",waiting_session:"在等另一個 Session",unknown:"狀態不明",milestone_complete:"階段完成",work_complete:"已完成"}
  };
  // Decorative sound effects; hidden from assistive technology.
  const SFX = {
    en: {ready:"READY!",working:"WHIRR",holding:"PAUSE",waiting_you:"HEY!",waiting_session:"TICK TOCK",unknown:"???",milestone_complete:"TA-DA",work_complete:"DONE"},
    zh: {ready:"就緒！",working:"嗡嗡",holding:"暫停",waiting_you:"嘿！",waiting_session:"滴答",unknown:"？？？",milestone_complete:"噹噹",work_complete:"完成"}
  };
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };

  let view = null, context = { language: document.documentElement.lang, connection: "connected", visible: true, reducedMotion: true };
  let snapshot = null, awaitingSnapshot = true, mode = "panels", userMotion = true, selected = null, opening = false;
  let firstPaint = true;
  const panels = new Map(), chapters = new Map(), lastStates = new Map();

  const zh = () => String(context.language || "").toLowerCase().startsWith("zh");
  const W = () => WORDS[zh() ? "zh" : "en"];
  const stateWord = s => STATES[zh() ? "zh" : "en"][s] || STATES[zh() ? "zh" : "en"].unknown;
  const stateOf = row => ORDER.includes(row.workState) ? row.workState : "unknown";
  const connected = () => context.connection === "connected" && !awaitingSnapshot;
  const canOpen = row => connected() && row.freshness === "fresh";
  const freshWord = row => !connected() || row.freshness === "stale" ? W().stale : row.freshness === "fresh" ? W().fresh : W().unknownFresh;
  const motionActive = () => userMotion && !context.reducedMotion && context.visible !== false;

  function applyContext() {
    const w = W();
    document.documentElement.lang = zh() ? "zh-Hant" : "en";
    document.title = w.title;
    document.body.classList.toggle("dark", context.theme === "dark");
    document.body.classList.toggle("still", !motionActive());
    $("title").textContent = w.title;
    $("scope").textContent = context.scopeLabel || "";
    $("conn").textContent = context.connection === "connected" ? w.connected : w.disconnected;
    $("conn").classList.toggle("off", context.connection !== "connected");
    $("banner").textContent = context.connection === "connected" ? "" : w.banner;
    $("btnPanels").textContent = w.panels; $("btnList").textContent = w.list;
    $("btnPanels").setAttribute("aria-pressed", String(mode === "panels")); $("btnList").setAttribute("aria-pressed", String(mode === "list"));
    const motion = $("btnMotion");
    motion.disabled = !!context.reducedMotion;
    motion.textContent = context.reducedMotion ? w.motionSystem : userMotion ? w.motionOn : w.motionOff;
    motion.setAttribute("aria-pressed", String(!context.reducedMotion && userMotion));
    $("btnClose").textContent = w.close;
    $("dClose").setAttribute("aria-label", w.closeDetail);
    $("dtState").textContent = w.dState; $("dtProject").textContent = w.dProject; $("dtFresh").textContent = w.dFresh;
  }

  function rowsByState() {
    const groups = new Map(ORDER.map(s => [s, []]));
    for (const row of snapshot ? snapshot.sessions : []) groups.get(stateOf(row)).push(row);
    return groups;
  }

  function renderSummary(groups) {
    const w = W(), total = snapshot ? snapshot.sessions.length : 0;
    const tally = $("tally"); tally.replaceChildren();
    if (!snapshot) { $("burstNum").textContent = "·"; $("headline").textContent = w.loading; return; }
    const lead = ["waiting_you","waiting_session","working"].find(s => groups.get(s).length);
    const p = $("headline"); p.replaceChildren();
    if (!total) { $("burstNum").textContent = "0"; p.textContent = w.emptyTitle; }
    else if (lead) { $("burstNum").textContent = String(groups.get(lead).length); p.append(w.lead(groups.get(lead).length, stateWord(lead)), el("small", "", w.total(total))); }
    else { $("burstNum").textContent = String(total); p.append(w.quiet, el("small", "", w.quietBody + " " + w.total(total))); }
    for (const s of ORDER) {
      const n = groups.get(s).length; if (!n) continue;
      const b = el("button"); b.append(el("span", "sw s-" + s), el("span", "", w.jump(stateWord(s), n)));
      b.onclick = () => { const target = mode === "panels" ? chapters.get(s) : $("board").querySelector(`[data-state="${s}"]`); if (!target) return; target.scrollIntoView({ block: "start", behavior: motionActive() ? "smooth" : "auto" }); (target.matches("button") ? target : target.querySelector(".panel"))?.focus({ preventScroll: true }); };
      const li = el("li"); li.append(b); tally.append(li);
    }
  }

  function fillPanel(button, row) {
    const s = stateOf(row), old = !canOpen(row);
    button.className = "panel s-" + s + (old ? " old" : "") + (button.classList.contains("arrive") ? " arrive" : "");
    const prev = lastStates.get(row.ref);
    if (prev && prev !== s && motionActive()) { button.classList.remove("changed"); void button.offsetWidth; button.classList.add("changed"); }
    lastStates.set(row.ref, s);
    button.setAttribute("aria-pressed", String(selected === row.ref));
    const art = el("span", "art"); art.setAttribute("aria-hidden", "true"); art.append(el("span", "sfx", SFX[zh() ? "zh" : "en"][s]));
    const body = el("span", "body"), meta = el("span", "meta");
    meta.append(el("span", "tag" + (row.project ? "" : " none"), row.project?.label || W().noProject));
    if (row.freshness !== "fresh" || !connected()) meta.append(el("span", "tag warn", freshWord(row)));
    body.append(el("span", "title", row.title), meta);
    button.replaceChildren(art, el("span", "bubble", stateWord(s)), body);
  }

  function renderPanels(groups) {
    const board = $("board"), focusedRef = document.activeElement?.dataset?.ref;
    if (board.dataset.mode !== "panels") { board.replaceChildren(); panels.clear(); chapters.clear(); board.dataset.mode = "panels"; }
    board.querySelector(".empty")?.remove();
    const seen = new Set(); let index = 0;
    for (const s of ORDER) {
      const rows = groups.get(s);
      let chapter = chapters.get(s);
      if (!rows.length) { chapter?.remove(); chapters.delete(s); continue; }
      if (!chapter) { chapter = el("section", "chapter"); chapter.append(el("h2"), el("div", "grid")); chapters.set(s, chapter); }
      const h = chapter.firstChild; h.replaceChildren(el("span", "", W().chapter(stateWord(s), rows.length)));
      const grid = chapter.lastChild;
      rows.forEach((row, i) => {
        seen.add(row.ref);
        let button = panels.get(row.ref);
        if (!button) {
          button = el("button"); button.type = "button"; button.dataset.ref = row.ref; panels.set(row.ref, button);
          button.classList.add("arrive"); button.style.setProperty("--delay", (firstPaint ? Math.min(index * 35, 700) : 0) + "ms");
          button.addEventListener("animationend", e => { if (e.animationName === "pop") button.classList.remove("arrive"); if (e.animationName === "pow") button.classList.remove("changed"); });
          button.addEventListener("click", () => select(button.dataset.ref));
          button.addEventListener("pointermove", e => { if (!motionActive()) return; const r = button.getBoundingClientRect(); button.style.setProperty("--ry", ((e.clientX - r.left) / r.width - .5) * 10 + "deg"); button.style.setProperty("--rx", (.5 - (e.clientY - r.top) / r.height) * 10 + "deg"); });
          button.addEventListener("pointerleave", () => { button.style.removeProperty("--rx"); button.style.removeProperty("--ry"); });
        }
        fillPanel(button, row);
        // Move a node only when its position actually changed, so focus and hover survive updates.
        if (grid.children[i] !== button) grid.insertBefore(button, grid.children[i] || null);
        index++;
      });
      while (grid.children.length > rows.length) grid.lastChild.remove();
      // Keep chapters in reading order without re-inserting unchanged ones.
      const position = ORDER.filter(x => chapters.has(x)).indexOf(s);
      if (board.children[position] !== chapter) board.insertBefore(chapter, board.children[position] || null);
    }
    for (const [ref, button] of panels) if (!seen.has(ref)) { button.remove(); panels.delete(ref); }
    for (const ref of lastStates.keys()) if (!seen.has(ref)) lastStates.delete(ref);
    if (snapshot && !snapshot.sessions.length) board.append(emptyPanel());
    if (focusedRef && panels.has(focusedRef) && document.activeElement !== panels.get(focusedRef)) panels.get(focusedRef).focus({ preventScroll: true });
    firstPaint = false;
  }

  function renderList(groups) {
    const board = $("board"), focusedRef = document.activeElement?.dataset?.ref;
    board.dataset.mode = "list"; panels.clear(); chapters.clear();
    if (snapshot && !snapshot.sessions.length) { board.replaceChildren(emptyPanel()); return; }
    const list = el("ol", "rows");
    for (const s of ORDER) for (const row of groups.get(s)) {
      const b = el("button"); b.type = "button"; b.dataset.ref = row.ref; b.dataset.state = s; b.setAttribute("aria-pressed", String(selected === row.ref));
      b.append(el("span", "sw s-" + s), el("b", "", row.title), el("span", "line", [stateWord(s), row.project?.label || W().noProject, freshWord(row)].join(" · ")));
      b.onclick = () => select(row.ref);
      const li = el("li"); li.append(b); list.append(li);
    }
    board.replaceChildren(list);
    if (focusedRef) board.querySelector(`[data-ref="${CSS.escape(focusedRef)}"]`)?.focus({ preventScroll: true });
  }

  function emptyPanel() { const box = el("div", "empty"); box.append(el("b", "", W().emptyTitle), el("p", "", W().emptyBody)); return box; }

  function renderDetail() {
    document.body.classList.toggle("selecting", selected !== null);
    if (selected === null) return;
    const w = W(), row = snapshot?.sessions.find(r => r.ref === selected);
    const s = row ? stateOf(row) : "unknown";
    $("dArt").className = "art s-" + s;
    $("detail").className = "s-" + s;
    $("dSfx").textContent = row ? SFX[zh() ? "zh" : "en"][s] : "";
    $("dTitle").textContent = row ? row.title : w.gone;
    $("ddState").textContent = row ? stateWord(s) : "—";
    $("ddProject").textContent = row ? (row.project?.label || w.noProject) : "—";
    $("ddFresh").textContent = row ? freshWord(row) : "—";
    const go = $("dOpen"), why = $("dWhy");
    go.textContent = opening ? w.opening : w.open;
    go.disabled = opening || !row || !canOpen(row);
    why.textContent = !row ? "" : !connected() ? w.whyDisconnected : row.freshness === "stale" ? w.whyStale : row.freshness !== "fresh" ? w.whyUnknown : "";
  }

  function render() {
    applyContext();
    const groups = rowsByState();
    renderSummary(groups);
    if (mode === "panels") renderPanels(groups); else renderList(groups);
    renderDetail();
  }

  function select(ref) {
    selected = ref; $("problem").textContent = "";
    render();
    $("dOpen").disabled ? $("dClose").focus({ preventScroll: true }) : $("dOpen").focus({ preventScroll: true });
  }
  function closeDetail() {
    const ref = selected; selected = null; render();
    if (ref !== null) document.querySelector(`#board [data-ref="${CSS.escape(ref)}"]`)?.focus();
  }

  function showError(e) { const w = W(), code = e && e.code; $("problem").textContent = (code && w.errors[code]) || w.failed(code || "unknown"); }

  async function openSelected() {
    const row = snapshot?.sessions.find(r => r.ref === selected);
    if (!view || !row || !canOpen(row) || opening) return;
    opening = true; renderDetail();
    // One explicit attempt; a timeout's outcome is uncertain, so nothing retries it.
    try { await view.sessions.open(row.ref); }
    catch (e) { showError(e); }
    finally { opening = false; renderDetail(); }
  }

  $("btnPanels").onclick = () => { mode = "panels"; render(); };
  $("btnList").onclick = () => { mode = "list"; render(); };
  $("btnMotion").onclick = () => { userMotion = !userMotion; render(); };
  $("btnClose").onclick = () => { if (view) view.close().catch(showError); };
  $("dClose").onclick = closeDetail;
  $("dOpen").onclick = openSelected;
  addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (selected !== null) { e.preventDefault(); closeDetail(); }
    else if (view) view.close().catch(showError);
  });

  applyContext(); renderSummary(rowsByState());
  connectViewPlugin().then(async connectedView => {
    view = connectedView;
    view.onContext(next => { if (next.connection !== "connected") awaitingSnapshot = true; context = next; render(); });
    const accept = next => {
      if (!next || !Array.isArray(next.sessions)) return false;
      if (snapshot && next.streamId === snapshot.streamId && !(next.revision > snapshot.revision)) return false;
      snapshot = next; awaitingSnapshot = context.connection !== "connected"; return true;
    };
    try {
      const initial = await view.sessions.subscribe(next => { if (accept(next)) render(); });
      accept(initial); render();
    } catch (e) { showError(e); }
  }).catch(() => { $("problem").textContent = WORDS.en.hostDown + " / " + WORDS.zh.hostDown; });
})();
</script></body></html>
