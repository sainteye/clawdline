<script>
(()=>{'use strict';
const words={en:{title:'Session Territory',kicker:'A map of the work you can see',map:'Map',list:'List',still:'Still mode',overview:'Project territories',explain:'Each cell is one Session, grouped by Project. Cell area does not measure effort, file activity or progress.',selection:'Selected territory',choose:'Select a Session',chooseNote:'Press a cell to inspect it. Navigation requires a second, explicit press.',open:'Open this Session',layer:'Data boundary · v1',fileTitle:'File activity',unavailable:'UNAVAILABLE IN THIS VIEW',fileNote:'The current bridge provides Project and Session summaries, without file paths or tool activity.',boundary:'These are Session cells, not files. No file heat or collision is inferred.',footer:'Complete states are reports from the host, not acceptance of delivery. Layout has no timeline or dependency meaning.',empty:'No authorized Sessions in this snapshot.',noProject:'No Project',fresh:'Fresh summary',stale:'May be stale',unknownFresh:'Freshness unknown',disconnected:'Disconnected · retained summaries are stale',awaiting:'Waiting for a fresh snapshot',motionStopped:'Motion paused by visibility, freshness or accessibility settings',connected:'Authorized summaries · file layer unavailable',complete:'Reported completion does not mean reviewed or accepted.',opening:'Opening…',error:'Could not open the Session. Select again to retry.',noOpen:'Fresh data is required for navigation.',scope:'All currently authorized Projects',count:(p,s)=>`${p} territories · ${s} Sessions`,states:{ready:'Ready',working:'Working',holding:'On hold',waiting_you:'Waiting for you',waiting_session:'Waiting for a Session',unknown:'State unknown',milestone_complete:'Milestone reported complete',work_complete:'Work reported complete'}},zh:{title:'Session 工作地圖',kicker:'看得見的工作，才畫上地圖',map:'地圖',list:'清單',still:'靜止模式',overview:'Project 工作區',explain:'每格是一個 Session，依 Project 分區。格子面積不代表工時、檔案活動或進度。',selection:'已選工作區',choose:'選取一個 Session',chooseNote:'點選格子查看詳情，再按開啟按鈕前往。',open:'前往這個 Session',layer:'資料邊界 · v1',fileTitle:'檔案活動',unavailable:'此視圖尚無這項資料',fileNote:'目前橋接只提供 Project 與 Session 摘要，沒有檔案路徑或工具活動。',boundary:'這些格子代表 Session，並非檔案。不推測檔案熱度或衝突。',footer:'完成狀態是宿主提供的回報，不表示交付已驗收。排列沒有時間軸或相依關係的含義。',empty:'此快照沒有已授權的 Session。',noProject:'未屬於 Project',fresh:'摘要新鮮',stale:'可能過時',unknownFresh:'新鮮度不明',disconnected:'連線中斷 · 保留的摘要已視為過時',awaiting:'等待新的快照',motionStopped:'因可見性、新鮮度或輔助設定而暫停動態',connected:'已授權摘要 · 檔案圖層不可用',complete:'回報完成不表示已審閱或接受。',opening:'正在開啟…',error:'無法開啟此 Session。重新選取後可再試一次。',noOpen:'需要新鮮資料才能前往。',scope:'目前所有已授權的 Project',count:(p,s)=>`${p} 個工作區 · ${s} 個 Session`,states:{ready:'準備就緒',working:'工作中',holding:'暫停中',waiting_you:'等待你回覆',waiting_session:'等待其他 Session',unknown:'狀態不明',milestone_complete:'階段回報完成',work_complete:'工作回報完成'}}};
const $=id=>document.getElementById(id),el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
let view,context={language:'en',visible:false,reducedMotion:true,connection:'disconnected'},rows=[],selected=null,listMode=false,still=false,stream=null,revision=-1,awaiting=true,busy=false,failed=false;
const t=()=>context.language.startsWith('zh')?words.zh:words.en;
const fresh=row=>context.connection==='connected'&&!awaiting?row.freshness:'stale';
function split(items,x,y,w,h){if(!items.length)return[];if(items.length===1)return[{row:items[0],x,y,w,h}];const n=Math.ceil(items.length/2),ratio=n/items.length;return w>h?[...split(items.slice(0,n),x,y,w*ratio,h),...split(items.slice(n),x+w*ratio,y,w*(1-ratio),h)]:[...split(items.slice(0,n),x,y,w,h*ratio),...split(items.slice(n),x,y+h*ratio,w,h*(1-ratio))]}
function groups(){const map=new Map();for(const row of rows){const key=row.project?.ref??null;if(!map.has(key))map.set(key,{key,label:row.project?.label??t().noProject,rows:[]});map.get(key).rows.push(row)}return [...map.values()].sort((a,b)=>String(a.key).localeCompare(String(b.key))).map(g=>({...g,rows:g.rows.sort((a,b)=>a.ref.localeCompare(b.ref))}))}
function stateNode(row){const node=el('span','state');node.dataset.state=row.workState;node.append(el('span','dot'),el('span','',t().states[row.workState]??t().states.unknown));return node}
function choose(ref){selected=ref;failed=false;render()}
function cell(row,isList){const w=t(),button=el('button',isList?'list-row':'cell');button.dataset.ref=row.ref;button.dataset.state=row.workState;button.dataset.freshness=fresh(row);button.classList.toggle('selected',selected===row.ref);button.setAttribute('aria-pressed',String(selected===row.ref));const title=el('span',isList?'list-title':'cell-title',row.title);button.append(title);if(isList)button.append(el('span','list-meta',row.project?.label??w.noProject));button.append(stateNode(row));button.append(el('span','freshness',fresh(row)==='fresh'?w.fresh:fresh(row)==='stale'?w.stale:w.unknownFresh));button.title=[row.title,row.project?.label??w.noProject,w.states[row.workState],fresh(row)==='fresh'?w.fresh:fresh(row)==='stale'?w.stale:w.unknownFresh].join(' · ');button.onclick=()=>choose(row.ref);return button}
function motion(){const on=!still&&context.visible&&!context.reducedMotion&&context.connection==='connected'&&!awaiting&&rows.some(r=>r.freshness==='fresh'&&r.workState==='working');document.body.dataset.motion=on?'on':'off'}
function render(){const w=t();document.documentElement.lang=context.language.startsWith('zh')?'zh-Hant-TW':'en';for(const[id,key]of Object.entries({title:'title',kicker:'kicker',overview:'overview',explain:'explain',selectionLabel:'selection',fileTitle:'fileTitle',layerLabel:'layer',fileBadge:'unavailable',fileNote:'fileNote',boundary:'boundary',footer:'footer',empty:'empty',mapButton:'map',listButton:'list',stillButton:'still'}))$(id).textContent=w[key];$('scope').textContent=w.scope;$('legend').setAttribute('aria-label',context.language.startsWith('zh')?'狀態說明':'State legend');$('stillButton').setAttribute('aria-pressed',String(still));$('mapButton').setAttribute('aria-pressed',String(!listMode));$('listButton').setAttribute('aria-pressed',String(listMode));$('map').hidden=listMode||!rows.length;$('list').hidden=!listMode||!rows.length;$('empty').hidden=!!rows.length;
const grouped=groups();$('counts').textContent=w.count(grouped.length,rows.length);$('map').replaceChildren();$('list').replaceChildren();for(const g of grouped){const section=el('section','project'),head=el('div','project-head');head.append(el('span','project-name',g.label),el('span','project-count',String(g.rows.length)+' Sessions'));const cells=el('div','cells');section.append(head,cells);$('map').append(section);const width=cells.clientWidth,height=Math.max(160,Math.ceil(g.rows.length/Math.max(1,Math.floor(width/185)))*128);cells.style.height=height+'px';for(const rect of split(g.rows,0,0,width,height)){const button=cell(rect.row,false);Object.assign(button.style,{left:rect.x+'px',top:rect.y+'px',width:Math.max(0,rect.w-5)+'px',height:Math.max(0,rect.h-5)+'px'});cells.append(button)}for(const row of g.rows)$('list').append(cell(row,true))}
$('legend').replaceChildren(...Object.keys(w.states).map(workState=>stateNode({workState})));const row=rows.find(r=>r.ref===selected);if(!row)selected=null;$('detailHeading').textContent=row?(row.project?.label??w.noProject):w.choose;$('detailTitle').textContent=row?.title??'';$('detailFields').replaceChildren();if(row){$('detailFields').append(stateNode(row),el('p','',fresh(row)==='fresh'?w.fresh:fresh(row)==='stale'?w.stale:w.unknownFresh))}else $('detailFields').textContent=w.chooseNote;$('completionNote').textContent=row&&['milestone_complete','work_complete'].includes(row.workState)?w.complete:row&&fresh(row)!=='fresh'?w.noOpen:'';$('openButton').textContent=busy?w.opening:w.open;$('openButton').disabled=!row||fresh(row)!=='fresh'||busy;$('error').textContent=failed?w.error:'';$('connection').textContent=context.connection!=='connected'?w.disconnected:awaiting?w.awaiting:w.connected;motion()}
function snapshot(next){if(!next||!Array.isArray(next.sessions))return;if(stream===next.streamId&&next.revision<=revision)return;stream=next.streamId;revision=next.revision;rows=next.sessions;awaiting=context.connection!=='connected';render()}
$('mapButton').onclick=()=>{listMode=false;render()};$('listButton').onclick=()=>{listMode=true;render()};$('stillButton').onclick=()=>{still=!still;render()};$('openButton').onclick=async()=>{const row=rows.find(r=>r.ref===selected);if(!row||fresh(row)!=='fresh'||busy)return;busy=true;failed=false;render();try{await view.sessions.open(row.ref)}catch{failed=true}finally{busy=false;render()}};document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(selected){selected=null;render()}else view?.close().catch(()=>{failed=true;render()})}});let resize;window.addEventListener('resize',()=>{cancelAnimationFrame(resize);resize=requestAnimationFrame(render)});
render();connectViewPlugin().then(async api=>{view=api;view.onContext(next=>{if(next.connection==='disconnected')awaiting=true;context=next;render()});snapshot(await view.sessions.subscribe(snapshot))}).catch(()=>{context.connection='disconnected';render()});
})();
</script></body></html>
