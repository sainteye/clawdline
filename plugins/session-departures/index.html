<script>
(()=>{"use strict";
const $=id=>document.getElementById(id), states=['waiting_you','working','ready','holding','waiting_session','unknown','milestone_complete','work_complete'];
const copy={en:{title:'Session Departures',eyebrow:'CLAWDLINE / WORK DEPARTURES',still:'Still mode',list:'Readable list',close:'Close',scope:'All authorized Sessions',priority:'Waiting for you first. Every Session stays on the board.',count:'Sessions',number:'No.',session:'Session / destination',project:'Project',state:'Reported state',detail:'SELECTED SESSION',choose:'Choose a Session',chooseNote:'Select a row to read its full name and open it deliberately.',open:'Open this Session',none:'No Project',freshness:'Freshness',fresh:'Current reading',stale:'May be stale',unknownFresh:'Freshness unknown',disconnected:'Disconnected · retained readings are stale. Waiting for a fresh snapshot.',refreshing:'Reconnected · waiting for a fresh snapshot.',empty:'No Sessions in the current reading.',footnote:'States are host reports. Reported completion is not acceptance. No departure time or ETA is supplied.',staleNote:'Opening is unavailable until this Session has a current reading.',doneNote:'Reported completion has not been accepted or verified by this view.',motion:'Motion paused by host',failure:'Could not open this Session',unavailable:'The Clawdline host is unavailable. Open this package from View plugins.',waiting_you:'Waiting for you',working:'Working',ready:'Ready',holding:'On hold',waiting_session:'Waiting for Session',unknown:'Unknown state',milestone_complete:'Milestone reported complete',work_complete:'Work reported complete'},

let ctx={language:'en',visible:true,reducedMotion:true,connection:'disconnected'},view=null,rows=[],selected=null,still=false,list=false,awaiting=true,stream='',revision=-1,changed=new Set();
const t=()=>copy[ctx.language?.startsWith('zh')?'zh':'en'];
const freshText=f=>f==='unknown'?t().unknownFresh:t()[f];
function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el}
function freshness(row){return ctx.connection!=='connected'||awaiting?'stale':row.freshness}
function motion(){document.body.classList.toggle('still',still||!ctx.visible||ctx.reducedMotion||ctx.connection!=='connected'||awaiting);$('still').setAttribute('aria-pressed',String(still));$('still').title=ctx.reducedMotion||!ctx.visible?t().motion:''}
function renderDetail(){const c=t(),r=rows.find(r=>r.ref===selected),body=$('detailBody');body.replaceChildren();$('detailLabel').textContent=c.detail;if(!r){body.append(node('h2',c.choose),node('p',c.chooseNote,'note'));return}body.append(node('h2',r.title));const dl=node('dl');for(const [label,value]of [[c.project,r.project?.label??c.none],[c.state,c[r.workState]??c.unknown],[c.freshness,freshText(freshness(r))??c.unknownFresh]]){dl.append(node('dt',label),node('dd',value))}body.append(dl);const open=node('button',c.open,'open');open.id='open';open.disabled=freshness(r)!=='fresh';open.onclick=async()=>{if(freshness(r)!=='fresh'||!view)return;open.disabled=true;$('error').hidden=true;try{await view.sessions.open(r.ref)}catch(e){$('error').textContent=c.failure+' · '+(e.code||'host_unavailable');$('error').hidden=false;if(open.isConnected)open.disabled=freshness(r)!=='fresh'}};body.append(open);if(freshness(r)!=='fresh')body.append(node('p',c.staleNote,'note'));if(r.workState.endsWith('_complete'))body.append(node('p',c.doneNote,'note'))}
function render(){const c=t();document.documentElement.lang=ctx.language?.startsWith('zh')?'zh-Hant-TW':'en';document.title=c.title;for(const [id,key]of Object.entries({title:'title',eyebrow:'eyebrow',still:'still',list:'list',close:'close',priority:'priority',countLabel:'count',numberLabel:'number',sessionLabel:'session',projectLabel:'project',stateLabel:'state',empty:'empty',footnote:'footnote'}))$(id).textContent=c[key];$('scope').textContent=ctx.scopeLabel||c.scope;$('count').textContent=String(rows.length);$('list').setAttribute('aria-pressed',String(list));document.body.classList.toggle('list-mode',list);$('connection').hidden=ctx.connection==='connected'&&!awaiting;$('connection').textContent=ctx.connection==='connected'?c.refreshing:c.disconnected;const container=$('rows'),focusRef=document.activeElement?.dataset.ref;container.replaceChildren();const sorted=rows.map((r,i)=>({r,i})).sort((a,b)=>(a.r.workState==='waiting_you'?0:1)-(b.r.workState==='waiting_you'?0:1)||a.i-b.i);sorted.forEach(({r},i)=>{const f=freshness(r),button=node('button',undefined,'row '+r.workState+(r.ref===selected?' selected':'')+(changed.has(r.ref)&&f==='fresh'&&r.workState!=='unknown'?' changed':''));button.dataset.ref=r.ref;button.dataset.freshness=f;button.setAttribute('aria-pressed',String(r.ref===selected));button.append(node('span',String(i+1).padStart(2,'0'),'ordinal'));const name=node('span',undefined,'name');name.append(node('span',r.title),node('span',r.project?.label??c.none,'mobile-project'));button.append(name,node('span',r.project?.label??c.none,'project'));const state=node('span',undefined,'state-wrap');state.append(node('span',c[r.workState]??c.unknown,'state'),node('span',freshText(f)??c.unknownFresh,'freshness'+(f==='fresh'?'':' warn')));button.append(state);button.onclick=()=>{selected=r.ref;changed.clear();render();$('open')?.focus({preventScroll:true});if(matchMedia('(max-width:700px)').matches)$('detail').scrollIntoView({behavior:'instant',block:'nearest'})};container.append(button)});$('empty').hidden=rows.length!==0;renderDetail();if(focusRef)Array.from(container.children).find(el=>el.dataset.ref===focusRef)?.focus({preventScroll:true});motion()}
function snapshot(s){if(s.streamId===stream&&s.revision<=revision)return;const old=new Map(rows.map(r=>[r.ref,r]));changed=new Set(s.sessions.filter(r=>old.has(r.ref)&&(old.get(r.ref).workState!==r.workState||old.get(r.ref).title!==r.title)).map(r=>r.ref));stream=s.streamId;revision=s.revision;rows=s.sessions;awaiting=ctx.connection!=='connected';if(!rows.some(r=>r.ref===selected))selected=null;render()}
$('still').onclick=()=>{still=!still;changed.clear();motion()};$('list').onclick=()=>{list=!list;changed.clear();render()};$('close').onclick=()=>view?.close().catch(showError);function showError(e){$('error').textContent=t().unavailable+' · '+(e.code||'host_unavailable');$('error').hidden=false}
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(selected){selected=null;render()}else view?.close().catch(showError)});render();connectViewPlugin().then(async api=>{view=api;api.onContext(context=>{if(ctx.connection!==context.connection)awaiting=true;ctx=context;changed.clear();render()});snapshot(await api.sessions.subscribe(snapshot))}).catch(showError);
})();
</script></body></html>
