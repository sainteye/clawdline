<style>
:root{font:14px system-ui,sans-serif;color:#eee5cf;background:#171113;--surface:#21181a;--edge:#766044;--muted:#c5bba9;--accent:#f4ca6d;--alert:#ff9d86}*{box-sizing:border-box}body{margin:0;min-width:0}button{font:inherit;cursor:pointer;color:inherit;background:var(--surface);border:1px solid var(--edge);min-height:44px;padding:8px 12px}button:hover{filter:brightness(1.18)}button:focus-visible,canvas:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}button:disabled{opacity:.5;cursor:default}h1,h2,p{margin:0}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:linear-gradient(#392726,#171113);border-bottom:3px double #ac8650}h1{font:700 21px Codecraft,Georgia,serif;color:#f5d887}header .brand{flex:1;min-width:160px}#scope{font-size:11px;color:var(--muted);margin-top:4px}nav{display:flex;gap:6px;flex-wrap:wrap}nav button{font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 308px;height:max(440px,calc(100dvh - var(--header-height,90px) - 100px));min-height:0}.world{min-width:0;position:relative;display:flex;flex-direction:column;background:#1d2921}.viewport{position:relative;flex:1;min-height:0;overflow:hidden}#scene{display:block;width:100%;height:100%;position:absolute;touch-action:none;cursor:grab}#scene.dragging{cursor:grabbing}.hud{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}.hud span{background:#171113df;border:1px solid #96723b;padding:7px 10px;font-size:12px;line-height:1.5;text-shadow:0 1px #000}.hud #warning{color:#ffc8a9;max-width:50%}#empty{position:absolute;inset:40% 10% auto;text-align:center;background:#171113ed;padding:24px;border:2px solid #b2945b;line-height:1.7}#minimap{display:block;width:100%;height:60px;border-top:2px solid #a98546;cursor:crosshair;background:#223825;touch-action:none}#sceneTools{padding:8px 12px;display:flex;gap:8px;align-items:center;flex- :var(--surface);border-bottom:1px solid var(--edge)}#district-label{flex:1;text-align:center;font-size:12px}body.kaiju{--surface:#f1e9d9;--edge:#a39378;--muted:#635c50;--accent:#a94021;--alert:#a73327;color:#2b2721;background:#f6f5f1}body.kaiju header{background:#f6f5f1;border-color:#bca97d}body.kaiju h1{font-family:system-ui,sans-serif;color:#713b2b;letter-spacing:2px}body.kaiju .world{background:#f6f5f1}body.kaiju aside{background:#ede7d9;border-color:#bca97d}body.kaiju .heading{font-family:system-ui,sans-serif;color:#713b2b}body.kaiju #detail button{background:#754630;color:#fff3d5}body.kaiju .row{background:#f3e7c9;box-shadow:2px 2px #b4a58a;color:#322a22}body.kaiju #search{background:#faf8f2;color:#322a22}body.kaiju footer{background:#e7dfcc}body.kaiju #sceneTools{background:#eee7d8}body.kaiju #districts{display:flex}body.kaiju #minimap{display:none}body.kaiju #sceneTools .world-only{display:none}body.kaiju #scene{cursor:pointer}body.kaiju .hud span{background:#f7efdfee;color:#4f402d;border-color:#a39378;text-shadow:none}body.kaiju #empty{background:#f3e7c9;color:#4f402d}body.kaiju.night{color:#eadbb9;background:#0e1117;--surface:#242936;--edge:#53596b;--muted:#c5bcaa;--accent:#ffd877;--alert:#ffb69d}body.kaiju.night header,body.kaiju.night .world{background:#0e1117}body.kaiju.night aside,body.kaiju.night footer,body.kaiju.night #sceneTools{background:#171c28}body.kaiju.night .row,body.kaiju.night #search{background:#2b2721;color:#eadbb9}body.kaiju.night h1,body.kaiju.night .heading{color:#ffd877}body.list-mode .world{display:none}body.list-mode .layout{display:block;min-height:0}body.list-mode aside{border:0;max-width:1000px;margin:auto}body.list-mode .register{max-height:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}body.list-mode #detail{min-height:0}body.list-mode #search{max-width:480px}[hidden]{display:none!important}@media(max-width:700px){header{padding:10px;gap:8px}header h1{font-size:18px}header .brand{width:100%}nav{width:100%}nav button{flex:1;padding:8px 6px}.layout{display:flex;flex-direction:column;min-height:0;height:auto}.viewport{height:450px;min-height:0;flex:none}.kaiju .viewport{height:auto;aspect-ratio:5/6}aside{border-left:0;border-top:3px double #a17f46;padding:14px}.register{max-height:420px}#detail{min-height:0}#scope{font-size:10px}.hud{left:10px;right:10px}.hud span{font-size:10px;padding:5px 7px}#minimap{height:46px}}

.codecraft .layout{grid-template-columns:262px minmax(0,1fr)}.codecraft aside{grid-column:1;grid-row:1;border-left:0;border-right:3px double #a17f46}.codecraft .world{grid-column:2;grid-row:1}.codecraft #minimap-home{margin:-14px -14px 14px}.codecraft #minimap{border-top:0;border-bottom:2px solid #a98546}aside{overflow:auto}.list-mode .layout{height:auto}.list-mode aside{overflow:visible}
#annotations{position:absolute;inset:0;pointer-events:none}.status-marker,.project-marker{position:absolute;pointer-events:auto;min-width:44px;min-height:44px;padding:2px;display:flex;align-items:center;justify-content:center;gap:2px;background:#171113ed;border:1px solid #b2945b;color:#ffe4a2;font-size:11px;line-height:1.3;box-shadow:0 2px 6px #0008}.status-marker img{width:22px;height:34px;object-fit:contain;pointer-events:none}.project-marker{max-width:180px;flex-direction:column;padding:4px 7px;background:var(--surface);color:inherit;border-color:var(--edge);overflow-wrap:anywhere}.project-marker b{font:600 11px system-ui;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.project-marker small{font:10px system-ui}.status-marker{width:64px;height:44px;background:transparent;border-color:transparent;box-shadow:none}.status-marker>span{background:#171113ed;border:1px solid #b2945b;padding:2px;color:#ffe4a2}.status-marker.selected{outline:2px solid #ffe4a2;background:#17111399}
#scene-label{position:absolute;left:0;top:0;width:max-content;max-width:min(300px,calc(100% - 8px));padding:7px 9px;text-align:left;background:#171113f2;color:#ffe4a2;border:1px solid #e1c183;font-size:12px;line-height:1.45;overflow-wrap:anywhere;white-space:normal;box-shadow:0 2px 12px #0009;z-index:2}#scene-label .hero-name{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600}#scene-label small{display:block;color:var(--muted);font-size:11px;margin-top:3px}#scene-label button{display:block;width:100%;margin-top:6px;background:#e1c183;color:#21170f;min-height:44px}
#selection{color:inherit;background:var(--surface);border:1px solid var(--edge);padding:0;width:min(540px,calc(100% - 24px));max-height:80dvh;overflow:auto;box-shadow:0 12px 48px #000b}#selection::backdrop{background:#0007}.selection-heading{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);position:sticky;top:0;z-index:1;border-bottom:1px solid var(--edge)}.selection-heading h2{font-size:15px;flex:1}.selection-heading button{flex:none}#selection-content{padding:0 14px}#selection #detail{min-height:0;border:0}#selection #open-session{position:sticky;bottom:0;z-index:1}#detail .project-member{display:block;text-align:left;overflow-wrap:anywhere;width:100%;margin-top:6px;font-size:12px;font-weight:400;background:var(--surface);color:inherit}#detail .project-member[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:-2px}#detail .cast-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}#detail .cast-controls button{width:auto;margin:0;flex:1}#detail .cast-controls p{flex-basis:100%;font-size:11px}#detail .member-heading{margin-top:16px;font-weight:600}

<header><div class="brand"><h1 id="title"></h1><p id="scope"></p></div><nav><button id="still" aria-pressed="false"></button><button id="list" aria-pressed="false"></button><button id="lighting"></button><button id="close"></button></nav></header>
