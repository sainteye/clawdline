<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Session scene</title>

<style>
:root{font:14px system-ui,sans-serif;color:#eee5cf;background:#171113;--surface:#21181a;--edge:#766044;--muted:#c5bba9;--accent:#f4ca6d;--alert:#ff9d86}*{box-sizing:border-box}body{margin:0;min-width:0}button{font:inherit;cursor:pointer;color:inherit;background:var(--surface);border:1px solid var(--edge);min-height:44px;padding:8px 12px}button:hover{filter:brightness(1.18)}button:focus-visible,canvas:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}button:disabled{opacity:.5;cursor:default}h1,h2,p{margin:0}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:linear-gradient(#392726,#171113);border-bottom:3px double #ac8650}h1{font:700 21px Codecraft,Georgia,serif;color:#f5d887}header .brand{flex:1;min-width:160px}#scope{font-size:11px;color:var(--muted);margin-top:4px}nav{display:flex;gap:6px;flex-wrap:wrap}nav button{font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 308px;min-height:calc(100vh - 90px)}.world{min-width:0;position:relative;display:flex;flex-direction:column;background:#1d2921}.viewport{position:relative;flex:1;min-height:480px;overflow:hidden}#scene{display:block;width:100%;height:100%;position:absolute;touch-action:none;cursor:grab}#scene.dragging{cursor:grabbing}.hud{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}.hud span{background:#171113df;border:1px solid #96723b;padding:7px 10px;font-size:12px;line-height:1.5;text-shadow:0 1px #000}.hud #warning{color:#ffc8a9;max-width:50%}#empty{position:absolute;inset:40% 10% auto;text-align:center;background:#171113ed;padding:24px;border:2px solid #b2945b;line-height:1.7}#minimap{display:block;width:100%;height:60px;border-top:2px solid #a98546;cursor:crosshair;background:#223825;touch-action:none}#sceneTools{padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted);background:#1c1517}#sceneTools button{font-size:14px;min-width:44px}#hint{flex:1}aside{padding:14px;background:linear-gradient(100deg,#2a2020,#171113);border-left:3px double #a17f46;min-width:0}.heading{font:700 15px Codecraft,Georgia,serif;color:#f2d78c;text-transform:uppercase;letter-spacing:.5px}#detail{padding:16px 0 18px;border-bottom:1px solid var(--edge);min-height:185px}#detail h2{font-size:17px;overflow-wrap:anywhere;line-height:1.5;margin:8px 0}#detail p{font-size:12px;color:var(--muted);line-height:1.7;overflow-wrap:anywhere}#detail button{width:100%;margin-top:12px;background:#e1c183;color:#21170f;font-weight:600}#rosterHead{display:flex;align-items:center;justify-content:space-between;margin:16px 0 10px}#search{width:100%;padding:10px;min-height:44px;margin-bottom:10px;border:1px solid var(--edge);background:#120f12;color:inherit;font:inherit}.register{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto}.row{display:flex;gap:8px;align-items:center;min-width:0;text-align:left;width:100%;padding:9px 10px;background:#241d20}.row.selected{outline:2px solid var(--accent);outline-offset:-2px}.row .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--tone)}.row .name{display:block;font-size:12px;font-weight:600;overflow-wrap:anywhere}.row .meta{display:block;color:var(--muted);font-size:11px;line-height:1.5;overflow-wrap:anywhere;margin-top:4px}.row>span:last-child{min-width:0;flex:1}footer{background:#151014;padding:14px 16px;color:var(--muted);font-size:11px;line-height:1.7;border-top:1px solid var(--edge)}#legend{display:flex;flex-wrap:wrap;gap:5px 14px;margin-bottom:8px}#legend span:before{content:'●';color:var(--tone);margin-right:5px}#adaptation{margin-bottom:8px}details pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:10px}#error{color:var(--alert);padding-top:6px;overflow-wrap:anywhere}#districts{display:none;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--edge)}#district-label{flex:1;text-align:center;font-size:12px}body.kaiju{--surface:#f1e9d9;--edge:#a39378;--muted:#635c50;--accent:#a94021;--alert:#a73327;color:#2b2721;background:#f6f5f1}body.kaiju header{background:#f6f5f1;border-color:#bca97d}body.kaiju h1{font-family:system-ui,sans-serif;color:#713b2b;letter-spacing:2px}body.kaiju .world{background:#f6f5f1}body.kaiju aside{background:#ede7d9;border-color:#bca97d}body.kaiju .heading{font-family:system-ui,sans-serif;color:#713b2b}body.kaiju #detail button{background:#754630;color:#fff3d5}body.kaiju .row{background:#f3e7c9;box-shadow:2px 2px #b4a58a;color:#322a22}body.kaiju #search{background:#faf8f2;color:#322a22}body.kaiju footer{background:#e7dfcc}body.kaiju #sceneTools{background:#eee7d8}body.kaiju #districts{display:flex}body.kaiju #minimap{display:none}body.kaiju #sceneTools .world-only{display:none}body.kaiju #scene{cursor:pointer}body.kaiju .hud span{background:#f7efdfee;color:#4f402d;border-color:#a39378;text-shadow:none}body.kaiju #empty{background:#f3e7c9;color:#4f402d}body.kaiju.night{color:#eadbb9;background:#0e1117;--surface:#242936;--edge:#53596b;--muted:#c5bcaa;--accent:#ffd877;--alert:#ffb69d}body.kaiju.night header,body.kaiju.night .world{background:#0e1117}body.kaiju.night aside,body.kaiju.night footer,body.kaiju.night #sceneTools{background:#171c28}body.kaiju.night .row,body.kaiju.night #search{background:#2b2721;color:#eadbb9}body.kaiju.night h1,body.kaiju.night .heading{color:#ffd877}body.list-mode .world{display:none}body.list-mode .layout{display:block;min-height:0}body.list-mode aside{border:0;max-width:1000px;margin:auto}body.list-mode .register{max-height:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}body.list-mode #detail{min-height:0}body.list-mode #search{max-width:480px}[hidden]{display:none!important}@media(max-width:700px){header{padding:10px;gap:8px}header h1{font-size:18px}header .brand{width:100%}nav{width:100%}nav button{flex:1;padding:8px 6px}.layout{display:flex;flex-direction:column;min-height:0}.viewport{height:450px;min-height:0;flex:none}.kaiju .viewport{height:490px}aside{border-left:0;border-top:3px double #a17f46;padding:14px}.register{max-height:420px}#detail{min-height:0}#scope{font-size:10px}.hud{left:10px;right:10px}.hud span{font-size:10px;padding:5px 7px}#minimap{height:46px}}
