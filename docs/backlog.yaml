# Backlog — what is not done, what might be done, what is deliberately not being done.
#
# **This is data, not prose.** Nothing here is a promise. The point of the file is that a thing
# somebody noticed on a Tuesday is still findable in November, with enough written down that the
# person reading it can tell whether it is still true.
#
# Modelled on the backlog in another project of this author's, and the one idea worth stealing is
# this one:
#
# ## `lane` is derived, never typed
#
# `lane` comes from `severity` x `cost`. **No field here lets anybody set a priority directly**,
# and that is the whole design. Every P0/P1/P2 scheme ends the same way — each item is filed by
# the person who cares most about it, so within a year everything is P0 and the scheme carries no
# information. There are exactly two ways to move an item forward here: show that it hurts more
# (`severity`), or make it smaller (`cost`). Both require thinking, and that friction is the point.
#
#     severity \ cost   hours       days        weeks
#     blocks            now         now         scheduled
#     degrades          now         scheduled   waiting
#     noise             scheduled   waiting     drop
#     invisible         waiting     drop        drop
#
# ## Writing an entry is meant to be slightly hard
#
# Adding a line to a markdown list costs nothing, so "I'll put it in the backlog" becomes a way of
# deferring a problem rather than recording one. These fields exist to stop that:
#
# | field        | what it must answer                                          |
# |--------------|--------------------------------------------------------------|
# | `id`         | `B-<short-name>`. **Not a number** — numbers imply an order   |
# | `title`      | one line; when the list is long this is all anybody reads     |
# | `problem`    | **what goes wrong if nobody does this** — not what to build   |
# | `evidence`   | why we believe it: a path, a commit, a date, a measurement.   |
# |              | No anchor means it must start with "Guess:"                   |
# | `severity`   | blocks / degrades / noise / invisible                          |
# | `cost`       | hours / days / weeks — **a timebox, not an estimate**          |
# | `who_hurts`  | user / contributor / us                                        |
# | `trigger`    | what would have to happen to reconsider this                   |
# | `opened`     | the date it went in. **How long an item has sat with its**      |
# |              | **trigger never firing is the best deletion signal we have**   |
#
# `problem` must not begin with a verb that names a solution ("add", "build", "support"). If the
# only way you can describe it is by what you would build, you have not found the problem yet.
#
# ## What is not in here
#
# Bugs with a reproduction go straight to being fixed; this is for things nobody has decided
# about. Anything already being worked on is not here either — that is what the working tree is.

version: 1

# Where the count links to. A path is generated from this file on every count; an `https://` value
# is treated as somebody else's page and left alone, which is what a project with a hosted backlog
# would use. This one has nowhere to host anything, so it is a local file — and `artifacts/` is
# ignored by git, so the page is yours and never travels.
artifact: artifacts/backlog.html

items:
  - id: B-SCHEDULE-WITHOUT-A-SESSION
    title: A scheduled chore with no judgement in it still opens a whole assistant session
    problem: >-
      A schedule's only shape is a dispatch, so every run starts a full assistant: system prompt,
      tool schemas, the machine's own instruction files, a briefing, and then a handful of tool
      calls that a shell script could have made. The daily forecast on this machine says in its own
      instructions that it reads no project file and writes to no repository — it fetches one JSON
      document and pushes one notification — and it costs between 672,030 and 705,879 tokens a run.
      What is missing is a schedule that runs a command and only escalates to a session when the
      command fails, which is most of what these chores actually are.
    evidence: >-
      Five recorded runs of three daily chores cost 9,380,031 tokens and $8.52, 4.0% of every task
      this machine has dispatched, to produce 51,337 output tokens between them. The forecast run
      spends its whole budget in 34-50 seconds of wall clock, so almost none of it is work: it is
      the session's standing context read once per turn. POST /v1/orchestrator/notify already
      accepts the machine credential, so the notification half needs no agent at all. Measured
      2026-08-28.
    severity: degrades
    cost: days
    who_hurts: us
    trigger: >-
      Write the forecast as a shell script pushing through /v1/orchestrator/notify, run it beside
      the scheduled session for a week, and compare what the person receives. If the two are
      indistinguishable, the feature is a `command` field on a schedule plus an escalate-on-failure
      dispatch.
    opened: 2026-08-28

  - id: B-WORKTREE-COLD-CACHE
    title: An isolated task rebuilds from nothing and burns 1.5x the tokens per second
    problem: >-
      A fresh checkout has no build cache and none of the gitignored dependencies the shared tree
      already holds, so an isolated child spends its first minutes re-fetching and re-compiling
      what was sitting on disk the whole time. The protocol asks for isolation on exactly the
      large, long-running slices, which is where that cost is largest.
    evidence: >-
      Across 138 Codex dispatches on this machine, isolated tasks ran at a median 8,185 tokens per
      second against 5,375 for shared-tree ones, a ratio of 1.52x. Total tokens ran 2.03x, but that
      is confounded — the policy sends bigger work to isolation on purpose. The per-second gap is
      the part selection effects do not explain. Measured in the token-economics review, 2026-08-28.
    severity: degrades
    cost: days
    who_hurts: us
    trigger: >-
      Seed a read-only build cache into a new worktree and compare tokens per second against the
      8,185 median. Below about 6,000 and the effect is real. It must stay read-only: sharing a
      writable build directory puts back the cross-session interference isolation exists to stop.
    opened: 2026-08-28

  - id: B-ROUND-BUDGET-RESEARCH
    title: Nothing budgets a session's rounds, and rounds are what the bill is actually made of
    problem: >-
      The protocol caps every input it can name — the policy at 12,000 characters, the plan at
      4,096, instructions at 16 KiB — and caps nothing about output or the number of turns taken.
      But output is a quarter of the bill and it is not report length: an 8,000-character artifact
      is about 2% of a session's output tokens, and the rest is thinking, tool arguments and
      per-turn text. The meter runs on time, not on answer size. This is the one recommendation in
      the token-economics review marked a trade rather than waste, and it is open deliberately:
      red-before-green tests, independent review and claims all cost rounds, because that is what
      they are, and a budget set too tight buys twenty saved minutes with a defect nobody found. It
      is plausible only for research and survey nodes, where the work is reading rather than
      proving, and it must never reach a code or a review node.
    evidence: >-
      2,247,280 output tokens at $25/M is 25.8% of the bill; corr(elapsed seconds, total tokens)
      = 0.718; tokens per second is tightly bounded (p10-p90 of 3,092-13,371, median 6,681), so a
      session costs roughly 400k tokens per extra minute alive. Measured 2026-08-28.
    severity: noise
    cost: days
    who_hurts: us
    trigger: >-
      Give the next ten research-shaped tasks a stated round budget in their instructions and
      compare median output and total against the current medians. Do not extend it past research
      nodes on a good result alone.
    opened: 2026-08-28

  - id: B-NO-SELF-UPDATE
    title: A downloaded app has no way to learn a newer one exists
    problem: >-
      Somebody who downloads a release is on that release forever. They will not watch the
      repository, and nothing on their Mac ever mentions that a newer build shipped — so the
      version they first installed is the version they keep. That is worse here than for most
      apps, because what this reads is Claude Code's own screen, and Claude Code updates itself
      constantly: a build checked against one release keeps working until the shape of a spinner
      or a dialog moves, and then it stops reading sessions correctly and says nothing. The
      failure is silent and looks like the sessions being idle.
    evidence: >-
      `Sources/Compat.swift` records which Claude Code version each release was checked against
      precisely because that coupling is real; the 0.6.0 row names two dependencies that would
      break quietly. Nothing in the app or in `build.sh` checks for a newer release, and the app
      is ad-hoc signed, which is what makes the usual updater route hard rather than routine.
    severity: degrades
    cost: weeks
    who_hurts: user
    trigger: >-
      The first release that breaks against a Claude Code update — after which everybody still on
      an older build is broken and has no way to find out.
    opened: 2026-08-19

  - id: B-API-ERRORS-ENGLISH
    title: API error messages are hardcoded English and the page shows them verbatim
    problem: >-
      Every string a person can read went through `Copy` and got fourteen languages, except the
      `message` field of an API error — which is exactly the text somebody sees at the moment
      something has gone wrong and they least want to be reading a second language.
    evidence: >-
      `Sources/RemoteServer.swift` — every `.error(...)` call carries an English literal;
      `Resources/web/index.html` renders `error.message` as-is.
    severity: degrades
    cost: days
    who_hurts: user
    trigger: Anybody reports the page saying something they cannot read, or a fifteenth language.
    opened: 2026-08-19

  - id: B-CACHE-KEY-DIVERGENCE
    title: Clawdline and claude-bestiary compute different cache filenames for the same project
    problem: >-
      Two readers of one set of files disagree about what the files are called, so for a long or
      punctuated path one of them writes a status file the other never finds. The footer simply
      stays empty, which is indistinguishable from having nothing to say.
    evidence: >-
      bestiary's `statusline.py` sanitises every non-alphanumeric character and keeps the last 48;
      `ProjectStatus.key(forPath:)` replaces `/` only and does not truncate.
    severity: noise
    cost: hours
    who_hurts: user
    trigger: A project path over 48 characters, or one containing a dot or a space.
    opened: 2026-08-19

  - id: B-DEVICE-NEVER-EXPIRES
    title: A paired device is trusted until somebody remembers to revoke it
    problem: >-
      A phone that was paired once keeps full access forever. The failure is not dramatic — it is
      that the list of who can read your sessions grows and nothing ever prompts a review, so the
      answer to "who has access" drifts from "me" to "I would have to look".
    evidence: >-
      `Sources/RemoteAuth.swift` — no expiry field on a device; `docs/remote.md` states this
      plainly as a limitation.
    severity: degrades
    cost: days
    who_hurts: user
    trigger: More than a handful of devices in the list, or a device that is lost or sold.
    opened: 2026-08-19

  - id: B-PASSWORD-NO-UI
    title: The password path exists and nothing can set one
    problem: >-
      Half a feature is worse than none: the code, the PBKDF2 work factor and the route are all
      there and carry maintenance cost, while nobody can use any of it. Either it earns a control
      in Settings or it should be deleted.
    evidence: >-
      `RemoteAuth.setPassword` has no caller; `POST /v1/auth/password` is documented in
      `docs/remote.md` and deliberately left out of the README because it points at nothing
      pressable.
    severity: noise
    cost: hours
    who_hurts: user
    trigger: Somebody wants access from a device that cannot scan a QR code.
    opened: 2026-08-19

  - id: B-PICKER-BEYOND-NINE
    title: A menu with more than nine options cannot be answered from a phone
    problem: >-
      The picker is answered with a single byte, and there is no single byte for the tenth row.
      Somebody on a phone facing a long menu has no way through and no explanation of why.
    evidence: >-
      `Targets.answer` allowlists `0x31`–`0x39` and `0x09`; arrow keys are three bytes and
      `keystroke` sends one, so a partial send would deliver a bare `ESC`, which cancels.
    severity: noise
    cost: hours
    who_hurts: user
    trigger: The first menu anybody meets with ten or more options.
    opened: 2026-08-19

  - id: B-NOTIFY-WHEN-PRESENT
    title: "Guess: notifications fire while you are sitting at the Mac"
    problem: >-
      Guess — the notch and the menu bar have already said it, so a phone buzzing at the same
      moment carries no new information, and a channel that is usually redundant is one people
      stop reading. **Deliberately parked**: the obvious fix, suppressing while the Mac has had
      recent input, has a failure mode where a full-screen window hides the notch and the rule
      then silences both channels at once. The owner's judgement on 2026-08-19 was that the
      current volume is low, that a notification arriving is itself useful confirmation the thing
      works, and that a rule needing two signals to agree is one nobody can debug.
    evidence: >-
      `CGEventSource.secondsSinceLastEventType` verified working with no permission prompt
      (counted 3.3s -> 5.4s idle, reset to 0.0 on input). No measurement of how often this
      actually overlaps in practice.
    severity: invisible
    cost: days
    who_hurts: user
    trigger: Notification volume rises enough that somebody starts ignoring them.
    opened: 2026-08-19

  - id: B-STICKY-WRONG-PATH
    title: A transcript path chosen before the briefing lands can never be replaced
    problem: >-
      Identity is relocated only while `transcriptPath` is nil, and the marker gate that would
      catch a wrong choice is only armed while `childSessionId` is nil. A pair that lands before
      the briefing does — which is the ordinary order, since the hook supplies an exact filename
      before the file has been written — is therefore never re-examined for the life of that
      task. Today nothing writes a wrong one: the hook's filename is right by definition, and the
      unvalidated creation-time fallback that used to write bad pairs is gone. This is the
      mechanism sitting there for the next thing that writes one.
    evidence: >-
      Four reviews in a row on `Sources/Orchestrator.swift` traced this shape. The relocation
      entry is guarded on `transcriptPath == nil` and the marker gate on `childSessionId == nil`;
      with both non-nil there is no path back. The 2026-08-25 review measured the current registry
      at 86 of 86 records finding their own marker, which is why this is recorded rather than
      fixed.
    severity: noise
    cost: days
    who_hurts: user
    trigger: >-
      Anything that writes an unproven pair again — a new identity source, or a fallback added
      for a case the hook does not cover.
    opened: 2026-08-26

  - id: B-DEPTH-UNPROVEN
    title: Dispatch depth is the last consumer that trusts an unproven identity
    problem: >-
      Every other consumer of a child's session id now requires the identity to have been proved
      against the task's own briefing marker — token accounting, parent-task matching and
      cancellation all check. `depthOfNew` does not. It is the last unproven entry, and it is
      left because its error is in the safe direction: a wrong answer makes a new task deeper
      than it should be, and the depth ceiling refuses rather than permits.
    evidence: >-
      Traced in the 2026-08-26 review while confirming the proof gate reaches every consumer.
      `harvestUsage` and `provenChildSessionID` require `.belongs`; `cancelInPlace` keys on the
      terminal id; `depthOfNew` reads the session id directly.
    severity: invisible
    cost: hours
    who_hurts: user
    trigger: >-
      A change that makes depth permit rather than refuse on a bad answer, at which point the
      safe direction stops being safe.
    opened: 2026-08-26

  - id: B-UNTURNED-TRANSCRIPT-UNDISPROVABLE
    title: A complete transcript holding no user turn at all can no longer be disproved
    problem: >-
      Proving a transcript belongs elsewhere now rests on finding a completed user turn that is
      not this task's briefing, which is what let files past the scan ceiling be judged on what
      was read rather than on having read all of it. The cost is at the other end: a file that is
      complete but contains no user turn at all — an assistant that only ever wrote bookkeeping,
      or a rollout abandoned before its first message — returns unknown forever instead of
      "somebody else's".
    evidence: >-
      The 2026-08-26 review verified the new condition in both directions against a real child
      transcript (marker at byte 517, four bookkeeping rows before it) and the repository's own
      Codex fixture. The gap is the empty-of-turns case, which neither direction covers.
    severity: invisible
    cost: hours
    who_hurts: user
    trigger: >-
      A stored pair pointing at such a file, which would then be kept rather than cleared.
    opened: 2026-08-26

  - id: B-CODEX-HEADS-DOUBLE-OPTIONAL
    title: The rollout header cache carries a nested optional that no longer means anything
    problem: >-
      `Codex.heads` stores an optional inside an optional so that "looked and found nothing" could
      be told from "have not looked". Now that a failed read is no longer cached, the inner nil is
      unreachable — the cache only ever holds a header it actually read. What is left is a type
      that invites the next reader to reason about a state that cannot happen.
    evidence: >-
      Noted in the 2026-08-26 review after `Sources/Codex.swift` stopped caching nil results.
    severity: invisible
    cost: hours
    who_hurts: user
    trigger: >-
      Somebody adding a third state to that cache, or reintroducing negative caching without
      noticing the shape is already there.
    opened: 2026-08-26

  - id: B-WORKEDIN-REREADS
    title: A rollout whose header is unreadable is re-read on every lookup of where it worked
    problem: >-
      Not caching failed header reads means a rollout that had not written its first line when it
      was first opened can be proved later. The same change makes `workedIn` re-read such a file
      each time it is asked. That only happens on user-driven paths rather than on the polling
      loop, and only for rollouts that never got a header, so it is a small waste rather than a
      hot one.
    evidence: >-
      Identified in the 2026-08-26 review as the deliberate cost of removing the permanent nil
      cache in `Sources/Codex.swift`.
    severity: invisible
    cost: hours
    who_hurts: user
    trigger: >-
      A path that calls it in a loop, or a directory holding many headerless rollouts.
    opened: 2026-08-26

  - id: B-IDENTITY-CONTROL-RETIREMENT
    title: The identity transition control cannot prove agreement or define when it retires
    problem: >-
      The registry and fallback identity ladders write only when they disagree, so zero audit rows
      cannot distinguish continuous agreement from a control that never ran. Without countable
      clean comparisons there is also no defensible threshold for removing the duplicate ladder;
      the temporary control can become permanent code and I/O or be removed by intuition.
    evidence: >-
      `Sources/Orchestrator.swift` samples each distinct registry answer once but writes only
      `orchestrator.identity.mismatch`; the Stage 4b review on 2026-08-26 found zero identity
      events in 1,596 prior audit rows.
    severity: invisible
    cost: hours
    who_hurts: us
    trigger: Clean comparison receipts exist and enough accumulate to define a removal threshold.
    opened: 2026-08-26

  - id: B-HOOK-NOTE-NO-PROCESS-LINK
    title: A tty hook note cannot identify the process that emitted it
    problem: >-
      A note can be current in time and still has no field tying it to the Claude process recorded
      for the task. The pid guard proves which process occupies the tab, while the spawn-time gate
      only rejects older notes; treating those facts as a process-to-note link would reopen the
      same identity assumption this refactor removed.
    evidence: >-
      `Sources/Orchestrator.swift` reads `HookBridge.note(for:)` by tty and accepts it only when
      `note.at >= spawnedAt`; the Stage 4b review traced no pid or process-start field between the
      note and `adoptHookIdentity`.
    severity: invisible
    cost: days
    who_hurts: us
    trigger: A hook protocol gains process identity, or a current note is observed naming another process.
    opened: 2026-08-26

  - id: B-RESTART-PAIR-SPAWN-FAILURE
    title: A malformed provisional identity can exhaust briefing after restart
    problem: >-
      A spawning task restored with a malformed path and session pair loses its proof but retains
      both values. If the registry then misses, ownership correctly refuses to clear that
      pre-delivery pair and briefing eventually fails closed at the attempt ceiling instead of
      rediscovering the child. No wrong identity is accepted, but useful work never starts.
    evidence: >-
      The Stage 4b review on 2026-08-26 traced the stored malformed pair, registry miss, `.other`
      ownership and `.exhausted` decision as one chain; `Sources/Orchestrator.swift` maps that
      ceiling to `spawn_failed`.
    severity: degrades
    cost: hours
    who_hurts: user
    trigger: A real `spawn_failed` record contains a retained, unproven Claude transcript pair.
    opened: 2026-08-26

  - id: B-IDENTITY-CALLER-UNTESTABLE
    title: The live Claude identity caller cannot be exercised as one unit
    problem: >-
      Tests can verify the pure identity policies but cannot prove that the polling caller sampled
      the right external facts, applied them in the right order and handed the resulting task to
      briefing. A wiring regression can therefore leave every policy test green while production
      takes a different path.
    evidence: >-
      `noteClaudeIdentityFromLegacySources` in `Sources/Orchestrator.swift` is private and directly
      reads hook notes, transcript files, process state and the registry; the Stage 1+2 and Stage
      4b reviews both identified the missing caller-level seam.
    severity: invisible
    cost: days
    who_hurts: contributor
    trigger: The next identity-source change, or another regression that pure policy tests miss.
    opened: 2026-08-26

  - id: B-CODEX-IDENTITY-NO-PID-GUARD
    title: Codex identity has no persisted process guard
    problem: >-
      Codex locates a rollout through lsof and proves delivery with the task marker, but unlike
      Claude it does not persist and recheck the process occupying the reused tty. Adding a guard
      without evidence would enlarge a working path merely for symmetry, so the asymmetry remains
      deliberate until it causes a symptom.
    evidence: >-
      The Codex branch of `noteChildIdentity` in `Sources/Orchestrator.swift` calls
      `Codex.locate(...pid:)` without storing pid and process start; the Stage 4b review found a
      live Codex task proven by its marker and zero identity-related audit failures.
    severity: invisible
    cost: days
    who_hurts: user
    trigger: A Codex task binds to a rollout from a replaced process or reused tty.
    opened: 2026-08-26

  - id: B-PAGE-PROSE-UNCHECKED
    title: Only the protocol page's code names are checked; its sentences can go stale silently
    problem: >-
      The suite compares the refusal codes named on docs/clawdline-protocol.html against the set
      derived from Sources/Orchestrator.swift, so a code added and never documented, or documented
      and never built, is caught. Nothing checks the sentences around those codes. Two of the three
      falsehoods found on that page in one review were prose rather than names: a conditional
      success path written as though it were unconditional, and a bound that exists in the code and
      appeared nowhere on the page. Both can regress the same way again, and this is the page the
      project points the community at. The distinction worth keeping in view is that a set equality
      catches an inconsistency after it exists, while generating the text makes the inconsistency
      impossible — the difference between a check and a guarantee.
    evidence: >-
      Review 3cbbb7b7 (F1, MEDIUM) found three false claims on that page, and a previous reviewer
      had run a keyword scan over the same file and missed all three — which is why the assertion
      that landed derives its set from the source instead of listing more keywords. That closes the
      names half and leaves this half open by design rather than by oversight. 2026-08-28.
    severity: degrades
    cost: days
    who_hurts: user
    trigger: >-
      Another reviewer finding a false sentence on that page, or somebody building against it and
      hitting the gap. The shape worth trying first is generating the error code table from the
      source instead of writing it, so that section stops being prose at all — which is what
      tools/build-compatibility.py already does for the compatibility page.
    opened: 2026-08-28

  - id: B-ATTACH-GRANT-TIED-TO-TAB
    title: The attach grant is recorded against a terminal id, not the process that actually holds it
    problem: >-
      `attach_not_managed` exists to stop a follow-up being typed into a session that was never
      given `--add-dir /tmp/.clawdline`, because such a child's first act — reading its own
      `CHILD.md` — raises a permission question on a tab nobody is watching for it, and the menu
      answerer would press the first option. The guard now rests on a grant persisted when the
      process started, which is right, but the grant is keyed on the terminal id rather than on the
      process that received it. A person who restarts the assistant in that same tab gets a new
      process with no such grant, while the role and the recorded grant both survive, so the guard
      goes on saying yes to a session that can no longer read the directory. The failure is silent
      and lands exactly where the guard was built to protect.
    evidence: >-
      Independent review `3cbbb7b7` of `eda0fa76`, 2026-08-28, raised this as MEDIUM and explicitly
      marked it not a landing blocker because closing it is a design decision rather than a repair.
      The materials are already in `Sources/Orchestrator.swift` and used daily by `brief()`:
      `childPID`, `childProcStart`, and `identityStep`'s `refuseForeignProcess`, which is how child
      delivery already refuses a tty whose process was replaced.
    severity: degrades
    cost: hours
    who_hurts: user
    trigger: >-
      Restart an assistant in a standing session's tab, then dispatch a follow-up with
      `attach_session` naming it, and watch whether the child stops on a permission question. If it
      does, extend the persisted grant to carry pid and process start and compare them the way
      `refuseForeignProcess` already does.
    opened: 2026-08-28

  - id: B-SUITE-WALKS-LIVE-WORKTREES
    title: The reclaim tests walk the real worktree root, not a fixture root
    problem: >-
      The suite now covers a feature whose whole job is deleting directories, and the tests reach
      the actual worktree root this machine keeps its isolated checkouts in rather than a fixture
      directory built for the run. Nothing was deleted, and the safety checks in front of the
      deletion are real — the resolved path must equal what `worktreePath(project:taskID:)`
      computes, and a container check defeats `..` and symlinks. But the distance between "the
      guards held" and "the test could not have reached anybody's work" is the whole difference,
      and it is currently spanned by review rather than by construction. Somebody's uncommitted
      hours live in those directories.
    evidence: >-
      Independent review 3cbbb7b7 of eda0fa76, 2026-08-28, recorded it as INFO and confirmed all 19
      worktree directories were still present when it finished — which is to say it had to go and
      count them. The reclaim path is `reclaimTaskBuildIfDue` in `Sources/Orchestrator.swift`; the
      tests are the `.build` and `work/` groups in `Tests/main.swift`.
    severity: degrades
    cost: hours
    who_hurts: contributor
    trigger: >-
      Point the tests at a temporary root through the seam the suite already uses for the store,
      then delete the guards and confirm the tests still cannot touch a real checkout. If that is
      awkward to arrange, the awkwardness is the finding.
    opened: 2026-08-28

  - id: B-RECLAIM-HAS-NO-BACKFILL
    title: A task that finished before the deadline field existed never gets one
    problem: >-
      `work/` and `.build` are reclaimed on a deadline written when the task reaches a terminal
      state. Nothing gives a deadline to a task that reached its terminal state earlier, so every
      task that finished before the field shipped is invisible to the feature that exists to clean
      up after it. Those directories then wait for the 24-hour whole-task sweep, which takes the
      evidence with them, or for somebody to notice and delete them by hand. This is not a one-off
      caused by one upgrade: it is the shape of every future change to how a deadline is decided,
      so the same orphan set appears again each time.
    evidence: >-
      Measured within an hour of the feature landing, 2026-08-28. The new build was installed at
      12:50:33; `/tmp/.clawdline` held 695 MB across 23 `work/` directories and **not one of them
      carried a deadline**, because all 23 tasks finished before the build. It was cleared by hand
      for the third time that day (19 GB at 09:00, 695 MB at 13:00), which is the chore the feature
      was built to end.
    severity: degrades
    cost: hours
    who_hurts: us
    trigger: >-
      Have `cleanup()` give a reclaim deadline to any terminal task that has none, using the same
      grace rules, so the next pass collects it. Then check the disk an hour after the following
      upgrade instead of asking somebody to remember.
    opened: 2026-08-28

  - id: B-SECRETS-OUTLIVE-EVERYTHING-ELSE
    title: A task secret is still recoverable long after every trace of its task is gone
    problem: >-
      That a secret stays in the dispatching session's transcript is known and accepted —
      `skills/clawdline/SKILL.md` says so plainly, at the same trust boundary as the token file.
      What nobody wrote down is the asymmetry in how long it stays. A task directory is swept 24
      hours after the task ends, taking `task.json`, `CHILD.md`, `result.json` and the artifacts
      with it. Transcripts are swept never. So the retention policy that governs everything else
      about a task does not reach the one field the design treats as a credential, and the window
      in which a secret can be recovered is not 24 hours, it is unbounded.
    evidence: >-
      Demonstrated 2026-08-28, not reasoned about: seven task secrets were recovered from a single
      52.9 MB codex rollout under `~/.codex/sessions/2026/08/27/` by matching the exact dispatch
      body `{"task_id":"<id>","secret":"<64 hex>"}` — hours after those tasks ended, and after
      three of the seven task directories had already been swept off disk. `CHILD.md` holds only
      the literal `<TASK_SECRET>` placeholder, so the task directory was never the thing keeping
      them alive.
    severity: noise
    cost: hours
    who_hurts: us
    trigger: >-
      Not an escalation today: anything running as the user can already read
      `~/.config/clawdline/orchestrator-token`, which is strictly more powerful than any one task
      secret. It stops being noise the day a transcript is synced, shared, or attached to a report,
      because the thing travelling is then older and wider than the retention policy anybody
      reasoned about. The cheap fix is to stop putting the secret in a shell command line: hand it
      to the app through a file or a header, so the dispatch body never carries it.
    opened: 2026-08-28

  - id: B-PENDING-CANNOT-SEE-ITS-EXECUTOR
    title: A pending landing cannot tell work in progress from work whose executor was killed
    problem: >-
      A landing record has one word for two situations that need opposite responses. `pending` on a
      task somebody is actively working is a reason to wait. `pending` on a task whose session was
      closed hours ago is a reason to redispatch, and nothing in the record distinguishes them. The
      obligation therefore looks healthy while it is dead, and the longer it sits the more it looks
      like difficulty rather than absence — so the line gets ranked as hard, not as stalled, and
      everybody routes around it. What is missing is not more state on the task; it is a liveness
      fact the record already has the parts for, since every task names the root that dispatched it
      and the app already knows which sessions are alive.
    evidence: >-
      Measured 2026-08-28. Review `7555eb14` returned seven P1s at 22:53:39 on 08-27; the
      correction `9bb8eae0` was dispatched 75 seconds later at 22:54:54, ran for 25 minutes, and
      then it and three sibling tasks under the same root `01a04276` were cancelled inside a
      14-second window — 23:20:37, :41, :48, :51 — the signature of a close cascade rather than
      four decisions. The other three were the display-name final review, the numeric `pending`
      compatibility fix, and the registry accumulation cap. **The safe-close line then sat for
      fourteen hours**, and a handoff document written by the outgoing root faithfully recorded
      that the four tasks "were cancelled" without recording that they died together and why, so
      the receiving root inherited the fact and still could not act on it.
    severity: degrades
    cost: hours
    who_hurts: us
    trigger: >-
      Have `GET /v1/orchestrator/landings` answer, per row, whether the dispatching root session is
      still alive — the app already publishes session state, and the task record already names its
      root. Then read the list once and see whether anything that looks like a hard problem is
      merely an orphan.
    opened: 2026-08-28

  - id: B-STRUCTURAL-FIX-ONLY-REACHES-NEW-MACHINES
    title: A fix that seeds a file on first run never reaches a machine that has already run
    problem: >-
      A change that corrects what a config file is seeded with looks structural — it edits the
      source of truth and lands with tests — but `ensurePolicyFile()` never overwrites, so it takes
      effect only on a Mac that has never dispatched. Every machine that has already written the
      file keeps the old contents indefinitely, and nothing tells anybody that. The diff is
      complete, the tests are green, and the behaviour on every existing installation is unchanged.
      That gap is invisible in review because a reviewer reads the change, not the installed base.
      The same shape covers any seed-once file: dispatch policy today, and whatever else is written
      with a "create if absent" guard.
    evidence: >-
      `~/.config/clawdline/dispatch-policy.md` is a copy, not a symlink (own inode; it was 9,364
      bytes against the repository's 11,257 on 2026-08-28). The review-round rules landed in
      `Resources/dispatch-policy.md` and matched zero times in the file dispatch actually reads
      until a root copied it by hand; that copy is still the only thing that has moved this
      machine. `Orchestrator.defaultPolicy` additionally holds a stale literal, and `policyURL`
      points only at `~/.config/clawdline`.
    severity: degrades
    cost: hours
    who_hurts: us
    trigger: >-
      The next policy or seeded-config change that is believed to have shipped and has not. A fix
      would either migrate on version change, or make the read fall back to the bundled resource so
      the repository copy is authoritative and the local file is an override rather than the only
      source.
    opened: 2026-08-28

  - id: B-LANDING-NOTE-LIMIT-IS-UNNAMED
    title: An over-long landing note is refused without saying which field was too long
    problem: >-
      `POST /v1/orchestrator/tasks/:id/landing` answers `400 bad_request` when `note` exceeds 500
      characters, and the message does not name the field or the limit. A caller closing several
      landings in a loop gets a row of identical refusals with nothing to act on, and the natural
      reading is that the request shape is wrong rather than that one string is long. The limit is
      documented, so this costs a reader who checks the docs nothing — and costs everybody else a
      detour.
    evidence: >-
      On 2026-08-28 a root marking seven superseded landings `abandoned` had all seven refused for
      this reason and had to find the cause by reading `docs/api.md` rather than the error.
    severity: noise
    cost: hours
    who_hurts: contributor
    trigger: >-
      The next time somebody loses time to a refusal that knows exactly what is wrong with the
      request and does not say. Typed refusals elsewhere in this API name their field; this one
      should match them.
    opened: 2026-08-28
