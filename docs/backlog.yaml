# Backlog — what is not done, what might be done, what is deliberately not being done.
#
# **This is data, not prose.** Nothing here is a promise. The point of the file is that a thing
# somebody noticed on a Tuesday is still findable in November, with enough written down that the
# person reading it can tell whether it is still true.
#
# Modelled on the backlog in another project of this author's, and the one idea worth stealing is
# this one:
#
# ## `lane` is derived, never typed
#
# `lane` comes from `severity` x `cost`. **No field here lets anybody set a priority directly**,
# and that is the whole design. Every P0/P1/P2 scheme ends the same way — each item is filed by
# the person who cares most about it, so within a year everything is P0 and the scheme carries no
# information. There are exactly two ways to move an item forward here: show that it hurts more
# (`severity`), or make it smaller (`cost`). Both require thinking, and that friction is the point.
#
#     severity \ cost   hours       days        weeks
#     blocks            now         now         scheduled
#     degrades          now         scheduled   waiting
#     noise             scheduled   waiting     drop
#     invisible         waiting     drop        drop
#
# ## Writing an entry is meant to be slightly hard
#
# Adding a line to a markdown list costs nothing, so "I'll put it in the backlog" becomes a way of
# deferring a problem rather than recording one. These fields exist to stop that:
#
# | field        | what it must answer                                          |
# |--------------|--------------------------------------------------------------|
# | `id`         | `B-<short-name>`. **Not a number** — numbers imply an order   |
# | `title`      | one line; when the list is long this is all anybody reads     |
# | `problem`    | **what goes wrong if nobody does this** — not what to build   |
# | `evidence`   | why we believe it: a path, a commit, a date, a measurement.   |
# |              | No anchor means it must start with "Guess:"                   |
# | `severity`   | blocks / degrades / noise / invisible                          |
# | `cost`       | hours / days / weeks — **a timebox, not an estimate**          |
# | `who_hurts`  | user / contributor / us                                        |
# | `trigger`    | what would have to happen to reconsider this                   |
# | `opened`     | the date it went in. **How long an item has sat with its**      |
# |              | **trigger never firing is the best deletion signal we have**   |
#
# `problem` must not begin with a verb that names a solution ("add", "build", "support"). If the
# only way you can describe it is by what you would build, you have not found the problem yet.
#
# ## What is not in here
#
# Bugs with a reproduction go straight to being fixed; this is for things nobody has decided
# about. Anything already being worked on is not here either — that is what the working tree is.

version: 1

# Where the count links to. A path is generated from this file on every count; an `https://` value
# is treated as somebody else's page and left alone, which is what a project with a hosted backlog
# would use. This one has nowhere to host anything, so it is a local file — and `artifacts/` is
# ignored by git, so the page is yours and never travels.
artifact: artifacts/backlog.html

items:
  - id: B-CODEX-LIVE-STRUCTURED-EVENTS
    title: Direct Codex Sessions hide live structured events from Clawdline
    problem: >-
      Clawdline can replay completed Codex work from rollout files, but a direct Codex TUI does not
      expose its live structured event stream to a separately started app-server. Checklist
      updates therefore require a version-sensitive, inert parser over the generated exec wrapper,
      and richer item types that are not persisted in the rollout cannot appear at all. A Codex
      release that changes that wrapper can quietly reduce the Web transcript to ordinary prose
      while the terminal still shows the richer event.
    evidence: >-
      Measured 2026-08-30 against Codex 0.151.0 and one fixed Session,
      `01a0530c-75e7-77e2-a86c-758fd54aed75` (the “修復 document 頁面切換與邊框樣式” tab).
      Its rollout persisted Updated Plan only as a `response_item.custom_tool_call` whose exec input
      invokes `tools.update_plan`; `event_msg.item_completed` had no plan item. The same Session's
      `thread/read(includeTurns:true)` returned one turn and 134 items—2 user messages, 73 reasoning,
      9 agent messages, 31 command executions, 1 file change and 18 MCP calls—but zero plan items.
      A separately launched app-server observed zero events while that TUI continued working.
      Codex's generated app-server schema instead defines the live `turn/plan/updated` notification
      with `pending`, `inProgress` and `completed` statuses, and the official app-server
      documentation describes remote TUI clients connecting to the server-backed session.
    severity: degrades
    cost: weeks
    who_hurts: user
    trigger: >-
      Reconsider when Clawdline owns a Codex launch path that can route the TUI through one durable
      app-server endpoint, or when a Codex release breaks the bounded rollout parser. Acceptance
      needs lifecycle ownership, authentication, reconnect and event-resume behavior, persisted
      projection for live-only notifications, and proof that terminal, Web and thread/read all
      refer to the same thread and turn before rollout parsing can be retired.
    opened: 2026-08-30

  - id: B-ROOT-ASSIGNMENT-PRIMITIVE
    title: An independently owned Feature has no launch primitive distinct from child and handoff
    problem: >-
      Clawdfather can open a bounded child whose result comes back for synthesis and landing, or
      continue an existing line by handing its complete state to a new Root. It cannot yet launch
      a new ordinary Root with an independent objective and ownership boundary. Detached poll-only
      automation still has a child timeout and result contract, while handoff deliberately carries
      the sender's REFERENCES, VERIFICATION and OPEN THREADS. Treating either one as Feature launch
      gives the receiver the wrong lifecycle and the UI the wrong classification.
    evidence: >-
      The restart-reconciliation handoff review on 2026-08-30 found the shipped
      `docs/dispatching.md` and `Resources/dispatch-policy.md` prescribing
      `root.session_id:null` plus `root.poll_only:true` as a Major Feature owner, while
      `docs/handoff.md` correctly defines every `/tasks` session as a child and every handoff as a
      continuation Root. The v1 dispatch-role contract now makes the missing fourth primitive
      explicit instead of overloading either route.
    severity: degrades
    cost: days
    who_hurts: user
    trigger: >-
      Owner: the registered Clawdfather architecture program. Design Root Assignment / Feature
      Launch as its own public protocol, briefing text, durable record and UI classification. It
      may reuse tab opening, composer wait, trust handling, idempotency and transcript receipt, but
      acceptance requires a new Root to receive only objective, scope, constraints, relevant
      references and acceptance—not the sender's complete continuation state.
    opened: 2026-08-30

  - id: B-SCHEDULE-WITHOUT-A-SESSION
    title: A scheduled chore with no judgement in it still opens a whole assistant session
    problem: >-
      A schedule's only shape is a dispatch, so every run starts a full assistant: system prompt,
      tool schemas, the machine's own instruction files, a briefing, and then a handful of tool
      calls that a shell script could have made. The daily forecast on this machine says in its own
      instructions that it reads no project file and writes to no repository — it fetches one JSON
      document and pushes one notification — and it costs between 672,030 and 705,879 tokens a run.
      What is missing is a schedule that runs a command and only escalates to a session when the
      command fails, which is most of what these chores actually are.
    evidence: >-
      Five recorded runs of three daily chores cost 9,380,031 tokens and $8.52, 4.0% of every task
      this machine has dispatched, to produce 51,337 output tokens between them. The forecast run
      spends its whole budget in 34-50 seconds of wall clock, so almost none of it is work: it is
      the session's standing context read once per turn. POST /v1/orchestrator/notify already
      accepts the machine credential, so the notification half needs no agent at all. Measured
      2026-08-28.
    severity: degrades
    cost: days
    who_hurts: us
    trigger: >-
      Write the forecast as a shell script pushing through /v1/orchestrator/notify, run it beside
      the scheduled session for a week, and compare what the person receives. If the two are
      indistinguishable, the feature is a `command` field on a schedule plus an escalate-on-failure
      dispatch.
    opened: 2026-08-28

  - id: B-WORKTREE-COLD-CACHE
    title: An isolated task rebuilds from nothing and burns 1.5x the tokens per second
    problem: >-
      A fresh checkout has no build cache and none of the gitignored dependencies the shared tree
      already holds, so an isolated child spends its first minutes re-fetching and re-compiling
      what was sitting on disk the whole time. The protocol asks for isolation on exactly the
      large, long-running slices, which is where that cost is largest.
    evidence: >-
      Across 138 Codex dispatches on this machine, isolated tasks ran at a median 8,185 tokens per
      second against 5,375 for shared-tree ones, a ratio of 1.52x. Total tokens ran 2.03x, but that
      is confounded — the policy sends bigger work to isolation on purpose. The per-second gap is
      the part selection effects do not explain. Measured in the token-economics review, 2026-08-28.
    severity: degrades
    cost: days
    who_hurts: us
    trigger: >-
      Seed a read-only build cache into a new worktree and compare tokens per second against the
      8,185 median. Below about 6,000 and the effect is real. It must stay read-only: sharing a
      writable build directory puts back the cross-session interference isolation exists to stop.
    opened: 2026-08-28

  - id: B-MACHINE-RESOURCE-SCHEDULER
    title: Parallel Sessions can start enough builds to make every job and the foreground app slower
    problem: >-
      Build, test, signing and install entry points make their resource decision independently, so
      several otherwise non-conflicting Sessions can launch heavy compilers at once. Path claims do
      not describe CPU or memory, task serialize tokens cover only callers that declared them and
      are held for the whole task, and direct build.sh or test.sh invocations bypass that queue.
      Output isolation can keep the bytes correct while CPU, memory and I/O contention still make
      Chat loading, terminal automation and all of the builds slower.
    evidence: >-
      `build.sh` and `test.sh` each invoke `swiftc` directly; only the install tail enters restart
      maintenance. `docs/orchestrator.md` documents `serialize` as a task-lifetime machine mutex,
      while `docs/verification-workflow.md` records that every full test currently recompiles all
      sources and proposes a compile-once runner. The complete future design, open-source trust
      boundary and measurement plan are in `docs/machine-resource-scheduling.md`. Recorded
      2026-08-31 after several independent Root Sessions began overlapping feature work on one Mac.
    severity: degrades
    cost: weeks
    who_hurts: user
    trigger: >-
      Reconsider after the zero-state install and phone-pairing acceptance line is complete, or
      sooner if a measured concurrent build makes foreground Chat latency breach its accepted
      budget. Start with the document's Phase 0 one-versus-many benchmark; do not choose a daemon,
      concurrency number or cache design before that evidence. Phase 1 must make direct scripts and
      orchestrated work share the same correctness lock, and later phases need operation-scoped
      leases, pressure-aware fairness, restart recovery and identical-build coalescing.
    opened: 2026-08-31

  - id: B-ROUND-BUDGET-RESEARCH
    title: Nothing budgets a session's rounds, and rounds are what the bill is actually made of
    problem: >-
      The protocol caps every input it can name — the policy at 12,000 characters, the plan at
      4,096, instructions at 16 KiB — and caps nothing about output or the number of turns taken.
      But output is a quarter of the bill and it is not report length: an 8,000-character artifact
      is about 2% of a session's output tokens, and the rest is thinking, tool arguments and
      per-turn text. The meter runs on time, not on answer size. This is the one recommendation in
      the token-economics review marked a trade rather than waste, and it is open deliberately:
      red-before-green tests, independent review and claims all cost rounds, because that is what
      they are, and a budget set too tight buys twenty saved minutes with a defect nobody found. It
      is plausible only for research and survey nodes, where the work is reading rather than
      proving, and it must never reach a code or a review node.
    evidence: >-
      2,247,280 output tokens at $25/M is 25.8% of the bill; corr(elapsed seconds, total tokens)
      = 0.718; tokens per second is tightly bounded (p10-p90 of 3,092-13,371, median 6,681), so a
      session costs roughly 400k tokens per extra minute alive. Measured 2026-08-28.
    severity: noise
    cost: days
    who_hurts: us
    trigger: >-
      Give the next ten research-shaped tasks a stated round budget in their instructions and
      compare median output and total against the current medians. Do not extend it past research
      nodes on a good result alone.
    opened: 2026-08-28

  - id: B-NO-SELF-UPDATE
    title: A downloaded app has no way to learn a newer one exists
    problem: >-
      Somebody who downloads a release is on that release forever. They will not watch the
      repository, and nothing on their Mac ever mentions that a newer build shipped — so the
      version they first installed is the version they keep. That is worse here than for most
      apps, because what this reads is Claude Code's own screen, and Claude Code updates itself
      constantly: a build checked against one release keeps working until the shape of a spinner
      or a dialog moves, and then it stops reading sessions correctly and says nothing. The
      failure is silent and looks like the sessions being idle.
    evidence: >-
      `Sources/Compat.swift` records which Claude Code version each release was checked against
      precisely because that coupling is real; the 0.6.0 row names two dependencies that would
      break quietly. Nothing in the app or in `build.sh` checks for a newer release, and the app
      is ad-hoc signed, which is what makes the usual updater route hard rather than routine.
    severity: degrades
    cost: weeks
    who_hurts: user
    trigger: >-
      The first release that breaks against a Claude Code update — after which everybody still on
      an older build is broken and has no way to find out.
    opened: 2026-08-19

  - id: B-API-ERRORS-ENGLISH
    title: API error messages are hardcoded English and the page shows them verbatim
    problem: >-
      Every string a person can read went through `Copy` and got fourteen languages, except the
      `message` field of an API error — which is exactly the text somebody sees at the moment
      something has gone wrong and they least want to be reading a second language.
    evidence: >-
      `Sources/RemoteServer.swift` — every `.error(...)` call carries an English literal;
      `Resources/web/index.html` renders `error.message` as-is.
    severity: degrades
    cost: days
    who_hurts: user
    trigger: Anybody reports the page saying something they cannot read, or a fifteenth language.
    opened: 2026-08-19

  - id: B-CACHE-KEY-DIVERGENCE
    title: Clawdline and claude-bestiary compute different cache filenames for the same project
    problem: >-
      Two readers of one set of files disagree about what the files are called, so for a long or
      punctuated path one of them writes a status file the other never finds. The footer simply
      stays empty, which is indistinguishable from having nothing to say.
    evidence: >-
      bestiary's `statusline.py` sanitises every non-alphanumeric character and keeps the last 48;
      `ProjectStatus.key(forPath:)` replaces `/` only and does not truncate.
    severity: noise
    cost: hours
    who_hurts: user
    trigger: A project path over 48 characters, or one containing a dot or a space.
    opened: 2026-08-19

  - id: B-DEVICE-NEVER-EXPIRES
    title: A paired device is trusted until somebody remembers to revoke it
    problem: >-
      A phone that was paired once keeps full access forever. The failure is not dramatic — it is
      that the list of who can read your sessions grows and nothing ever prompts a review, so the
      answer to "who has access" drifts from "me" to "I would have to look".
    evidence: >-
      `Sources/RemoteAuth.swift` — no expiry field on a device; `docs/remote.md` states this
      plainly as a limitation.
    severity: degrades
    cost: days
    who_hurts: user
    trigger: More than a handful of devices in the list, or a device that is lost or sold.
    opened: 2026-08-19

  - id: B-PASSWORD-NO-UI
    title: The password path exists and nothing can set one
    problem: >-
      Half a feature is worse than none: the code, the PBKDF2 work factor and the route are all
      there and carry maintenance cost, while nobody can use any of it. Either it earns a control
      in Settings or it should be deleted.
    evidence: >-
      `RemoteAuth.setPassword` has no caller; `POST /v1/auth/password` is documented in
      `docs/remote.md` and deliberately left out of the README because it points at nothing
      pressable.
    severity: noise
    cost: hours
    who_hurts: user
    trigger: Somebody wants access from a device that cannot scan a QR code.
    opened: 2026-08-19

  - id: B-PICKER-BEYOND-NINE
    title: A menu with more than nine options cannot be answered from a phone
    problem: >-
      The picker is answered with a single byte, and there is no single byte for the tenth row.
      Somebody on a phone facing a long menu has no way through and no explanation of why.
    evidence: >-
      `Targets.answer` allowlists `0x31`–`0x39` and `0x09`; arrow keys are three bytes and
      `keystroke` sends one, so a partial send would deliver a bare `ESC`, which cancels.
    severity: noise
    cost: hours
    who_hurts: user
    trigger: The first menu anybody meets with ten or more options.
    opened: 2026-08-19

  - id: B-NOTIFY-WHEN-PRESENT
    title: "Guess: notifications fire while you are sitting at the Mac"
    problem: >-
      Guess — the notch and the menu bar have already said it, so a phone buzzing at the same
      moment carries no new information, and a channel that is usually redundant is one people
      stop reading. **Deliberately parked**: the obvious fix, suppressing while the Mac has had
      recent input, has a failure mode where a full-screen window hides the notch and the rule
      then silences both channels at once. The owner's judgement on 2026-08-19 was that the
      current volume is low, that a notification arriving is itself useful confirmation the thing
      works, and that a rule needing two signals to agree is one nobody can debug.
    evidence: >-
      `CGEventSource.secondsSinceLastEventType` verified working with no permission prompt
      (counted 3.3s -> 5.4s idle, reset to 0.0 on input). No measurement of how often this
      actually overlaps in practice.
    severity: invisible
    cost: days
    who_hurts: user
    trigger: Notification volume rises enough that somebody starts ignoring them.
    opened: 2026-08-19

  - id: B-STICKY-WRONG-PATH
    title: A transcript path chosen before the briefing lands can never be replaced
    problem: >-
      Identity is relocated only while `transcriptPath` is nil, and the marker gate that would
      catch a wrong choice is only armed while `childSessionId` is nil. A pair that lands before
      the briefing does — which is the ordinary order, since the hook supplies an exact filename
      before the file has been written — is therefore never re-examined for the life of that
      task. Today nothing writes a wrong one: the hook's filename is right by definition, and the
      unvalidated creation-time fallback that used to write bad pairs is gone. This is the
      mechanism sitting there for the next thing that writes one.
    evidence: >-
      Four reviews in a row on `Sources/Orchestrator.swift` traced this shape. The relocation
      entry is guarded on `transcriptPath == nil` and the marker gate on `childSessionId == nil`;
      with both non-nil there is no path back. The 2026-08-25 review measured the current registry
      at 86 of 86 records finding their own marker, which is why this is recorded rather than
      fixed.
    severity: noise
    cost: days
    who_hurts: user
    trigger: >-
      Anything that writes an unproven pair again — a new identity source, or a fallback added
      for a case the hook does not cover.
    opened: 2026-08-26

  - id: B-DEPTH-UNPROVEN
    title: Dispatch depth is the last consumer that trusts an unproven identity
    problem: >-
      Every other consumer of a child's session id now requires the identity to have been proved
      against the task's own briefing marker — token accounting, parent-task matching and
      cancellation all check. `depthOfNew` does not. It is the last unproven entry, and it is
      left because its error is in the safe direction: a wrong answer makes a new task deeper
      than it should be, and the depth ceiling refuses rather than permits.
    evidence: >-
      Traced in the 2026-08-26 review while confirming the proof gate reaches every consumer.
      `harvestUsage` and `provenChildSessionID` require `.belongs`; `cancelInPlace` keys on the
      terminal id; `depthOfNew` reads the session id directly.
    severity: invisible
    cost: hours
    who_hurts: user
    trigger: >-
      A change that makes depth permit rather than refuse on a bad answer, at which point the
      safe direction stops being safe.
    opened: 2026-08-26

  - id: B-UNTURNED-TRANSCRIPT-UNDISPROVABLE
    title: A complete transcript holding no user turn at all can no longer be disproved
    problem: >-
      Proving a transcript belongs elsewhere now rests on finding a completed user turn that is
      not this task's briefing, which is what let files past the scan ceiling be judged on what
      was read rather than on having read all of it. The cost is at the other end: a file that is
      complete but contains no user turn at all — an assistant that only ever wrote bookkeeping,
      or a rollout abandoned before its first message — returns unknown forever instead of
      "somebody else's".
    evidence: >-
      The 2026-08-26 review verified the new condition in both directions against a real child
      transcript (marker at byte 517, four bookkeeping rows before it) and the repository's own
      Codex fixture. The gap is the empty-of-turns case, which neither direction covers.
    severity: invisible
    cost: hours
    who_hurts: user
    trigger: >-
      A stored pair pointing at such a file, which would then be kept rather than cleared.
    opened: 2026-08-26

  - id: B-CODEX-HEADS-DOUBLE-OPTIONAL
    title: The rollout header cache carries a nested optional that no longer means anything
    problem: >-
      `Codex.heads` stores an optional inside an optional so that "looked and found nothing" could
      be told from "have not looked". Now that a failed read is no longer cached, the inner nil is
      unreachable — the cache only ever holds a header it actually read. What is left is a type
      that invites the next reader to reason about a state that cannot happen.
    evidence: >-
      Noted in the 2026-08-26 review after `Sources/Codex.swift` stopped caching nil results.
    severity: invisible
    cost: hours
    who_hurts: user
    trigger: >-
      Somebody adding a third state to that cache, or reintroducing negative caching without
      noticing the shape is already there.
    opened: 2026-08-26

  - id: B-WORKEDIN-REREADS
    title: A rollout whose header is unreadable is re-read on every lookup of where it worked
    problem: >-
      Not caching failed header reads means a rollout that had not written its first line when it
      was first opened can be proved later. The same change makes `workedIn` re-read such a file
      each time it is asked. That only happens on user-driven paths rather than on the polling
      loop, and only for rollouts that never got a header, so it is a small waste rather than a
      hot one.
    evidence: >-
      Identified in the 2026-08-26 review as the deliberate cost of removing the permanent nil
      cache in `Sources/Codex.swift`.
    severity: invisible
    cost: hours
    who_hurts: user
    trigger: >-
      A path that calls it in a loop, or a directory holding many headerless rollouts.
    opened: 2026-08-26

  - id: B-IDENTITY-CONTROL-RETIREMENT
    title: The identity transition control cannot prove agreement or define when it retires
    problem: >-
      The registry and fallback identity ladders write only when they disagree, so zero audit rows
      cannot distinguish continuous agreement from a control that never ran. Without countable
      clean comparisons there is also no defensible threshold for removing the duplicate ladder;
      the temporary control can become permanent code and I/O or be removed by intuition.
    evidence: >-
      `Sources/Orchestrator.swift` samples each distinct registry answer once but writes only
      `orchestrator.identity.mismatch`; the Stage 4b review on 2026-08-26 found zero identity
      events in 1,596 prior audit rows.
    severity: invisible
    cost: hours
    who_hurts: us
    trigger: Clean comparison receipts exist and enough accumulate to define a removal threshold.
    opened: 2026-08-26

  - id: B-HOOK-NOTE-NO-PROCESS-LINK
    title: A tty hook note cannot identify the process that emitted it
    problem: >-
      A note can be current in time and still has no field tying it to the Claude process recorded
      for the task. The pid guard proves which process occupies the tab, while the spawn-time gate
      only rejects older notes; treating those facts as a process-to-note link would reopen the
      same identity assumption this refactor removed.
    evidence: >-
      `Sources/Orchestrator.swift` reads `HookBridge.note(for:)` by tty and accepts it only when
      `note.at >= spawnedAt`; the Stage 4b review traced no pid or process-start field between the
      note and `adoptHookIdentity`.
    severity: invisible
    cost: days
    who_hurts: us
    trigger: A hook protocol gains process identity, or a current note is observed naming another process.
    opened: 2026-08-26

  - id: B-RESTART-PAIR-SPAWN-FAILURE
    title: A malformed provisional identity can exhaust briefing after restart
    problem: >-
      A spawning task restored with a malformed path and session pair loses its proof but retains
      both values. If the registry then misses, ownership correctly refuses to clear that
      pre-delivery pair and briefing eventually fails closed at the attempt ceiling instead of
      rediscovering the child. No wrong identity is accepted, but useful work never starts.
    evidence: >-
      The Stage 4b review on 2026-08-26 traced the stored malformed pair, registry miss, `.other`
      ownership and `.exhausted` decision as one chain; `Sources/Orchestrator.swift` maps that
      ceiling to `spawn_failed`.
    severity: degrades
    cost: hours
    who_hurts: user
    trigger: A real `spawn_failed` record contains a retained, unproven Claude transcript pair.
    opened: 2026-08-26

  - id: B-IDENTITY-CALLER-UNTESTABLE
    title: The live Claude identity caller cannot be exercised as one unit
    problem: >-
      Tests can verify the pure identity policies but cannot prove that the polling caller sampled
      the right external facts, applied them in the right order and handed the resulting task to
      briefing. A wiring regression can therefore leave every policy test green while production
      takes a different path.
    evidence: >-
      `noteClaudeIdentityFromLegacySources` in `Sources/Orchestrator.swift` is private and directly
      reads hook notes, transcript files, process state and the registry; the Stage 1+2 and Stage
      4b reviews both identified the missing caller-level seam.
    severity: invisible
    cost: days
    who_hurts: contributor
    trigger: The next identity-source change, or another regression that pure policy tests miss.
    opened: 2026-08-26

  - id: B-CODEX-IDENTITY-NO-PID-GUARD
    title: Codex identity has no persisted process guard
    problem: >-
      Codex locates a rollout through lsof and proves delivery with the task marker, but unlike
      Claude it does not persist and recheck the process occupying the reused tty. Adding a guard
      without evidence would enlarge a working path merely for symmetry, so the asymmetry remains
      deliberate until it causes a symptom.
    evidence: >-
      The Codex branch of `noteChildIdentity` in `Sources/Orchestrator.swift` calls
      `Codex.locate(...pid:)` without storing pid and process start; the Stage 4b review found a
      live Codex task proven by its marker and zero identity-related audit failures.
    severity: invisible
    cost: days
    who_hurts: user
    trigger: A Codex task binds to a rollout from a replaced process or reused tty.
    opened: 2026-08-26

  - id: B-PAGE-PROSE-UNCHECKED
    title: Only the protocol page's code names are checked; its sentences can go stale silently
    problem: >-
      The suite compares the refusal codes named on docs/clawdline-protocol.html against the set
      derived from Sources/Orchestrator.swift, so a code added and never documented, or documented
      and never built, is caught. Nothing checks the sentences around those codes. Two of the three
      falsehoods found on that page in one review were prose rather than names: a conditional
      success path written as though it were unconditional, and a bound that exists in the code and
      appeared nowhere on the page. Both can regress the same way again, and this is the page the
      project points the community at. The distinction worth keeping in view is that a set equality
      catches an inconsistency after it exists, while generating the text makes the inconsistency
      impossible — the difference between a check and a guarantee.
    evidence: >-
      Review 3cbbb7b7 (F1, MEDIUM) found three false claims on that page, and a previous reviewer
      had run a keyword scan over the same file and missed all three — which is why the assertion
      that landed derives its set from the source instead of listing more keywords. That closes the
      names half and leaves this half open by design rather than by oversight. 2026-08-28.
    severity: degrades
    cost: days
    who_hurts: user
    trigger: >-
      Another reviewer finding a false sentence on that page, or somebody building against it and
      hitting the gap. The shape worth trying first is generating the error code table from the
      source instead of writing it, so that section stops being prose at all — which is what
      tools/build-compatibility.py already does for the compatibility page.
    opened: 2026-08-28

  - id: B-ATTACH-GRANT-TIED-TO-TAB
    title: The attach grant is recorded against a terminal id, not the process that actually holds it
    problem: >-
      `attach_not_managed` exists to stop a follow-up being typed into a session that was never
      given `--add-dir /tmp/.clawdline`, because such a child's first act — reading its own
      `CHILD.md` — raises a permission question on a tab nobody is watching for it, and the menu
      answerer would press the first option. The guard now rests on a grant persisted when the
      process started, which is right, but the grant is keyed on the terminal id rather than on the
      process that received it. A person who restarts the assistant in that same tab gets a new
      process with no such grant, while the role and the recorded grant both survive, so the guard
      goes on saying yes to a session that can no longer read the directory. The failure is silent
      and lands exactly where the guard was built to protect.
    evidence: >-
      Independent review `3cbbb7b7` of `eda0fa76`, 2026-08-28, raised this as MEDIUM and explicitly
      marked it not a landing blocker because closing it is a design decision rather than a repair.
      The materials are already in `Sources/Orchestrator.swift` and used daily by `brief()`:
      `childPID`, `childProcStart`, and `identityStep`'s `refuseForeignProcess`, which is how child
      delivery already refuses a tty whose process was replaced.
    severity: degrades
    cost: hours
    who_hurts: user
    trigger: >-
      Restart an assistant in a standing session's tab, then dispatch a follow-up with
      `attach_session` naming it, and watch whether the child stops on a permission question. If it
      does, extend the persisted grant to carry pid and process start and compare them the way
      `refuseForeignProcess` already does.
    opened: 2026-08-28

  - id: B-SUITE-WALKS-LIVE-WORKTREES
    title: The reclaim tests walk the real worktree root, not a fixture root
    problem: >-
      The suite now covers a feature whose whole job is deleting directories, and the tests reach
      the actual worktree root this machine keeps its isolated checkouts in rather than a fixture
      directory built for the run. Nothing was deleted, and the safety checks in front of the
      deletion are real — the resolved path must equal what `worktreePath(project:taskID:)`
      computes, and a container check defeats `..` and symlinks. But the distance between "the
      guards held" and "the test could not have reached anybody's work" is the whole difference,
      and it is currently spanned by review rather than by construction. Somebody's uncommitted
      hours live in those directories.
    evidence: >-
      Independent review 3cbbb7b7 of eda0fa76, 2026-08-28, recorded it as INFO and confirmed all 19
      worktree directories were still present when it finished — which is to say it had to go and
      count them. The reclaim path is `reclaimTaskBuildIfDue` in `Sources/Orchestrator.swift`; the
      tests are the `.build` and `work/` groups in `Tests/main.swift`.
    severity: degrades
    cost: hours
    who_hurts: contributor
    trigger: >-
      Point the tests at a temporary root through the seam the suite already uses for the store,
      then delete the guards and confirm the tests still cannot touch a real checkout. If that is
      awkward to arrange, the awkwardness is the finding.
    opened: 2026-08-28

  - id: B-RECLAIM-HAS-NO-BACKFILL
    title: A task that finished before the deadline field existed never gets one
    problem: >-
      `work/` and `.build` are reclaimed on a deadline written when the task reaches a terminal
      state. Nothing gives a deadline to a task that reached its terminal state earlier, so every
      task that finished before the field shipped is invisible to the feature that exists to clean
      up after it. Those directories then wait for the 24-hour whole-task sweep, which takes the
      evidence with them, or for somebody to notice and delete them by hand. This is not a one-off
      caused by one upgrade: it is the shape of every future change to how a deadline is decided,
      so the same orphan set appears again each time.
    evidence: >-
      Measured within an hour of the feature landing, 2026-08-28. The new build was installed at
      12:50:33; `/tmp/.clawdline` held 695 MB across 23 `work/` directories and **not one of them
      carried a deadline**, because all 23 tasks finished before the build. It was cleared by hand
      for the third time that day (19 GB at 09:00, 695 MB at 13:00), which is the chore the feature
      was built to end.
    severity: degrades
    cost: hours
    who_hurts: us
    trigger: >-
      Have `cleanup()` give a reclaim deadline to any terminal task that has none, using the same
      grace rules, so the next pass collects it. Then check the disk an hour after the following
      upgrade instead of asking somebody to remember.
    opened: 2026-08-28

  - id: B-SECRETS-OUTLIVE-EVERYTHING-ELSE
    title: A task secret is still recoverable long after every trace of its task is gone
    problem: >-
      That a secret stays in the dispatching session's transcript is known and accepted —
      `skills/clawdline/SKILL.md` says so plainly, at the same trust boundary as the token file.
      What nobody wrote down is the asymmetry in how long it stays. A task directory is swept 24
      hours after the task ends, taking `task.json`, `CHILD.md`, `result.json` and the artifacts
      with it. Transcripts are swept never. So the retention policy that governs everything else
      about a task does not reach the one field the design treats as a credential, and the window
      in which a secret can be recovered is not 24 hours, it is unbounded.
    evidence: >-
      Demonstrated 2026-08-28, not reasoned about: seven task secrets were recovered from a single
      52.9 MB codex rollout under `~/.codex/sessions/2026/08/27/` by matching the exact dispatch
      body `{"task_id":"<id>","secret":"<64 hex>"}` — hours after those tasks ended, and after
      three of the seven task directories had already been swept off disk. `CHILD.md` holds only
      the literal `<TASK_SECRET>` placeholder, so the task directory was never the thing keeping
      them alive.
    severity: noise
    cost: hours
    who_hurts: us
    trigger: >-
      Not an escalation today: anything running as the user can already read
      `~/.config/clawdline/orchestrator-token`, which is strictly more powerful than any one task
      secret. It stops being noise the day a transcript is synced, shared, or attached to a report,
      because the thing travelling is then older and wider than the retention policy anybody
      reasoned about. The cheap fix is to stop putting the secret in a shell command line: hand it
      to the app through a file or a header, so the dispatch body never carries it.
    opened: 2026-08-28

  - id: B-PENDING-CANNOT-SEE-ITS-EXECUTOR
    title: A pending landing cannot tell work in progress from work whose executor was killed
    problem: >-
      A landing record has one word for two situations that need opposite responses. `pending` on a
      task somebody is actively working is a reason to wait. `pending` on a task whose session was
      closed hours ago is a reason to redispatch, and nothing in the record distinguishes them. The
      obligation therefore looks healthy while it is dead, and the longer it sits the more it looks
      like difficulty rather than absence — so the line gets ranked as hard, not as stalled, and
      everybody routes around it. What is missing is not more state on the task; it is a liveness
      fact the record already has the parts for, since every task names the root that dispatched it
      and the app already knows which sessions are alive.
    evidence: >-
      Measured 2026-08-28. Review `7555eb14` returned seven P1s at 22:53:39 on 08-27; the
      correction `9bb8eae0` was dispatched 75 seconds later at 22:54:54, ran for 25 minutes, and
      then it and three sibling tasks under the same root `01a04276` were cancelled inside a
      14-second window — 23:20:37, :41, :48, :51 — the signature of a close cascade rather than
      four decisions. The other three were the display-name final review, the numeric `pending`
      compatibility fix, and the registry accumulation cap. **The safe-close line then sat for
      fourteen hours**, and a handoff document written by the outgoing root faithfully recorded
      that the four tasks "were cancelled" without recording that they died together and why, so
      the receiving root inherited the fact and still could not act on it.
    severity: degrades
    cost: hours
    who_hurts: us
    trigger: >-
      Have `GET /v1/orchestrator/landings` answer, per row, whether the dispatching root session is
      still alive — the app already publishes session state, and the task record already names its
      root. Then read the list once and see whether anything that looks like a hard problem is
      merely an orphan.
    opened: 2026-08-28

  - id: B-STRUCTURAL-FIX-ONLY-REACHES-NEW-MACHINES
    title: A fix that seeds a file on first run never reaches a machine that has already run
    problem: >-
      A change that corrects what a config file is seeded with looks structural — it edits the
      source of truth and lands with tests — but `ensurePolicyFile()` never overwrites, so it takes
      effect only on a Mac that has never dispatched. Every machine that has already written the
      file keeps the old contents indefinitely, and nothing tells anybody that. The diff is
      complete, the tests are green, and the behaviour on every existing installation is unchanged.
      That gap is invisible in review because a reviewer reads the change, not the installed base.
      The same shape covers any seed-once file: dispatch policy today, and whatever else is written
      with a "create if absent" guard.
    evidence: >-
      `~/.config/clawdline/dispatch-policy.md` is a copy, not a symlink (own inode; it was 9,364
      bytes against the repository's 11,257 on 2026-08-28). The review-round rules landed in
      `Resources/dispatch-policy.md` and matched zero times in the file dispatch actually reads
      until a root copied it by hand; that copy is still the only thing that has moved this
      machine. `Orchestrator.defaultPolicy` additionally holds a stale literal, and `policyURL`
      points only at `~/.config/clawdline`.
    severity: degrades
    cost: hours
    who_hurts: us
    trigger: >-
      The next policy or seeded-config change that is believed to have shipped and has not. A fix
      would either migrate on version change, or make the read fall back to the bundled resource so
      the repository copy is authoritative and the local file is an override rather than the only
      source.
    opened: 2026-08-28

  - id: B-LANDING-NOTE-LIMIT-IS-UNNAMED
    title: An over-long landing note is refused without saying which field was too long
    problem: >-
      `POST /v1/orchestrator/tasks/:id/landing` answers `400 bad_request` when `note` exceeds 500
      characters, and the message does not name the field or the limit. A caller closing several
      landings in a loop gets a row of identical refusals with nothing to act on, and the natural
      reading is that the request shape is wrong rather than that one string is long. The limit is
      documented, so this costs a reader who checks the docs nothing — and costs everybody else a
      detour.
    evidence: >-
      On 2026-08-28 a root marking seven superseded landings `abandoned` had all seven refused for
      this reason and had to find the cause by reading `docs/api.md` rather than the error.
    severity: noise
    cost: hours
    who_hurts: contributor
    trigger: >-
      The next time somebody loses time to a refusal that knows exactly what is wrong with the
      request and does not say. Typed refusals elsewhere in this API name their field; this one
      should match them.
    opened: 2026-08-28

  - id: B-CODEX-SUBAGENTS-ARE-NOT-READABLE
    title: Native Codex subagents disappear behind their parent Session
    problem: >-
      A Codex Session can launch native subagents, but Clawdline cannot reliably list those children
      or open the rollout that belongs to one exact parent process. The parent therefore looks like
      one opaque working Session: a person cannot tell which delegated line is still running, which
      one failed, or read the result that justified the parent's conclusion. Reusing an old partial
      implementation is unsafe because rollout identity, process binding and bounded scans have all
      changed since its base.
    evidence: >-
      The now-abandoned landing obligations `b2cef7f6` and `1aa050c5` point at one preserved dirty
      candidate worktree based at `40bc690c`; the latter task row has no separate worktree.
      It contains 495 added lines plus an untracked `Sources/CodexSubagents.swift`, no delivery
      commit, no durable result artifact and no independent final review. Current main is
      `04071d8a`; the old candidate predates the whoami, SessionWatch, ownership and test-harness
      contracts now in production. The preserved worktree remains useful as research, not as a
      landable patch.
    severity: degrades
    cost: days
    who_hurts: user
    trigger: >-
      Reimplement after the Session/Orchestrator refactor defines the provider-agent boundary.
      Reuse the old worktree only as test-vector evidence: exact process-bound parent identity,
      bounded directory scans, symlink-safe rollout reads, readable child transcripts and explicit
      running/done/failed states must be proved against current main.
    opened: 2026-08-29

  - id: B-CLAWDFATHER-CRASH-RECOVERY-IS-NOT-A-CURRENT-CONTRACT
    title: A crashed Clawdfather has no current, reviewed recovery journey
    problem: >-
      The durable coordinator record can survive a crash, but the product does not yet offer one
      reviewed journey that finds the exact prior conversation, distinguishes unknown from offline,
      resumes it without duplicating it, and performs the generation-guarded rebind only after fresh
      process evidence. Recovery therefore still depends on a coordinator who already knows the
      protocol rather than on a user-visible product path.
    evidence: >-
      Task `ca5f5cfc` delivered a 612-line dirty worktree based at `ec5e0a6b`, with no commit and no
      independent review. Its own report records 15 unrelated full-suite failures and blocked live
      browser verification. Current main `04071d8a` has since replaced coordinator liveness with a
      closed online/offline/unknown contract and added whoami, ownership projection and guarded
      registration. Replaying the old patch would bypass the exact seams recovery now has to use.
    severity: degrades
    cost: days
    who_hurts: user
    trigger: >-
      Reimplement after Status vNext defines safe/unknown closeability and a bounded close receipt.
      The current-main feature must use the exact durable conversation, fresh SessionWatch evidence,
      assistant/cwd/conversation guards, generation CAS, typed timeout/refusal states and real mobile
      browser verification; the old worktree is specification evidence only.
    opened: 2026-08-29

  - id: B-VERIFICATION-PROOF-CANNOT-BE-REUSED
    title: The same verified tree keeps paying for the same question
    problem: >-
      Verification is prose attached to one task rather than a durable receipt keyed by the tree,
      question and environment. A correction, reviewer and landing root therefore rerun the full
      suite even when two of them are asking the same thing, while malformed verification metadata
      silently looks the same as no report. Quality remains high, but local fixes repeatedly pay
      the repository's largest compile cost and the evidence cannot be audited mechanically.
    evidence: >-
      In the ownership/freshness line on 2026-08-29, implementation used 818 seconds, correction
      515 seconds, final review 620 seconds and root still owed the exact-tree suite. The correction
      and review contained four full-suite runs between them. Tasks `d86b3f9c` and `1d87577f` also
      supplied malformed `verification` values (invalid `last`, floating `seconds`) which
      `Orchestrator.verification(from:)` omitted without projecting invalid status. The proposed
      ledger, verdict and runner contracts are in `docs/verification-workflow.md`.
    severity: degrades
    cost: days
    who_hurts: us
    trigger: >-
      Implement the invalid-vs-absent projection first, then the append-only receipt ledger and
      compile-once focused runner. Each step needs a guard that proves duplicate exact receipts do
      not execute again and a targeted run cannot mint a full receipt.
    opened: 2026-08-29

  - id: B-ROOT-CLOSEABILITY-IS-NOT-PROVABLE
    title: Idle and ready Sessions still cannot prove they are safe to close
    problem: >-
      Existing state can prove a child task landed or that a Session volunteered to accept more
      work, but not that a root's full obligation graph and unregistered local work are clear. Most
      idle roots therefore remain unknown, so a Clawdfather must reconstruct ownership from chat
      before closing them. Treating idle, ready or task work_complete as safe would fail open.
    evidence: >-
      After the 2026-08-29 integration, 14 live Sessions projected only 2 ready and 9 unknown even
      though the integration coordinator could prove nine Clawdline tabs were finished. All nine
      passed the close route's instantaneous lost-work gate, but no pre-close projection could say
      so. `docs/session-closeability.md` identifies the missing root closure attestation,
      obligation generation and four-state closeability projection.
    severity: degrades
    cost: days
    who_hurts: user
    trigger: >-
      Implement the read-only reason/provenance projection first. Add process-bound closure
      attestation and CAS close only after stale/missing/ambiguous evidence is proved unable to
      produce safe. A durable audit runner is last, not first.
    opened: 2026-08-29


  - id: B-LIVE-VIEW-OF-A-MAC-SCREEN
    title: A reader on a phone cannot see what a session is saying until its turn is written
    problem: >-
      Claude Code writes an assistant message only once it is complete, and an AskUserQuestion turn
      not until it has been answered. Everything Clawdline shows comes from that file, so a reader
      away from the Mac watches a question with none of the reasoning under it, and a long answer
      arrives all at once at the end or not at all. The gap is not lag: the question card arrives
      on time by another road, so the reader is asked to decide with the explanation missing.
    evidence: >-
      Measured 2026-09-01 on session `e54c45b7`: the screen held the analysis and the picker at
      13:28:38 while the file still ended at 13:27:17, and still did ten minutes later. Building it
      out of iTerm2 screen captures was tried and removed on 2026-09-02 — the reconciliation itself
      measured clean (110 captures, 0 gaps, 0 lines lost) but iTerm2 has no scrollback API, so
      anything printed before the app started watching is unrecoverable, and six separate terminal
      shapes had to be special-cased, each found by a person looking at a phone rather than by a
      test. `docs/screen-tail.md` keeps that road's full measurements.
    severity: degrades
    cost: days
    who_hurts: user
    trigger: >-
      The tmux integration landing. `Tmux.capture(scrollback:)` answers with history rather than a
      sixty-row window, which removes the wall the first attempt died on and most of the parsing
      guesswork with it. Do not rebuild this on iTerm2 captures without new evidence that the
      terminal's drawn shapes have a contract.
    opened: 2026-09-02

  - id: B-CANNOT-REVISIT-AN-ANSWERED-QUESTION
    title: A reader answering a set of questions from a phone cannot go back to one
    problem: >-
      Claude Code presents an `AskUserQuestion` set one question at a time and draws arrows on
      either side of its tab bar, so at the Mac a person can walk back to a question they have
      already answered and change it. From a phone there is no way to move the picker at all: the
      only thing that can be sent is a digit, which answers whichever question is currently up.
      A wrong tap is therefore discovered at the review screen and cannot be corrected there —
      review offers Submit or Cancel, and Cancel discards the whole set, including the answers
      that were right.
    evidence: >-
      Measured 2026-09-02 against a real two-question call: the bar draws
      `←  ☒ 城市  ☒ 運動  ✔ Submit  →` and the screen's own hint reads
      `Enter to select · Tab/Arrow keys to navigate · Esc to cancel`. `Targets.answer` accepts
      `1`–`9`, Tab and back-tab and nothing else — deliberately, because its doc comment records
      that the danger is not answering the wrong question but that a byte channel into a tty is an
      escape-sequence channel into a tty. Left and right are `ESC [ D` / `ESC [ C`, which is
      exactly the shape that allowlist exists to exclude.
    severity: degrades
    cost: hours
    who_hurts: user
    trigger: >-
      Somebody mistapping a question in a set and having to finish it at the keyboard. The fix is
      not "allow arrows": it is deciding whether the picker's own navigation deserves a named
      operation the way `submit` got one — `POST /key` already takes the word `submit` for a
      keystroke that has no digit, and `previous`/`next` would be the same shape, keeping the
      allowlist closed while giving the phone the movement the bar advertises.
    opened: 2026-09-03

  - id: B-PRE-COMMIT-CANNOT-SEE-A-LANDING-WORKTREE
    title: The shared-tree guard blocks a landing worktree, so every landing is committed with --no-verify
    problem: >-
      `tools/git-hooks/pre-commit` refuses a commit while `MERGE_HEAD` exists, because in the shared
      checkout it cannot tell whose merge it is. A linked worktree created for one landing has
      exactly one possible owner, and every landing conducted in one therefore ends with
      `git commit --no-verify`. The guard's own message offers that as the way to assert ownership,
      so nothing is being circumvented — but a root that lands several deliveries a day types the
      escape hatch several times a day, and an escape hatch typed by reflex stops being read. The
      guard's value is that somebody reads it; the failure mode is not that it blocks the wrong
      commit but that it teaches its only regular caller to skip it.
    evidence: >-
      Landed 2026-09-03 as `ecd87586`, installed the same day. Three of the four landings that
      followed it (`276b141e`, `14dfeaba`, and the seal commit's parent) were made in dedicated
      worktrees under `/private/tmp/clawdline-*-landing` and used `--no-verify`; the fourth,
      `873e5213`, had no `MERGE_HEAD` and passed the hook with rc=0, so the hook does distinguish
      the two situations it can see. `git rev-parse --git-common-dir` differs from `--git-dir` in a
      linked worktree, which is the distinction the hook does not currently make.
    severity: degrades
    cost: hours
    who_hurts: contributor
    trigger: >-
      Any change to that hook, or the first time somebody uses `--no-verify` on a commit in the
      shared checkout because the habit carried over. The narrowing has to keep the shared-checkout
      behaviour exactly as it is: the danger it was written for is real and happened.
    opened: 2026-09-03

  - id: B-PRE-COMMIT-CANNOT-SAY-IT-DID-NOT-RUN
    title: When the shared-tree guard fails to start, nothing says the commit did not happen
    problem: >-
      The hook shells to `python3` for everything after its cheap checks. It already fails open with
      a named warning when `python3` is missing, but there is no branch for `python3` present and
      unable to start: the interpreter's own startup error reaches the terminal unframed, mentioning
      neither the hook nor the commit. A caller reading it sees something that looks like a crash in
      their own tooling, and the commit silently did not happen. One session then printed
      `git rev-parse --short HEAD` on the next line, read another session's landing, and reported it
      as its own.
    evidence: >-
      Observed 2026-09-03 on this machine: `Fatal Python error:
      config_get_locale_encoding: failed to get the locale encoding: nl_langinfo(CODESET) failed`
      with `Python runtime state: preinitialized`, and no commit made. The trigger is **not
      established** — three interpreters (/usr/bin 3.9.6, /usr/local/bin 3.12.8,
      /opt/homebrew/bin 3.14.6) were each run with seven locale configurations, including every
      variable unset, and all 21 combinations exited 0. Setting `LANG`/`LC_ALL` made the commit
      succeed, which is evidence that something about the environment mattered and not evidence
      that the absence of those variables was the cause.
    severity: degrades
    cost: hours
    who_hurts: contributor
    trigger: >-
      The next time it happens, capture `env | grep -Ei '^(LANG|LC_|PYTHON)'`, `command -v python3`
      and `python3 -V` **in that shell**, before changing anything. The presentation half can be
      fixed without the cause: check the interpreter's exit status and say that the hook could not
      start and the commit was not made.
    opened: 2026-09-03

  - id: B-LANDING-QUEUE-COUNTS-A-RECUT-AS-UNLANDED
    title: A delivery landed by re-cutting stays in the landing queue for ever
    problem: >-
      Landing-queue membership is derived from branch ancestry, which is what makes a black hole
      impossible. But an extraction-shaped delivery whose base has moved is landed by re-cutting on
      the new base, not by merging the old branch — so its content reaches `main` while its branch
      never becomes an ancestor, and the entry never leaves. A queue that keeps a completed entry at
      its head is a queue people learn to scroll past, which is the exact failure the derivation was
      built to prevent.
    evidence: >-
      Task `b57fc96f`'s delivery landed 2026-09-03 as `2023d7e3` — `Sources/RemotePage.swift` is on
      `main` at the same 1,024 lines the branch holds — and `git merge-base --is-ancestor 43b7c7e6
      HEAD` is still false, so `GET /v1/orchestrator/landing-queue` reports it `unlanded_delivery`
      with `holder: true`. Re-cutting rather than merging is the documented rule for extractions
      whose base moved: see `docs/architecture-refactor.md` and the three line-number tables in
      `47740b5c`'s history, where the same MARK moved twice while its content did not.
    severity: degrades
    cost: days
    who_hurts: us
    trigger: >-
      The second entry that lands this way, or the first time somebody asks why the queue's head has
      not moved in a day. Content equality is the hard part: a cheap first answer is an explicit
      "landed as <sha>" record a root can write when it lands by re-cut, which keeps derivation for
      membership and adds a fact only the lander knows.
    opened: 2026-09-03

  - id: B-SERVICE-WORKER-HAS-NO-ROUTE-TEST
    title: One of RemotePage's five entry points has no route test
    problem: >-
      `RemotePage` was extracted from `RemoteServer` with five entry points called from the server.
      Four are covered by existing route tests; `serviceWorker` is not reachable by either spelling
      those tests use. The extraction did not make it worse and did not make it better, so this is
      not a regression — it is a gap that was invisible while the code sat inside a 6,449-line file
      and is nameable now that it does not.
    evidence: >-
      Found 2026-09-03 while landing `2023d7e3`, and recorded in that commit's own message rather
      than only in the delivery report. The wording matters: the line that found it wrote "cannot
      find" rather than "does not exist", having first stated the stronger claim without checking.
    severity: noise
    cost: hours
    who_hurts: us
    trigger: >-
      Any change to the service worker, or a report that the web app serves a stale asset after a
      deploy — which is what a service worker fault looks like from outside.
    opened: 2026-09-03

  - id: B-FANOUT-GATE-GUARD-CANNOT-GO-RED
    title: The fan-out switch's only evidence is a string match that cannot see polarity
    problem: >-
      `Tests/HookTests.swift` proves the fan-out push reads `push_on_fanout` by slicing
      `Sources/Orchestrator.swift` around `announce`'s signature and asking whether the slice
      contains `Config.shared.pushOnFanout`. That check passes for `guard !Config.shared.pushOnFanout
      else { return }` too — the switch inverted, the guard still green. And the slice degrades:
      `components(separatedBy:).last` returns the whole file when the separator is absent, so the
      day somebody changes `announce`'s signature the check silently becomes a whole-file grep that
      can never fail. The delivery half has a real behavioural test ("and the switch is a switch");
      the fan-out half does not.
    evidence: >-
      Measured by the independent reviewer of `0c4c85c7` on 2026-09-03, which ran both mutations:
      inverting the gate keeps `contains` true, and replacing the separator with a string that does
      not occur makes the slice 582,116 characters while both checks stay green. Not tautological —
      both went red under mutation run A, which deleted the gate line — they simply prove less than
      their names claim. Cheap fix: assert the separator occurred exactly once before slicing, or
      lift the gate into a pure decision and cover polarity with a behavioural test.
    severity: degrades
    cost: hours
    who_hurts: us
    trigger: >-
      Any change to `announce`'s signature, or the next time somebody relies on a source-slicing
      guard to prove a preference is honoured.
    opened: 2026-09-03

  - id: B-DELIVERY-PUSH-DIVERGES-FROM-ITS-SIBLINGS
    title: The delivery notification took four shapes its sibling pushes do not
    problem: >-
      Four divergences, none of which breaks anything, and none of which is written down anywhere
      but here. (1) With `smart_notifications` on, the body is the session's own summary, bounded
      only by 500 characters, no NUL and trimmed ends — interior newlines and C0 pass through, while
      the neighbouring `selfNote`/`closureNote` reject newlines outright and the fan-out path folds
      whitespace and cuts at 180. (2) `announceDelivery` calls `WebPush.send` directly, so it has no
      burst coalescing and no queue ceiling; deleting `sendFinishedPush` left `SmartNotification`
      with exactly one producer, and that machinery was written for "twenty tabs finishing", which
      is the producer that just went away. (3) It resolves its target through `target(withID:)`,
      which is `DispatchQueue.main.sync`, on a route that had deliberately used
      `publishedInventory()` to stay off the main queue — not a deadlock, and five other call sites
      do the same, but this route had chosen the other shape. (4) The guard that stops any language
      from saying a stopped turn means finished work only covers English.
    evidence: >-
      Independent review of `0c4c85c7`, 2026-09-03, findings M2/M3/M4/M6, each with a file and line:
      `Orchestrator.swift:2736` (bounds), `:11017` (direct send), `:11020` -> `:12688` (main-queue
      hop), `Tests/HookTests.swift:802` (English-only guard). The reviewer read all 14 `Copy` structs
      and confirmed no language currently makes the old claim — the gap is the guard against
      regression, not the strings. Delivery is far rarer than a turn ending, so (2) is probably the
      right trade; it just had no record until this entry.
    severity: noise
    cost: hours
    who_hurts: user
    trigger: >-
      A second producer for delivery pushes, several roots reporting delivery at once, or the first
      lock-screen notification somebody finds unreadable because it carried four lines.
    opened: 2026-09-03

  - id: B-CLOSEABILITY-KEEPS-A-REMOVED-WORKTREE-DIRTY
    title: A removed worktree blocks its Session's close for ever
    problem: >-
      `closeability` reads `dirty_isolated_worktree` from the task record, which is a snapshot taken
      when the task ended. Removing the worktree afterwards — the correct action once its content is
      proven redundant — updates nothing, so the reason never clears and the Session can never reach
      `safe`. A closure attestation does not help by design: the broker merge outputs `safe` only
      when its own blockers are clear, and this one cannot become clear. The result is a Session that
      has genuinely finished, has said so, and has no path to being closed.
    evidence: >-
      Session `6050ED1D` on 2026-09-03. Task `23e78454`'s worktree was removed after its one dirty
      file was proven byte-identical to `main`; the directory is gone and `git worktree list` has
      zero entries for it. A `status: clear` attestation at `activity_generation: 74` returned
      `state: blocked, reasons: ["dirty_isolated_worktree"]`. Two other Sessions closed cleanly the
      same hour through the same route, so the route works — this reason is the one that cannot be
      retired.
    severity: degrades
    cost: hours
    who_hurts: us
    trigger: >-
      The second Session that cannot be closed for this reason, or any change to how the task record
      stores worktree state. The cheap answer is to re-stat the worktree path when the projection is
      computed and treat a missing directory as not dirty; the durable one is for worktree disposal
      to write back to the record it is evidence for.
    opened: 2026-09-03

  - id: B-LEDGER-QUIET-WINDOW-IS-NOT-QUIET
    title: The suite writes this Mac's real sessions into whatever test ledger is open
    problem: >-
      `SessionWatch`'s reading calls `UsageLedger.checkpoint(sessions:)`, and in the test binary
      that reading is the real one: it resolves the transcripts of the live Claude and Codex
      sessions on this machine and writes their usage into `UsageLedger.shared` — which, during a
      usage group, is that group's `freshUsageLedger()` store. Nothing starts the watch on
      purpose. Production code queues `DispatchQueue.main.async { SessionWatch.shared.nudge() }`
      from `dispatch`, `beat`, `handoff`, `rootAssignment` and the two child-close paths, the
      suite never drains the main queue, and then `eventually` — which pumps `RunLoop.main` —
      releases the backlog. The scan that follows shells out to every terminal, so its write
      lands hundreds of milliseconds later, in whichever group is running by then.
      Any assertion about `UsageLedger.shared.rows()` or about an unranked portfolio is therefore
      an assertion about this Mac, and goes red when a real session outranks the fixture.
    evidence: >-
      2026-09-03, one binary re-run without recompiling: runs 1 and 3 reported `5 of 8583 checks
      failed`, runs 2 and 4 reported `8583 checks passed`. The five name themselves — three in
      `legacy managed-worktree Projects migrate…` and the two quiet-window checks — and with a
      witness printed in the failure detail they name the writer too: `project=/Users/sainteye/code/clawdline
      output=166300`, `output=144813` and `output=59978`, filed under three live session UUIDs,
      against a fixture row of 12. The Project ranked first was `clawdline` at 371,091 output.
      The retention change was not involved: it adds no `nudge`, no `eventually` and no ledger
      writer, and running all 519 groups through `CLAWDLINE_TEST_GROUPS` — which exits before the
      cloud tail — was green while the same binary in full mode was red.


      **2026-09-03, later: the same seam with a worse symptom, and this time it named itself.**
      A landing run reported `3 of 8632 checks failed`, all three in the 60k-row usage
      performance group, and the line above them was `sqlite: database is locked` — printed by
      `usageStoreExec` itself, which has always echoed SQLite's error and had simply never been
      read. The fixture opens with `BEGIN IMMEDIATE`, so it asks for the write lock at once and
      loses it to whatever else is writing that store. The same check was green in three other
      runs of the same day, and the same binary re-run four times was green four times.


      That matters more than a miscount. A concurrent writer that adds a row breaks assertions
      about rows; a concurrent writer that holds the lock breaks **any** statement in that group,
      including ones that never mention the ledger. The trigger this entry named — the next
      assertion written against `UsageLedger.shared` without owning its subject — has therefore
      already fired, and it fired on an assertion whose subject was correct.
    severity: degrades
    cost: hours
    who_hurts: us
    trigger: >-
      The five assertions are repaired where they stood: the migration group pins its fixture to a
      fixed historical day and reads that closed range, so a row written at `Date()` cannot enter
      its answer, and the two quiet-window checks assert a delta across their own two synchronous
      calls instead of pumping the run loop for 0.4 s and then asking whether the process is
      quiet. What is left is the production seam and it is not the test file's to close: the suite
      should not be able to take a live reading of the machine at all. Fixing that means a seam in
      `SessionWatch` or `UsageLedger.checkpoint(sessions:)` — neither is claimed by this task —
      and the next assertion written against `UsageLedger.shared` without owning its subject is
      the trigger.
    opened: 2026-09-03

  - id: B-TOKEN-VERIFY-IS-NOT-A-LIVENESS-CHECK
    title: `/user/tokens/verify` fails for a least-privilege token that works
    problem: >-
      A Cloudflare API token scoped to exactly one thing — `Account · Cloudflare Pages · Edit` —
      answers `1000 Invalid API Token` at `/client/v4/user/tokens/verify`, because that route needs
      `User → API Tokens → Read` and a minimal token does not carry it. **The route tests whether a
      token can inspect itself, not whether it can be used.** Anything that treats a `verify`
      failure as a dead credential will condemn a working one, and the deploy paths here store
      exactly such minimal tokens.
    evidence: >-
      Measured 2026-09-03. The token in Keychain under `dev.sainteye.clawdline.cloudflare-pages`
      answers `1000` at `/user/tokens/verify` and, with the same bearer, lists both Pages projects
      at `/accounts/8700c833c6f6493e8b54b1af028c0c21/pages/projects`:
      `clawdline-marketing, clawdline-app`. It had been declared dead an hour earlier on the
      strength of `verify` alone, and the user was asked to mint a replacement that was not needed.
      Two independent-looking signals agreed and both were wrong: the second was a `10000` from a
      Pages call made against an account id whose first eight characters came from
      `scripts/deploy-marketing.py` and whose remaining twenty-four were invented.
    severity: degrades
    cost: hours
    who_hurts: us
    trigger: >-
      Any check that asks whether a stored deploy token still works. The liveness question is
      answered by the narrowest call the token is actually for — for a Pages token, listing the
      project it deploys — never by `verify`. And an account id is copied whole from the file that
      holds it, because a wrong one returns an authentication error that reads exactly like a
      permission problem.
    opened: 2026-09-03

  - id: B-A-SEALED-COUNT-CHANGES-WITHOUT-ITS-SEAL
    title: A sealed check count changes without its seal, and the next landing pays for it
    problem: >-
      `expected_cloud_receipt` in `test.sh` pins the twelve Cloud suite counts as one exact string,
      and `verify_test_completion_receipts` compares it literally. Nothing links a Cloud test file
      to that line: a commit that adds or removes a `require` in `Tests/Cloud*Tests.swift` is
      complete, reviewable and mergeable without touching `test.sh`, and the mismatch surfaces only
      in the next full run — which belongs to whoever lands next, not to whoever caused it. Unlike
      `expected_swift_receipt`, this seal has no `CLAWDLINE_RESEAL=1` door, so the person who does
      hit it has no supported way to re-measure: the failure says the receipt appeared zero times
      and never says which of the twelve fields moved.
    evidence: >-
      2026-09-03. `8399aee7` added two `require` calls to `Tests/CloudTransportTests.swift` and
      `b66d5d27` removed one; neither commit touched `test.sh`. `main` at `9750f42f` therefore
      carries `CloudTransport:67` against a tree that reports 68, and every landing after 19:15
      dies on `Cloud test completion receipt appeared 0 times` before its Swift seal is compared at
      all. Five run logs from one landing tree track main's two commits exactly — 67 at 19:09, 69
      at 19:23 and 19:32, 68 at 20:26 and 20:33 — and the same binary re-run six times reported 68
      every time, so the count is deterministic and what moved was `main`. Reading the source first
      cost three wrong causes: a fixture token expiring 0.8 s after it is built, a `checks += 1`
      under an `if`, and a suite reading live machine state. All three are real shapes and none of
      them was this.
    severity: degrades
    cost: hours
    who_hurts: us
    trigger: >-
      Either the seal stops being hand-written — generated the way the governance table now is —
      or it gains the `CLAWDLINE_RESEAL=1` door its Swift sibling already has, so a red hands back
      the string to write instead of a number to transcribe. The cheap half is the door, and the
      failure naming the field that moved is cheaper still. The next commit that changes a Cloud
      suite's check count without touching `test.sh` is the trigger.
    opened: 2026-09-03

  - id: B-THE-LOCK-NAMES-THE-WRONG-TAB
    title: The suite lock's holder is whichever terminal's environment the run inherited
    problem: >-
      `test.sh:1320` builds the holder's identity from the environment — `if [ -n
      "${ITERM_SESSION_ID:-}" ]; then where="iTerm2 ${ITERM_SESSION_ID#*:}"` — and a session the
      app opens inherits the environment of whatever spawned it. So a run in a child's own
      worktree can be recorded under an entirely different session's id, and the waiter is told
      to watch a tab that is not running anything.


      The field exists for exactly the use this breaks. `test.sh:543` says it is there so that
      "a blocked run can then watch the run it is waiting for instead of guessing" — and when the
      inherited id belongs to the waiter, the waiter is pointed at itself. The `pid` beside it is
      correct, so the record is not useless; it is worse than useless in the one place a person
      reads it, because the wrong half is the human-readable half.
    evidence: >-
      2026-09-04 09:38. Waiting for the lock, this run printed `suite lock: waiting 0s for
      sainteye running ./test.sh (iTerm2 6B784A94-AE6E-4E57-A9D4-DE72C1EA9084) (run pid 59362,
      working pid 7077…)`. That session id is the waiting root's own. `lsof -p 59362` puts the
      holder's working directory in
      `…/Clawdline/worktrees/clawdline-3b9e26c1/eb94fa3b-1900-4aac-94a2-1d33d6b4c071` — a child's
      isolated worktree, a different session, a different tree. The lock itself behaved correctly
      throughout: it serialised the two compiles and released after 31 s. Only the name was wrong.
    severity: noise
    cost: hours
    who_hurts: contributor
    trigger: >-
      The identity a lock records should come from what the run *is* rather than from what its
      environment still remembers: the run's own working directory decides which checkout and
      therefore which worktree it belongs to, and the broker already knows which task owns that
      path. An environment variable survives a spawn; a working directory does not lie about it.
      The next person who follows a `waiting for` line to a tab and finds it idle is the trigger.
    opened: 2026-09-04

  - id: B-A-CLAIM-ABOUT-CODE-NEEDS-THE-TEST-THAT-PINS-IT
    title: Two roots read the same guard and disagreed; the deciding evidence was thirty lines below
    problem: >-
      `OrchestratorStore.swift:563` reads `!hasAnyVerification || (state == .landed && target !=
      nil && hasCompleteVerification)`. Taken on its own, that admits a `landed` record with no
      verification fields at all and refuses only a partly-verified one, which reads like a hole
      in a receipt the documentation called verified.


      It is not a hole. `Tests/OrchestratorStoreTests.swift:336-343` pins the behaviour — *a
      legacy landed row with no verification at all still decodes* — under a comment that states
      the intent: **the three verification fields are one fact, and a row carrying part of it is a
      row an older build wrote before the fact existed.** The shape is deliberate: refuse the
      half-written, admit the never-written.


      What this entry records is not the guard but the reading. One root read the clause, then
      widened to the whole of `landing(from:)` — all fifty lines, entry guard included — and
      reported a hole. The widening was in the wrong dimension: more of the same file is not the
      same as the assertion that owns the behaviour. **A function's contract is not always written
      inside the function.**
    evidence: >-
      2026-09-04. One root reported the clause as a defect and argued the tightening was free
      because 66 of 66 landed records on this machine carry verification. A sibling root answered
      with the test and with a second correction: 66/66 is a property of *this machine's store
      today*, while the compatibility path exists for the stores this machine has never seen — an
      upgrade from an older build. Both halves of the first argument were wrong, and both were
      wrong by naming the wrong subject.
    severity: invisible
    cost: hours
    who_hurts: contributor
    trigger: >-
      Before calling a permissive guard a defect, find what asserts the behaviour: `git log -S`
      on the clause, or a search of `Tests/` for the field it reads. A guard nobody pinned is a
      candidate; a guard with a test and a comment explaining the intent is a decision, and
      arguing with it means arguing with that comment. The open question the exchange left is
      separate and real, and it is filed as
      [B-GRAPH-LANDING-NODES-DO-NOT-ASK-FOR-VERIFICATION].
    opened: 2026-09-04

  - id: B-GRAPH-LANDING-NODES-DO-NOT-ASK-FOR-VERIFICATION
    title: The graph reads `state == .landed` while its documentation says the receipt is verified
    problem: >-
      `OrchestratorPlanning.swift:304` decides a landing node's outcome with `task.landing?.state
      == .landed ? "done" : "awaiting_landing"`. `docs/orchestrator.md:546` said landing nodes
      need a **verified** `landed` receipt; a delivery on 2026-09-04 removed the word so the text
      would match the code. That resolves the contradiction in the cheaper direction, and leaves
      the graph accepting a receipt nobody verified.


      The decoder's permissive path is not the place to fix this — it is a deliberate
      compatibility route with a test on it. The graph is a different layer with a different
      population.
    evidence: >-
      2026-09-04, measured rather than argued. `git log -S` in `Sources/` dates `verified_commit`
      to `e9a9254a`, 2026-08-27 13:48, and the planning graph to `5c5edcdb`, 2026-08-31 00:43 —
      **verification is four days older than graphs**. Both readings of a landing resolve through
      `graphNodeTask(_:graphID:index:)`, which is `index[graphID]?[node.id]`: line 363 for the
      node's own task and line 339 for each delivery or correction it depends on. A task
      dispatched before graphs existed carries no graph id, cannot enter that index, and so cannot
      appear at either. The legacy rows the decoder protects therefore cannot reach this layer,
      and requiring verification here changes no behaviour any existing store can produce.


      Boundaries, both real. The line numbers are from `94905f0d`, after `2ddb3a76` rewrote this
      function on 2026-09-04 — an earlier draft of this entry cited `:304` in the version that
      commit replaced, and the claim had to be re-derived rather than carried over. And the age
      argument covers **only** the graph. A sibling root counted the consumers of
      `landing?.state == .landed` in `Sources/` and found three, not one —
      `Orchestrator.swift:5418`, `OrchestratorPlanning.swift`, and
      `OrchestratorTaskShape.swift:74`. Each of the other two reads the state for its own purpose
      and has its own population; neither inherits this entry's conclusion.
    severity: invisible
    cost: hours
    who_hurts: us
    trigger: >-
      Requiring `hasCompleteVerification` at the graph layer would let the documentation say
      `verified` again and be true, without touching the decoder. Whether to require it is a
      design decision about what a landing node owes — the root owning `docs/orchestrator.md`
      (Root Assignment 43e023cc) holds it as of 2026-09-04 and may put it to the user rather than
      decide it. This entry exists so the question survives either answer.
    opened: 2026-09-04

  - id: B-THE-SAME-BINARY-IS-A-SHARED-PATH
    title: "\"Re-run the same binary\" is only the same binary if nobody else compiled meanwhile"
    problem: >-
      `test.sh:1267` puts the test binary at `BIN="${TMPDIR:-/tmp}/clawdline-tests"` — one fixed
      path, and `TMPDIR` is per-user, not per-session or per-worktree. Every session on this Mac
      compiles to the same file. The suite lock serialises the compiles, so nothing is corrupted,
      but the artefact left behind belongs to whoever ran last.


      That matters because re-running that binary is the standard way here to separate "this tree
      is red" from "this run lost a race" — it is the one measurement that holds the tree still.
      If another session compiles between the runs, the technique silently compares two different
      trees while reporting on one.
    evidence: >-
      2026-09-04. Five re-runs of "the same binary" were started at 09:56; the file's mtime
      afterwards was 10:01:21, inside that window, with two other `test.sh` runs in flight and the
      lock held. The totals disagreed with the tree's seal — 8,679 against 8,667 — which is what a
      different tree looks like, and no conclusion from those five runs was usable. Earlier uses
      of the technique the same day were sound only because the machine had been checked idle
      first, which was luck rather than method: idle at launch does not stay idle.
    severity: degrades
    cost: hours
    who_hurts: contributor
    trigger: >-
      The cheap repair is to record the binary's mtime and size before the first re-run and
      re-read them after the last, so a replaced artefact shows up as a fact rather than as a
      confusing total; the honest repair is a per-run path, since the lock already prevents two
      compiles at once and the shared name buys nothing. Any conclusion of the form "the same
      binary N times" that did not check is the trigger.
    opened: 2026-09-04

  - id: B-AN-APPEND-ONLY-FILE-COLLECTS-WHOEVER-IS-NEAREST
    title: A file everyone appends to never conflicts, so it quietly carries other people's work
    problem: >-
      `docs/backlog.yaml` is written by appending an entry at the tail. Two sessions appending on
      the same day touch different lines, so Git never conflicts and never warns. That is
      comfortable and it is the trap: an entry left uncommitted in the shared tree sits there
      until the next person runs `git add docs/backlog.yaml`, and then it lands inside their
      commit, under their message, at their moment.


      **Naming files explicitly does not stop it.** The shared-tree rule here is to stage by name
      rather than with `git add -A`, and that rule is sound against staging a *different* file by
      accident. It cannot see this, because the file named is the right file — what is wrong is
      some of the lines inside it, and a filename does not address lines.


      There is a second half, worse than the first: **afterwards the file cannot say who wrote
      what.** Every entry looks the same, the commit that carried it names one author, and nothing
      in the format records the difference between "I wrote this" and "this was in my working
      tree".
    evidence: >-
      2026-09-03 16:16, `b283683c` added seven entries to this file. Two of them —
      `B-FANOUT-GATE-GUARD-CANNOT-GO-RED` and `B-DELIVERY-PUSH-DIVERGES-FROM-ITS-SIBLINGS` — were
      the notifications line's own findings, left uncommitted in the shared tree while that
      session worked. They landed inside somebody else's commit.


      The same day, the same file, the opposite direction and a near miss: a root about to commit
      read `git diff --cached --stat`, saw four entries it had not written, and stopped. So the
      trap caught work going both ways within hours, and only the direction that was noticed did
      no harm. Which of the two happened in `b283683c` cannot now be recovered from the file: the
      committing session's own notes say it *carried* those two deliberately, and the authoring
      session's account is that they were swept — and the format keeps no evidence that separates
      the readings.
    severity: degrades
    cost: hours
    who_hurts: contributor
    trigger: >-
      The check that would have caught it is one the file-naming rule does not imply: before
      committing a shared append-only file, read `git diff --cached -- <file>` — the hunks, not
      the stat — and confirm every added entry is one you wrote. The stat says how many lines; it
      never says whose. Any commit to this file that adds entries its message does not account for
      is the trigger.
    opened: 2026-09-04
