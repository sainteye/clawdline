<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Session 星系</title>
<meta name="description" content="Clawdline community plugin design prototype: a galaxy that shows which Sessions need you. Demo data only.">
<style>
/* Session Galaxy — design prototype for a Clawdline community plugin.
   Self-contained: no external fonts, scripts or images. Demo data only; nothing here
   talks to a daemon. The data seam is DEMO_HOST (snapshot + navigate), see bottom script. */
:root {
  --ink: #04050b;
  --ink-2: #0b0e1c;
  --glass: rgba(14, 18, 36, 0.72);
  --glass-line: rgba(160, 180, 255, 0.16);
  --text: #eef1ff;
  --text-2: #aab2d6;
  --text-3: #7780a8;
  --you: #ff7a59;        /* waiting_you: ember */
  --work: #7fe3ff;       /* working: ion */
  --wait: #b9a4ff;       /* waiting_session: lilac */
  --done: #f2cd72;       /* work_complete: gold */
  --unknown: #8a90a6;    /* unknown: ash */
  --shell-bg: #f6f7fb;
  --shell-panel: #ffffff;
  --shell-line: #e3e6ef;
  --shell-text: #1c2033;
  --shell-text-2: #5d6481;
  --shell-accent: #2f7d55;
  --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --shell-bg: #111319; --shell-panel: #171a22; --shell-line: #262a36;
    --shell-text: #e7e9f2; --shell-text-2: #9aa0b8; --shell-accent: #5fcf8c;
  }
}
:root[data-theme="dark"] {
  --shell-bg: #111319; --shell-panel: #171a22; --shell-line: #262a36;
  --shell-text: #e7e9f2; --shell-text-2: #9aa0b8; --shell-accent: #5fcf8c;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--shell-bg); color: var(--shell-text); font: 14px/1.5 var(--font); overflow: hidden; }
button { font: inherit; color: inherit; }

/* ───────────── Demo host shell (stands in for the Clawdline app) ───────────── */
.shell { position: fixed; inset: 0; display: grid; grid-template-rows: 44px 1fr 32px; grid-template-columns: 280px 1fr; }
.shell-top { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--shell-line); background: var(--shell-panel); }
.shell-top b { font-weight: 650; letter-spacing: .01em; }
.demo-pill { font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px dashed var(--shell-text-2); color: var(--shell-text-2); }
.side { border-right: 1px solid var(--shell-line); background: var(--shell-panel); overflow-y: auto; padding: 8px; }
.side h2 { font-size: 12px; color: var(--shell-text-2); font-weight: 600; margin: 8px 8px 6px; }
.row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 8px; cursor: pointer; min-height: 44px; }
.row:hover { background: color-mix(in srgb, var(--shell-text) 6%, transparent); }
.row[aria-current="true"] { background: color-mix(in srgb, var(--shell-accent) 14%, transparent); }
.row .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s { font-size: 11px; color: var(--shell-text-2); white-space: nowrap; }
.main { overflow: auto; padding: 18px 22px; }
.main h1 { font-size: 18px; margin: 0 0 4px; }
.main .meta { color: var(--shell-text-2); font-size: 13px; margin-bottom: 14px; }
.term { background: #0c0e14; color: #cfd6e6; font: 13px/1.6 var(--mono); border-radius: 10px; padding: 14px 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.term .p { color: #6fd39a; }
.statusbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 4px; padding: 0 8px; border-top: 1px solid var(--shell-line); background: var(--shell-panel); font-size: 12px; color: var(--shell-text-2); min-width: 0; }
.statusbar .item { padding: 0 8px; white-space: nowrap; }
.statusbar .spacer { flex: 1; }
.statusbar .diag { font-family: var(--mono); font-size: 11px; opacity: .8; overflow: hidden; text-overflow: ellipsis; }
.dot-ok { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--shell-accent); margin-right: 6px; vertical-align: 1px; }

/* The plugin's collapsed entry */
.galaxy-entry { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px 0 6px; border-radius: 7px; border: 1px solid transparent; background: linear-gradient(120deg, #141833, #221a3a); color: #e9ecff; cursor: pointer; font-size: 12px; white-space: nowrap; position: relative; }
.galaxy-entry:hover { border-color: rgba(185,164,255,.55); }
.galaxy-entry:focus-visible, .row:focus-visible, .ui-btn:focus-visible, .node:focus-visible, .chip:focus-visible { outline: 2px solid #9fd8ff; outline-offset: 2px; }
.galaxy-entry::before { content: ""; position: absolute; inset: -9px -4px; } /* 44px touch target inside a 32px bar */
.entry-badge { font-size: 11px; padding: 0 6px; border-radius: 99px; background: rgba(255,122,89,.18); color: #ffb9a6; border: 1px solid rgba(255,122,89,.45); }
.mini { width: 22px; height: 16px; }
.mini .m-you { transform-origin: 15px 6px; animation: miniPulse 2.4s ease-in-out infinite; }
@keyframes miniPulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

/* ───────────── Galaxy overlay ───────────── */
.galaxy { position: fixed; inset: 0; z-index: 10; background: var(--ink); color: var(--text); visibility: hidden; clip-path: circle(0px at var(--ox, 50%) var(--oy, 100%)); transition: clip-path .75s cubic-bezier(.7,0,.2,1), visibility 0s linear .75s; overflow: clip; }
.galaxy.open { visibility: visible; clip-path: circle(150vmax at var(--ox, 50%) var(--oy, 100%)); transition: clip-path .8s cubic-bezier(.65,0,.25,1), visibility 0s; }
.reduced .galaxy, .reduced .galaxy.open { clip-path: none; opacity: 0; transition: opacity .18s, visibility 0s linear .18s; }
.reduced .galaxy.open { opacity: 1; transition: opacity .18s, visibility 0s; }
.reduced .mini .m-you, .reduced .node .spin { animation: none !important; }
canvas.scene { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas.scene.dragging { cursor: grabbing; }
.nodes { position: absolute; inset: 0; pointer-events: none; overflow: clip; z-index: 1; }
.open-panel .chips { display: none; }
.node.nolabel .lbl { visibility: hidden; }

.g-head { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px; pointer-events: none; z-index: 3; }
.g-head > * { pointer-events: auto; }
.g-title { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.g-title h2 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: .04em; text-shadow: 0 0 18px rgba(127,227,255,.35); }
.g-title .sub { font-size: 12px; color: var(--text-2); }
.g-title .sub b { color: #ffd6ca; font-weight: 600; }
.g-spacer { flex: 1; }
.ui-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--glass-line); background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: var(--text); cursor: pointer; white-space: nowrap; }
.ui-btn:hover { border-color: rgba(185,200,255,.4); }
.ui-btn[aria-pressed="true"] { border-color: rgba(127,227,255,.6); background: rgba(40,70,110,.55); }
.ui-btn.close { font-weight: 600; }
.g-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

.chips { position: absolute; left: 18px; top: 84px; display: flex; flex-direction: column; gap: 6px; z-index: 3; }
.chip { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 4px 12px 4px 8px; border-radius: 10px; border: 1px solid var(--glass-line); background: rgba(10,13,28,.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: var(--text); cursor: pointer; text-align: left; font-size: 13px; }
.chip .n { font-family: var(--mono); font-weight: 600; min-width: 1.4em; text-align: right; }
.chip .why { color: var(--text-3); font-size: 11px; }
.chip[disabled] { opacity: .45; cursor: default; }

/* Session bodies: HTML buttons over the canvas give crisp labels and real touch targets */
.node { position: absolute; left: 0; top: 0; pointer-events: auto; border: 0; background: none; padding: 0; cursor: pointer; display: flex; align-items: center; gap: 8px; transform-origin: 0 50%; will-change: transform; min-height: 44px; }
.node .hit { width: 44px; height: 44px; margin-left: -22px; display: grid; place-items: center; flex: none; }
.node svg { width: 26px; height: 26px; overflow: visible; filter: drop-shadow(0 0 6px currentColor); }
.node .lbl { display: flex; flex-direction: column; margin-left: -8px; padding: 3px 9px; border-radius: 8px; background: rgba(6,8,18,.58); border: 1px solid rgba(255,255,255,.07); white-space: nowrap; text-align: left; max-width: 230px; }
.node .lbl .t { font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; }
.node .lbl .s { font-size: 11px; color: var(--text-2); display: none; }
.node.s-waiting_you .lbl .s, .node[aria-pressed="true"] .lbl .s, .node:hover .lbl .s, .node:focus-visible .lbl .s { display: block; }
.node.s-waiting_you .lbl { border-color: rgba(255,122,89,.45); background: rgba(40,14,10,.62); }
.node[aria-pressed="true"] .lbl { border-color: rgba(255,255,255,.55); background: rgba(16,20,44,.85); }
.node.s-unknown .lbl .t { color: #c5c9d8; }
.node.dim { opacity: .28; }
.s-waiting_you { color: var(--you); } .s-working { color: var(--work); } .s-waiting_session { color: var(--wait); }
.s-work_complete { color: var(--done); } .s-unknown { color: var(--unknown); }
.node .spin { transform-origin: 13px 13px; animation: spin 2.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.proj-label { position: absolute; left: 0; top: 0; pointer-events: none; font-size: 12px; letter-spacing: .14em; color: var(--text-2); white-space: nowrap; text-transform: uppercase; transform-origin: 50% 50%; }
.proj-label b { display: block; font-size: 15px; letter-spacing: .06em; color: var(--text); font-weight: 600; text-transform: none; }
.core-label { position: absolute; left: 0; top: 0; pointer-events: none; font-size: 12px; color: #fff4e6; letter-spacing: .3em; text-shadow: 0 0 10px #ffb07a; }

/* Detail panel (desktop) / bottom sheet (phone) */
.panel { position: absolute; z-index: 4; top: 84px; right: 18px; bottom: 56px; width: 360px; display: flex; flex-direction: column; border-radius: 18px; border: 1px solid var(--glass-line); background: var(--glass); backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2); box-shadow: 0 30px 80px rgba(0,0,0,.45); overflow: hidden; transform: translateX(calc(100% + 30px)); transition: transform .45s cubic-bezier(.2,.8,.2,1); }
.panel:not(.show) { visibility: hidden; transition: transform .45s cubic-bezier(.2,.8,.2,1), visibility 0s linear .45s; }
.panel.show { transform: none; }
.reduced .panel { transition: none; }
.panel-scroll { overflow-y: auto; padding: 18px 20px 20px; flex: 1; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 10px 0 20px; }
.panel-head .kicker { font-size: 11px; letter-spacing: .14em; color: var(--text-3); }
.state-tag { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 8px; border-radius: 99px; border: 1px solid currentColor; font-size: 13px; font-weight: 600; background: color-mix(in srgb, currentColor 10%, transparent); }
.state-tag svg { width: 18px; height: 18px; }
.panel h3 { font-size: 20px; line-height: 1.35; margin: 14px 0 4px; color: var(--text); }
.panel .proj { color: var(--text-2); font-size: 13px; }
.facts { margin: 16px 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 13px; }
.facts dt { color: var(--text-3); }
.facts dd { margin: 0; color: var(--text); overflow-wrap: anywhere; }
.facts dd.na { color: var(--text-2); font-style: italic; }
.callout { border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.6; margin: 12px 0; border: 1px solid; }
.callout.you { border-color: rgba(255,122,89,.5); background: rgba(255,122,89,.09); }
.callout.unknown { border-color: rgba(138,144,166,.5); background: rgba(138,144,166,.08); border-style: dashed; }
.callout.wait { border-color: rgba(185,164,255,.45); background: rgba(185,164,255,.07); }
.callout .k { display: block; font-size: 11px; letter-spacing: .1em; color: var(--text-3); margin-bottom: 3px; }
.link-btn { border: 0; background: none; padding: 0; color: #d6c9ff; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; min-height: 32px; text-align: left; }
.why-here { font-size: 12px; color: var(--text-3); line-height: 1.6; margin-top: 14px; }
.panel-foot { padding: 14px 20px 18px; border-top: 1px solid var(--glass-line); display: flex; gap: 8px; }
.go { flex: 1; min-height: 46px; border-radius: 12px; border: 0; cursor: pointer; font-weight: 650; color: #081018; background: linear-gradient(120deg, #9fe9ff, #d8ccff); }
.list-group h4 { margin: 14px 0 6px; font-size: 12px; color: var(--text-3); letter-spacing: .1em; display: flex; align-items: center; gap: 6px; }
.list-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; border: 0; border-radius: 10px; background: rgba(255,255,255,.03); margin-bottom: 4px; padding: 6px 10px; cursor: pointer; text-align: left; }
.list-item:hover { background: rgba(255,255,255,.07); }
.list-item svg { width: 18px; height: 18px; flex: none; }
.list-item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.list-item .s { font-size: 11px; color: var(--text-2); white-space: nowrap; }

.g-foot { position: absolute; left: 18px; right: 18px; bottom: 14px; z-index: 3; display: flex; gap: 14px; align-items: center; font-size: 11px; color: var(--text-3); pointer-events: none; }
.g-foot .diag { font-family: var(--mono); }
.hint { margin-left: auto; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ───────────── Phone ───────────── */
@media (max-width: 720px) {
  .shell { grid-template-columns: 1fr; }
  .side { display: none; }
  .main { padding: 14px; }
  .statusbar .hide-phone { display: none; }
  .g-head { padding: 12px; gap: 8px; }
  .g-title h2 { font-size: 17px; }
  .g-actions .ui-btn { padding: 0 11px; }
  .g-actions .opt { display: none; }
  .chips { top: auto; bottom: 50px; left: 12px; right: 12px; flex-direction: row; overflow-x: auto; scrollbar-width: none; }
  .chip { flex: none; min-height: 44px; }
  .chip .why { display: none; }
  .panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 58vh; border-radius: 20px 20px 0 0; transform: translateY(105%); }
  .panel.show { transform: none; }
  .node .lbl { max-width: 150px; }
  .node .lbl .t { font-size: 12px; }
  .node.minor .lbl { display: none; }
  .g-foot .hint { display: none; }
  .g-foot { bottom: 8px; }
  .open-panel .chips { display: none; }
}
/* ── Added for View Plugin v1 alignment ── */
.s-holding { color: #f59ac4; } .s-ready { color: #8ee6b5; } .s-milestone_complete { color: #e8d9a8; }
.node.stale svg, .list-item.stale svg { filter: grayscale(.75) brightness(.8); }
.node.stale .lbl { border-style: dashed; border-color: rgba(200,205,220,.35); }
.fresh-tag { display: inline-block; margin-left: 6px; font-size: 10px; padding: 0 6px; border-radius: 99px; border: 1px dashed rgba(200,205,220,.6); color: #d3d7e4; vertical-align: 1px; }
.banner { position: absolute; z-index: 5; left: 50%; top: 82px; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 12px; border: 1px dashed rgba(255,210,150,.6); background: rgba(40,28,12,.82); color: #ffe3bf; font-size: 13px; display: none; text-align: center; }
.banner.show { display: block; }
.err { margin-top: 10px; font-size: 13px; color: #ffc2b3; }
.fallback { position: absolute; inset: 120px 20px 60px; z-index: 2; display: none; color: var(--text-2); }
.fallback.show { display: block; }
/* Mock host dock: belongs to the demo host, not to the plugin */
.host-dock { position: fixed; z-index: 30; left: 12px; bottom: 40px; display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 6px; font-size: 12px; }
.host-dock > button, .host-dock .dock-body button { min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1px dashed #c9a8ff; background: #1a1430; color: #eadfff; cursor: pointer; white-space: nowrap; }
.host-dock .dock-body { display: none; flex-direction: column; gap: 6px; padding: 10px; border-radius: 12px; background: rgba(16,12,32,.94); border: 1px dashed #c9a8ff; color: #d9ccf5; max-width: 260px; }
.host-dock.expanded .dock-body { display: flex; }
.host-dock .dock-body p { margin: 0 0 4px; line-height: 1.5; }
@media (max-width: 720px) {
  .host-dock { left: auto; right: 8px; bottom: 108px; align-items: flex-end; }
  .host-dock > button { min-height: 44px; }
  body:has(.galaxy.open-panel) .host-dock { display: none; }
  .banner { top: 70px; }
}
</style>
</head>
<body>

<!-- ════════ DEMO HOST (mock) — stands in for a future Clawdline host. Not production UI. ════════ -->
<div class="shell" id="shell">
  <header class="shell-top"><b>Clawdline</b><span class="demo-pill">示範宿主 · 示範資料</span></header>
  <nav class="side" id="sideList" aria-label="Session 清單"></nav>
  <main class="main" id="mainView"></main>
  <footer class="statusbar" aria-label="狀態列">
    <span class="item"><span class="dot-ok" id="connDot"></span><span id="connText">本機已連線</span></span>
    <span class="item hide-phone" id="sbCount"></span>
    <span class="spacer"></span>
    <span class="item diag hide-phone" id="diagShell"></span>
    <button class="galaxy-entry" id="entry" aria-haspopup="dialog" aria-controls="galaxy">
      <svg class="mini" viewBox="0 0 22 16" aria-hidden="true">
        <ellipse cx="11" cy="8" rx="9.5" ry="4.6" fill="none" stroke="#8d93c9" stroke-width="1"/>
        <circle cx="11" cy="8" r="1.8" fill="#ffe2c4"/>
        <circle cx="4" cy="9" r="1.2" fill="#7fe3ff"/>
        <circle cx="18" cy="9.5" r="1.1" fill="#f2cd72"/>
        <circle class="m-you" cx="15" cy="6" r="1.9" fill="#ff7a59"/>
      </svg>
      <span>星系</span><span class="entry-badge" id="entryBadge"></span>
    </button>
  </footer>
</div>
<div class="host-dock" id="hostDock">
  <button id="dockToggle" aria-expanded="false" aria-controls="dockBody">示範宿主控制</button>
  <div class="dock-body" id="dockBody">
    <p>這些按鈕屬於示範宿主，用來模擬宿主送給插件的快照與情境。</p>
    <button id="dockSnap">送出新快照（rev +1）</button>
    <button id="dockConn">中斷連線</button>
    <button id="dockMotion" aria-pressed="false">減少動態：關</button>
  </div>
</div>

<!-- ════════ PLUGIN VIEW — the community plugin's own DOM. A real host would load this in a sandboxed iframe. ════════ -->
<section class="galaxy" id="galaxy" role="dialog" aria-modal="true" aria-labelledby="gTitle" aria-hidden="true">
  <canvas class="scene" id="scene" aria-hidden="true"></canvas>
  <div class="nodes" id="nodes"></div>
  <div class="fallback" id="fallback"></div>
  <div class="g-head">
    <div class="g-title">
      <h2 id="gTitle">Session 星系</h2>
      <div class="sub" id="gSub"></div>
    </div>
    <div class="g-spacer"></div>
    <div class="g-actions">
      <button class="ui-btn" id="btnList" aria-pressed="false">清單</button>
      <button class="ui-btn close" id="btnClose" aria-label="關閉星系，返回 Session">✕ 返回 Session</button>
    </div>
  </div>
  <div class="banner" id="banner" role="status"></div>
  <div class="chips" id="chips" aria-label="依狀態查看"></div>
  <aside class="panel" id="panel" aria-live="polite">
    <div class="panel-head"><span class="kicker" id="panelKicker">SESSION</span><button class="ui-btn" id="btnPanelClose" aria-label="收起詳細資料">✕</button></div>
    <div class="panel-scroll" id="panelBody"></div>
    <div class="panel-foot" id="panelFoot"></div>
  </aside>
  <div class="g-foot">
    <span id="gScope"></span>
    <span class="diag" id="diagScene"></span>
    <span class="hint">拖曳旋轉 · 滾輪縮放 · Esc 返回</span>
  </div>
</section>

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════════
   PART A — MOCK HOST + MOCK ADAPTER (demo only; replaceable)
   Implements the author-facing shape of View Plugin v1 revision 1:
     connectViewPlugin() → view
     view.sessions.subscribe(onLaterSnapshot) → Promise<initial complete snapshot>
     view.sessions.open(ref) → Promise<{opened:true}> | rejects {code}
     view.onContext(handler), view.close(), view.dispose()
   It is NOT the specified MessagePort/iframe host, installer or SDK. The host owns
   the status-bar entry, its badge, navigation, Escape/Back restoration and context.
   ════════════════════════════════════════════════════════════════════════ */
const MockHost = (() => {
  const PROJECTS = { core: "clawdline", cloud: "clawdline-cloud", site: "官網", study: "設計研究" };
  /* Host-side rows can carry more than the plugin may see (assistant, branch). The adapter

  if (location.hash.includes("reduced")) MockHost.setReduced(true); // review switch
  MockHost.onChange(render);
  render();
  $("diagShell").textContent = "示範診斷：場景已暫停 · 0 幀";
})();
</script>
</body>
</html>
