<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" xml:lang="zh-Hant">
<title id="title">內容離開你的機器前，已先加密</title>
<desc id="desc">內容離開你的機器前，已先加密 · Cloud 遠端存取 · 內容金鑰由你的機器與已配對的瀏覽器持有。 · 你的機器 · 已配對的瀏覽器 · 對話與終端機 · 專案檔案 · 手機或另一台電腦 · 由你核准的裝置 · 你好 · 傳送前先加密 · 在你的裝置上解密 · 只轉送密文 · 無法讀取 Session 內容 · 本機使用不需帳號；Cloud 預設關閉，由你決定是否開啟。 · Cloud 仍可看見帳號、裝置與流量等中繼資料。 · 請只配對信任的瀏覽器：配對後可傳送指示及操作終端機。</desc>
<defs>
<marker id="transfer-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#83ad95" stroke-width="1.6"/></marker>
<marker id="transfer-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9 1L1 5L9 9" fill="none" stroke="#83ad95" stroke-width="1.6"/></marker>
</defs>
