 device</text><path d="M360 337H840" fill="none" stroke="#83ad95" stroke-width="2" stroke-dasharray="5 7" marker-start="url(#transfer-start)" marker-end="url(#transfer-end)"/><text x="600" y="230" font-size="26" fill="#e8e6e3" font-weight="600" text-anchor="middle">Clawdline Cloud</text><text x="430" y="312" font-size="18" fill="#a7c6b2" font-weight="400" text-anchor="middle" font-family="Menlo, monospace">7F A2 C9</text><text x="770" y="312" font-size="18" fill="#a7c6b2" font-weight="400" text-anchor="middle" font-family="Menlo, monospace">7F A2 C9</text><path d="M551 357C534 357 521 344 521 328C521 313 532 300 547 299C551 274 572 255 597 255C622 255 643 271 649 294C669 294 684 308 684 325C684 343 670 357 651 357Z" fill="#16161a" stroke="#b4aca3" stroke-width="2.5" stroke-linejoin="round"/><g stroke="#d99b7c" stroke-width="2.2" fill="#16161a"><path d="M657 348v-9a7 7 0 0 1 14 0v9"/><rect x="650" y="348" width="28" height="23" rx="4"/><path d="M664 357v7"/></g><text x="600" y="412" font-size="25" fill="#e8e6e3" font-weight="600" text-anchor="middle">Relays ciphertext</text><text x="600" y="446" font-size="21" fill="#a8a39a" font-weight="400" text-anchor="middle">Cannot read Session content</text><path d="M48 513H1152" stroke="#393532"/><text x="48" y="558" font-size="22" fill="#e8e6e3" font-weight="400" text-anchor="start">Local use needs no account. Cloud stays off until you turn it on.</text><text x="48" y="608" font-size="22" fill="#b9b2a9" font-weight="400" text-anchor="start">Cloud still sees account, device and traffic metadata.</text><text x="48" y="658" font-size="22" fill="#b9b2a9" font-weight="400" text-anchor="start">Pair only trusted browsers: they can send instructions and use your terminal.</text>
