<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Encrypted before it leaves your machine</title>
<desc id="desc">Encrypted before it leaves your machine · Cloud remote access · only your machine and paired browsers hold content keys. · Your machine · Paired browser · Conversations + terminals · Project files · Phone or another computer · A device you approved · Hello · Encrypt before sending · Decrypt on your device · Relays ciphertext · Cannot read Session content · Local use needs no account. Cloud stays off until you turn it on. · Cloud still sees account, device and traffic metadata. · Pair only trusted browsers: they can send instructions and use your terminal.</desc>
<defs>
<marker id="transfer-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#83ad95" stroke-width="1.6"/></marker>
<marker id="transfer-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9 1L1 5L9 9" fill="none" stroke="#83ad95" stroke-width="1.6"/></marker>
</defs>
<rect width="1200" height="720" rx="16" fill="#16161a"/>
<g font-family="Arial, PingFang TC, Noto Sans TC, system-ui, sans-serif">
