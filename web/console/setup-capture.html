<!-- The setup wizard's capture page: the real wizard components with sample
     data, for documentation screenshots (src/setup/capture.tsx). A development
     page only: the console's build does not include it. -->
<!doctype html>
<html lang="en" dir="ltr" class="booting">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Setup guide capture</title>
    <style>
      body { margin: 0; min-height: 100vh; background: #0e0e11; color: #e8e6e3;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      /* The dialog takes keyboard focus as it opens; a photograph should not show that ring. */
      .setup-dialog:focus, .setup-dialog:focus-visible { outline: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/setup/capture.tsx"></script>
  </body>
</html>
