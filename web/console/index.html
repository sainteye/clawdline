<!-- No doctype, on purpose. The Swift app's page has none, so it renders in
     quirks mode, and the copied stylesheet was written and tuned there: a table
     row is 90px under quirks and 94.3px under standards, among other things.
     Replicating strictly means inheriting that. If the original ever gains a
     doctype, this should gain one in the same change. -->
<!-- `lang` is the catalog this build ships and every transport defaults to:
     `web/console/public/strings/zh-Hant.json`, which the daemon writes into the
     document below and the hosted bundle reads from its own origin
     (`src/cloud/strings.ts`, `DEFAULT_TAG` — `carry.test.ts` pins the three to
     one constant). It was `en`, which was only ever right for the seconds
     before the words arrived, and on the hosted console it was right for good:
     nothing there ever answered with a catalog, so `applyStrings` never
     overwrote it and the whole page stayed in a language its reader had not
     asked for. A load that finds no catalog puts `en` back, because that is
     what the built-in words in `legacy/js/core/i18n.js` are. -->
<html lang="zh-Hant" class="booting">
  <head>
    <meta charset="utf-8" />
    <!-- The viewport is the Swift page's, and both halves of it are deliberate.

         `user-scalable=no` is a trade against accessibility, made because this is a thing you add
         to a home screen and use as an app rather than a page you visit. Pinch zoom there is
         almost always an accident. What it costs is paid for in the layout instead: nothing here
         needs magnifying to be read, every text field is at least 16px on a touch screen so that
         focusing one cannot zoom the page either, and the page never scrolls sideways.

         **No `viewport-fit=cover`.** It was here, and on an iPhone added to the home screen it
         leaves a strip of dead page along the bottom of every screen — measured on a 15 Pro at 59
         points, which is the *top* inset: iOS hands the web app the safe height and then draws it
         from the top of the display, so the shortfall comes out at the far end, and no padding
         inside the page can fill something the page does not extend into. Without `cover`, iOS
         lays the view out inside the safe area itself and every `env(safe-area-inset-*)` is zero
         by definition — which is what the copied stylesheet was written against, and it says so
         in `legacy/tokens.css` and `legacy/composer.css`. -->
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="clawdline" />
    <!-- `black` rather than `black-translucent`: see the viewport note. Translucent is what put
         the view's top edge under the clock, and this page is `#0e0e11`, so a black strip above
         it is a shade nobody can pick out. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#0e0e11" />
    <title>clawdline</title>
    <link rel="manifest" href="/manifest.webmanifest" id="manifest-link" />

    <!-- The launch image, twenty times over.
         iOS will not derive one from the manifest, and without these a page added to the home
         screen opens on a black rectangle for a second or more while the WebKit process starts —
         which reads as an app that failed to launch rather than as one that is launching. There
         is no wildcard: a tag is matched by the exact geometry of the screen, so every geometry
         needs its own, and the daemon draws whichever size is asked for (`internal/domain/icon`,
         `internal/transport/http/pwa.go`) rather than shipping twenty files.
         iPhones only, deliberately. This is the screen people add this to a home screen from, and
         twenty tags is already a wall of markup; an iPad that matches none of them falls back to
         the black it has today, which is where it started. -->
    <link rel="apple-touch-startup-image" href="/splash-1320x2868.png"
          media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />

    <!-- The interface's words, written in by the server rather than asked for.
         The daemon replaces the comment below with one line setting
         `window.__strings`, the same slot the Swift app's page uses. It was the
         last round trip in front of the first paint and the worst-placed one:
         nothing is drawn until the words land, so fetching them meant a beat of
         blank for every load. Left as a comment by anything that is not the
         daemon — the dev server, a copy opened from disk — and the console
         falls back to fetching /v1/strings. -->
    <!-- clawdline:strings -->
  </head>
  <body>
    <!-- display: contents, so this is not in the layout. The stylesheet is the
         Swift app's, where the header, the drawer and the pages are the body's
         own flex children; a container between them and the body would make
         every height in it mean something else. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
