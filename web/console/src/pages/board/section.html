
    <header class="board-head">
        <button id="board-back" type="button">Back</button>
        <button id="board-timeline-tab" class="board-button" type="button">Timeline</button>
        <button id="board-refresh" class="board-button" type="button">Refresh</button>
    </header>
    <div class="board-intro">
        <p class="board-eyebrow">PROJECT / BOARD</p>
        <div class="board-project-heading">
            <canvas id="board-project-mark" class="project-mark" hidden aria-hidden="true"></canvas>
            <h1 tabindex="-1" id="board-title">Projects</h1>
        </div>
        <p id="board-subtitle"></p>
    </div>
    <p id="board-status" role="status" aria-live="polite"></p>
    <input id="board-search" type="search" aria-label="Search project work" hidden>
    <div id="board-items"></div>
    <div id="board-detail" hidden></div>
