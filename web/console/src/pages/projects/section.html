
    <div class="projects-shell">
        <div id="projects-list-view">
            <div class="projects-heading">
                <div>
                    <!-- `tabindex="-1"` so the keyboard can be given the heading on arrival and
                         on the way back from a Project: it is the one thing on this page that is
                         always there and always says where you are. -->
                    <h1 id="projects-title" tabindex="-1" data-next-word="projectsTitle"></h1>
                    <p class="projects-lede" id="projects-lede" data-next-word="projectsLede"></p>
                </div>
                <span class="projects-stat" id="projects-count"></span>
            </div>
            <div id="project-icon-copy-host"></div>
            <p class="projects-status" id="projects-status" role="status" aria-live="polite"></p>
            <ol class="projects-rows" id="projects-rows"></ol>
        </div>

        <div id="projects-detail-view" hidden>
            <button class="projects-back" id="projects-back" type="button" data-next-word="projectsBack"></button>
            <div class="projects-heading project-identity">
                <canvas class="project-mark none" id="project-mark" width="0" height="0" aria-hidden="true"></canvas>
                <div>
                    <h1 id="project-name">Project</h1>
                    <p class="projects-path" id="project-path"></p>
                </div>
            </div>
            <p class="projects-status" id="project-status" role="status" aria-live="polite"></p>
            <p class="projects-warning" id="project-truncated" role="alert" hidden></p>

            <section class="project-worktree-lifecycle" id="project-worktree-lifecycle" hidden
                     aria-labelledby="project-worktree-title">
                <div class="project-worktree-heading">
                    <div>
                        <p class="project-worktree-eyebrow" data-next-word="projectsRepositoryLifecycle"></p>
                        <h2 id="project-worktree-title" data-next-word="projectsWorktrees"></h2>
                    </div>
                    <button id="project-worktree-refresh" type="button" data-next-word="projectsRefreshObservation"></button>
                </div>
                <p class="project-worktree-boundary" data-next-word="projectsLifecycleBoundary"></p>
                <p class="project-worktree-summary" id="project-worktree-summary"></p>
                <p class="project-worktree-status" id="project-worktree-status" role="status"
                   aria-live="polite"></p>
                <div class="project-worktree-rows" id="project-worktree-rows"></div>
            </section>

            <!-- The one block on this page that is open by default, and the reason the page
                 exists. Thirty-eight of this repository's seventy-nine Feature-carrying
                 worktrees are in this state: the work finished and no landing record says it
                 reached a branch. It is drawn as the subject rather than as one row of a table
                 of five equal outcomes. -->
            <section class="project-delivered" id="project-delivered"
                     aria-labelledby="project-delivered-title" hidden>
                <div class="project-delivered-head">
                    <strong class="project-delivered-count" id="project-delivered-count">—</strong>
                    <div>
                        <h2 id="project-delivered-title" data-next-word="projectsDeliveredNotLanded"></h2>
                        <p class="project-delivered-say" id="project-delivered-say"></p>
                    </div>
                </div>
                <ol class="project-worktrees" id="project-delivered-list"></ol>
            </section>
            <p class="project-good" id="project-delivered-none" hidden></p>

            <!-- The query ran and matched nothing. Said out loud, and beside the receipt below
                 rather than instead of it: an empty answer and an answer that never arrived are
                 different facts, and the route already refuses rather than returning a blank. -->
            <p class="project-none" id="project-none" hidden></p>

            <div class="project-groups" id="project-groups"></div>

            <p class="project-note" id="project-excluded" hidden></p>

            <!-- Not this Project's, and not dropped either. Rows written before canonical Project
                 keys existed carry a checkout path as their own key, so they belong under no
                 Project a surface may name. Counting them here is what keeps that absence
                 visible — see docs/usage-attribution.md for the migration that would end it. -->
            <section class="project-unattributed" id="project-unattributed"
                     aria-labelledby="project-unattributed-title" hidden>
                <h2 id="project-unattributed-title" data-next-word="projectsUnattributedWorktrees"></h2>
                <p id="project-unattributed-say"></p>
            </section>

            <!-- The receipt. Present whenever the route answered, empty whenever it did not. -->
            <p class="project-read" id="project-read"></p>
        </div>
    </div>
