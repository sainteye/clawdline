
    <div class="ledger-shell">
        <div id="ledger-list-view">
            <div class="ledger-heading">
                <div>
                    <!-- `tabindex="-1"` so the keyboard can be handed the heading on arrival and
                         on the way back from a Feature. -->
                    <h1 id="ledger-title" tabindex="-1">Verification ledger</h1>
                    <p class="ledger-lede" id="ledger-lede">What each Feature's reviews found, what proving it cost, and how its tokens divided between building the work and reading it.</p>
                </div>
                <span class="ledger-stat" id="ledger-count"></span>
            </div>
            <p class="ledger-status" id="ledger-status" role="status" aria-live="polite"></p>
            <!-- Above the list and not inside any Feature: on a Mac that has not relaunched since
                 the backfill landed, this is most of the store, and every figure below is short
                 by exactly this much. -->
            <section class="ledger-unattributed" id="ledger-unattributed" hidden></section>
            <div class="ledger-rows" id="ledger-rows"></div>
        </div>

        <div id="ledger-detail-view" hidden>
            <button class="ledger-back" id="ledger-back" type="button">&lsaquo; Verification ledger</button>
            <h1 class="ledger-detail-title" id="ledger-detail-title">Feature</h1>
            <p class="ledger-status" id="ledger-detail-status" role="status" aria-live="polite"></p>
            <div class="ledger-rows" id="ledger-detail-rows"></div>
        </div>
    </div>
