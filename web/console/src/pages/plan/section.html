
    <div class="plan-shell">
        <div class="plan-heading">
            <div>
                <h1 id="plan-title" tabindex="-1">Plan</h1>
                <p class="plan-lede" id="plan-lede">What this Cloud account is entitled to, and how to change it.</p>
            </div>
            <button class="plan-close" id="plan-close" type="button" data-page-to="sessions">Sessions</button>
        </div>

        <div class="plan-card">
            <strong class="plan-tier" id="plan-tier">Free</strong>
            <p class="plan-tier-note" id="plan-tier-note"></p>
            <p class="plan-say" id="plan-say" role="status" aria-live="polite" hidden></p>
            <p class="plan-alert" id="plan-alert" role="alert" hidden></p>
            <div class="plan-actions">
                <button class="plan-go" id="plan-upgrade" type="button" hidden>Upgrade to Pro</button>
                <button class="plan-alt" id="plan-portal" type="button" hidden>Manage subscription</button>
                <button class="plan-go" id="plan-signin" type="button" hidden>Continue with GitHub</button>
                <button class="plan-alt" id="plan-retry" type="button" hidden>Try again</button>
                <button class="plan-alt" id="plan-recheck" type="button" hidden>Check again</button>
            </div>
            <!-- Only on the copy of this page the Mac itself serves, where there is no Cloud
                 account to charge and saying so is the honest answer rather than a broken one. -->
            <p class="plan-elsewhere" id="plan-elsewhere" hidden></p>
            <p class="plan-elsewhere-link"><a id="plan-console" href="https://app.clawdline.com/#page=plan">app.clawdline.com</a></p>
        </div>

        <h2 class="plan-includes" id="plan-includes">What this plan includes</h2>
        <dl class="plan-limits" id="plan-limits" hidden></dl>
        <p class="plan-fine" id="plan-fine" hidden></p>
        <section class="plan-simulation" id="plan-simulation" hidden>
            <h2 id="plan-simulation-title">SuperUser plan simulation</h2>
            <dl class="plan-limits" id="plan-simulation-values"></dl>
            <div class="plan-actions">
                <button class="plan-alt" id="plan-simulation-actual" type="button">Actual</button>
                <button class="plan-alt" id="plan-simulation-free" type="button">Free</button>
                <button class="plan-alt" id="plan-simulation-pro" type="button">Pro</button>
            </div>
        </section>
    </div>
