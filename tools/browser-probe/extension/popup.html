<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Clawdline</title>
<style>
:root { color-scheme: light dark; --bg:#ffffff; --ink:#1f1f22; --dim:#5d5a54; --line:#e4e2dd; --accent:#b85a3c; --ok:#2f7d4a; --card:#f6f5f2 }
@media (prefers-color-scheme: dark) { :root { --bg:#0e0e11; --ink:#e8e6e3; --dim:#a8a59d; --line:#2a2a31; --accent:#e0896b; --ok:#7cc493; --card:#16161a } }
body { margin:0; width:360px; background:var(--bg); color:var(--ink); font:13px/1.55 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Segoe UI", system-ui, sans-serif }
header { display:flex; gap:12px; align-items:center; padding:16px 16px 12px; border-bottom:1px solid var(--line) }
header img { width:40px; height:40px; border-radius:9px }
h1 { margin:0; font-size:15px; font-weight:650 }
.badge { margin-top:2px; font-size:12px; color:var(--accent); font-weight:600 }
.status { margin:12px 16px 4px; padding:10px 12px; border-radius:10px; background:var(--card); display:flex; gap:10px; align-items:flex-start }
.dot { width:9px; height:9px; border-radius:50%; margin-top:5px; flex:none; background:var(--dim) }
.status[data-on="true"] .dot { background:var(--ok) }
.port { color:var(--dim); font-size:12px; font-family:ui-monospace, Menlo, monospace }
section { padding:10px 16px 2px }
h2 { margin:0 0 4px; font-size:12px; font-weight:650; letter-spacing:.02em; color:var(--dim) }
p { margin:0 }
ul { margin:0; padding-left:18px }
li + li { margin-top:3px }
footer { margin-top:10px; padding:10px 16px 14px; border-top:1px solid var(--line) }
</style>
</head>
<body>
<header>
  <img src="icons/icon-128.png" alt="">
  <div><h1 data-i18n="extName"></h1><div class="badge" data-i18n="popupBadge"></div></div>
</header>
<div class="status" id="status" data-on="false" role="status">
  <span class="dot" aria-hidden="true"></span>
  <div><div id="status-text" data-i18n="statusIdle"></div><div class="port" id="port"></div></div>
</div>
<section><h2 data-i18n="purposeTitle"></h2><p data-i18n="purposeBody"></p></section>
<section><h2 data-i18n="doesTitle"></h2><ul><li data-i18n="does1"></li><li data-i18n="does2"></li><li data-i18n="does3"></li></ul></section>
<section><h2 data-i18n="doesNotTitle"></h2><ul><li data-i18n="doesNot1"></li><li data-i18n="doesNot2"></li><li data-i18n="doesNot3"></li></ul></section>
<section><h2 data-i18n="permsTitle"></h2><ul><li data-i18n="permDebugger"></li><li data-i18n="permTabs"></li><li data-i18n="permSites"></li></ul></section>
<footer><h2 data-i18n="removeTitle"></h2><p data-i18n="removeBody"></p></footer>
<script src="popup.js"></script>
</body>
</html>
