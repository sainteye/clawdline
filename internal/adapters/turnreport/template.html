<html lang="__LANG__">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>__TITLE__</title>
<style>
:root{
  --bg:#f7f6f3; --panel:#ffffff; --ink:#1f1e1c; --muted:#6b6862; --line:#e4e1da;
  --accent:#c4683f; --accent-soft:#f6e6dc; --ok:#2f7d4f; --ok-soft:#e2f1e7;
  --warn:#9a6a00; --warn-soft:#fbf0d2; --add:#e6f4ea; --add-ink:#1e6b37;
  --del:#fbe9e9; --del-ink:#a32b2b; --hunk:#eef1f8; --hunk-ink:#44506b; --code:#f2f0eb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151517; --panel:#1d1d20; --ink:#ebe9e4; --muted:#9c988f; --line:#2f2f33;
    --accent:#e08a5f; --accent-soft:#3a2a22; --ok:#6cc48f; --ok-soft:#1e3326;
    --warn:#e2b84f; --warn-soft:#3a3120; --add:#16301f; --add-ink:#8fd6a6;
    --del:#3a1c1c; --del-ink:#f0a0a0; --hunk:#232a3a; --hunk-ink:#a9b6d6; --code:#26262a;
  }
}
:root[data-theme="dark"]{
  --bg:#151517; --panel:#1d1d20; --ink:#ebe9e4; --muted:#9c988f; --line:#2f2f33;
  --accent:#e08a5f; --accent-soft:#3a2a22; --ok:#6cc48f; --ok-soft:#1e3326;
  --warn:#e2b84f; --warn-soft:#3a3120; --add:#16301f; --add-ink:#8fd6a6;
  --del:#3a1c1c; --del-ink:#f0a0a0; --hunk:#232a3a; --hunk-ink:#a9b6d6; --code:#26262a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.status{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h3{font-size:15px;margin:0 0 4px}
.card p{margin:0;color:var(--muted);font-size:13.5px}
.card code{font-size:12.5px}
.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px;align-items:start}
.side{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.pin{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pin button,.chips button,.tabs button{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:3px 11px;cursor:pointer}
.pin button{border-color:var(--accent);color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.chips button[aria-pressed="true"],.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tree{list-style:none;margin:0;padding:0;font-size:13.5px}
.tree ul{list-style:none;margin:0;padding-left:14px;border-left:1px solid var(--line);margin-left:7px}
.row{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:6px;cursor:pointer;user-select:none;white-space:nowrap}
.row:hover{background:var(--code)}
.row.active{background:var(--accent-soft);outline:1px solid var(--accent)}
.row .name{overflow:hidden;text-overflow:ellipsis}
.caret{width:10px;color:var(--muted);font-size:10px;flex:none}
.ico{flex:none;width:16px;height:16px}
.badge{flex:none;font-size:10.5px;border-radius:4px;padding:0 5px;margin-left:auto}
.badge.new{background:var(--ok-soft);color:var(--ok)}
.badge.mod{background:var(--warn-soft);color:var(--warn)}
.badge.del{background:var(--del);color:var(--del-ink)}
.collapsed>ul{display:none}
.view{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:60vh;overflow:hidden}
.vhead{padding:12px 16px;border-bottom:1px solid var(--line)}
.vpath{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;word-break:break-all}
.vnote{margin:6px 0 0;font-size:14px}
.vmeta{color:var(--muted);font-size:12.5px;margin-top:4px}
.tabs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.vbody{padding:16px;overflow:auto}
.md{max-width:820px}
.md h1{font-size:21px}.md h2{font-size:18px;margin-top:1.6em;padding-top:.6em;border-top:1px solid var(--line)}.md h3{font-size:16px}
.md code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.88em}
.md pre{background:var(--code);padding:10px 12px;border-radius:8px;overflow:auto}
.md pre code{padding:0;background:none}
.md table{border-collapse:collapse;display:block;overflow:auto;font-size:14px;margin:10px 0}
.md th,.md td{border:1px solid var(--line);padding:5px 9px;vertical-align:top}
.md th{background:var(--code)}
.md blockquote{margin:10px 0;padding:2px 14px;border-left:3px solid var(--accent);color:var(--muted)}
pre.src,pre.diff{margin:0;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;tab-size:4}
pre.src{counter-reset:ln}
.diff .a{background:var(--add);color:var(--add-ink);display:block}
.diff .d{background:var(--del);color:var(--del-ink);display:block}
.diff .h{background:var(--hunk);color:var(--hunk-ink);display:block}
.diff .f{color:var(--muted);display:block}
.chead{font-size:13px;margin:16px 0 6px;padding:6px 10px;background:var(--code);border-radius:6px}
.chead:first-child{margin-top:0}
.chead code{font-size:12px;color:var(--accent)}
.empty{color:var(--muted);padding:40px 16px;text-align:center}
.legend{color:var(--muted);font-size:12px;margin:8px 2px 0}
.legend .badge{margin-left:0}
.omitted{color:var(--muted);font-size:12.5px;margin:10px 2px 0}
.omitted ul{margin:4px 0 0;padding-left:18px}
.omitted code{font-size:12px;word-break:break-all}
.md pre.rawhtml{border-left:3px solid var(--warn)}
.md a.img,.md span.img{color:var(--muted)}
.cut{color:var(--warn);font-size:12.5px;margin:6px 0 0}
.md img{max-width:100%}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .side{position:static;max-height:46vh}
}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <div class="status" id="cards"></div>
  <div class="layout">
    <aside class="side">
      <div class="pin" id="pins"></div>
      <div class="chips" id="chips"></div>
      <ul class="tree" id="tree"></ul>
      <div class="legend" id="legend"></div>
      <div class="omitted" id="omitted"></div>
    </aside>
    <main class="view" id="view"></main>
  </div>
</div>

<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
(function(){
  var D = JSON.parse(document.getElementById('data').textContent);
  var L = {
    'en': {pick:'Pick a file on the left', all:'All', doc:'Docs', code:'Code', test:'Tests',
      new_:'new', mod:'changed', del:'deleted', newLong:'Added', modLong:'Changed', delLong:'Deleted',
      legendNew:'added this turn', legendMod:'changed this turn', legendDel:'deleted this turn',
      read:'Read', diff:'This turn’s changes', src:'Source', open:'Open ',
      commits:function(n){ return n + (n === 1 ? ' commit' : ' commits'); },
      sub:function(d){ return d.date + ' · ' + d.project + ' · contents as of ' + d.at.slice(0, 7) + ' · ' + d.order.length + (d.order.length === 1 ? ' commit' : ' commits'); },
      large:function(kb){ return 'This file is large (' + kb + ' KB); the report carries only this turn’s changes.'; },
      binary:'This is a binary file; the report carries only the list of changes.',
      budget:'The whole text was left out to keep the report under its size limit.',
      gone:'The file no longer exists; only its changes are shown.',
      cutLong:'This diff was cut at 256 KB.', cutBudget:'This diff was left out to keep the report under its size limit.',
      omitted:'Not listed or shortened:',
      reasons:{net_zero:'added and removed within the turn; no net change', excluded:'left out on request',
        budget_text:'whole text left out (size limit)', budget_diff:'diff left out (size limit)'}},
    'zh-TW': {pick:'從左邊點一個檔案', all:'全部', doc:'文件', code:'程式', test:'測試',
      new_:'新', mod:'改', del:'刪', newLong:'新增', modLong:'修改', delLong:'刪除',
      legendNew:'這一輪新增', legendMod:'這一輪修改', legendDel:'這一輪刪除',
      read:'閱讀', diff:'這一輪的變更', src:'原始檔', open:'打開 ',
      commits:function(n){ return n + ' 個 commit'; },
      sub:function(d){ return d.date + '｜' + d.project + '｜檔案內容取自 ' + d.at.slice(0, 7) + '｜' + d.order.length + ' 個 commit'; },
      large:function(kb){ return '這個檔案太大（' + kb + ' KB），報告只放這一輪的變更。'; },
      binary:'這是二進位檔，報告只列出變更。',
      budget:'為了讓報告不超過大小上限，這個檔案的全文沒有放進來。',
      gone:'這個檔案已經不在了，只顯示變更。',
      cutLong:'這段變更超過 256 KB，後面截掉了。', cutBudget:'為了讓報告不超過大小上限，這段變更沒有放進來。',
      omitted:'沒有列出或有刪減：',
      reasons:{net_zero:'這一輪新增後又移除，淨變化為零', excluded:'依要求排除',
        budget_text:'全文未放（大小上限）', budget_diff:'變更未放（大小上限）'}}
  }[D.lang] ;
  var files = D.files || [], byPath = {};
  files.forEach(function(f){ byPath[f.path] = f; });
  var filter = 'all', current = null, tab = null;

  function cat(f){
    if (f.kind === 'md') return 'doc';
    if (/(^|\/)(tests?|__tests__|spec|testdata)\//.test(f.path) || /(_test\.go|\.test\.[jt]sx?|\.spec\.[jt]sx?|(^|\/)test_[^\/]*\.py|_test\.py)$/.test(f.path)) return 'test';
    return 'code';
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function badge(f){ var k = f.status === 'new' ? 'new_' : f.status; return '<span class="badge ' + f.status + '">' + L[k] + '</span>'; }
  var ICON_DIR = '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" style="color:var(--accent)"><path d="M1.5 4.5a1 1 0 0 1 1-1h3.6l1.4 1.5h6a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg>';
  var ICON_DOC = '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" style="color:var(--accent)"><path d="M4 1.5h5l3 3v10H4z"/><path d="M6 8h4M6 10.5h4"/></svg>';
  var ICON_FILE = '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" style="color:var(--muted)"><path d="M4 1.5h5l3 3v10H4z"/></svg>';

  document.getElementById('title').textContent = D.title;
  document.getElementById('sub').textContent = (D.subtitle ? D.subtitle + (D.lang === 'en' ? ' · ' : '｜') : '') + L.sub(D);
  document.getElementById('cards').innerHTML = (D.cards || []).map(function(c){
    return '<div class="card"><h3>' + esc(c.title) + '</h3>' + c.html + '</div>';
  }).join('');
  document.getElementById('view').innerHTML = '<div class="empty">' + L.pick + '</div>';
  document.getElementById('legend').innerHTML =
    '<span class="badge new">' + L.new_ + '</span> ' + L.legendNew + '　<span class="badge mod">' + L.mod + '</span> ' + L.legendMod +
    (files.some(function(f){ return f.status === 'del'; }) ? '　<span class="badge del">' + L.del + '</span> ' + L.legendDel : '');
  if ((D.omitted || []).length){
    document.getElementById('omitted').innerHTML = L.omitted + '<ul>' + D.omitted.map(function(o){
      return '<li><code>' + esc(o.path) + '</code>：' + esc(L.reasons[o.reason] || o.reason) + '</li>';
    }).join('') + '</ul>';
  }

  var pins = document.getElementById('pins');
  (D.pins || []).forEach(function(p){
    var b = document.createElement('button'); b.textContent = L.open + p;
    b.onclick = function(){ open(p); }; pins.appendChild(b);
  });

  var chips = document.getElementById('chips');
  [['all', L.all], ['doc', L.doc], ['code', L.code], ['test', L.test]].forEach(function(c){
    var n = c[0] === 'all' ? files.length : files.filter(function(f){ return cat(f) === c[0]; }).length;
    if (c[0] !== 'all' && n === 0) return;
    var b = document.createElement('button'); b.textContent = c[1] + ' ' + n;
    b.setAttribute('aria-pressed', c[0] === filter);
    b.onclick = function(){ filter = c[0];
      Array.prototype.forEach.call(chips.children, function(x){ x.setAttribute('aria-pressed', x === b); });
      renderTree(); };
    chips.appendChild(b);
  });

  function buildTree(list){
    var root = {dirs:{}, files:[]};
    list.forEach(function(f){
      var parts = f.path.split('/'), node = root;
      for (var i = 0; i < parts.length - 1; i++){
        node = node.dirs[parts[i]] || (node.dirs[parts[i]] = {dirs:{}, files:[]});
      }
      node.files.push(f);
    });
    return root;
  }
  function renderNode(node, ul, top){
    var pinned = top ? node.files.filter(function(f){ return (D.pins || []).indexOf(f.path) >= 0; }) : [];
    function fileRow(f){
      var li = document.createElement('li');
      var row = document.createElement('div'); row.className = 'row' + (f.path === current ? ' active' : '');
      row.dataset.path = f.path; row.title = f.path;
      row.innerHTML = '<span class="caret"></span>' + (f.kind === 'md' ? ICON_DOC : ICON_FILE) +
        '<span class="name">' + esc(f.path.split('/').pop()) + '</span>' + badge(f);
      row.onclick = function(){ open(f.path); };
      li.appendChild(row); ul.appendChild(li);
    }
    pinned.forEach(fileRow);
    Object.keys(node.dirs).sort().forEach(function(name){
      var child = node.dirs[name];
      var label = name;
      while (Object.keys(child.dirs).length === 1 && child.files.length === 0){
        var k = Object.keys(child.dirs)[0]; label += '/' + k; child = child.dirs[k];
      }
      var li = document.createElement('li');
      var row = document.createElement('div'); row.className = 'row';
      row.innerHTML = '<span class="caret">▾</span>' + ICON_DIR + '<span class="name">' + esc(label) + '</span>';
      row.onclick = function(){ li.classList.toggle('collapsed');
        row.firstChild.textContent = li.classList.contains('collapsed') ? '▸' : '▾'; };
      var sub = document.createElement('ul');
      li.appendChild(row); li.appendChild(sub); ul.appendChild(li);
      renderNode(child, sub, false);
    });
    node.files.filter(function(f){ return pinned.indexOf(f) < 0; })
      .sort(function(a,b){ return a.path < b.path ? -1 : 1; }).forEach(fileRow);
  }
  function renderTree(){
    var ul = document.getElementById('tree'); ul.innerHTML = '';
    renderNode(buildTree(files.filter(function(f){ return filter === 'all' || cat(f) === filter; })), ul, true);
  }

  function diffHtml(text){
    return text.split('\n').map(function(l){
      var c = '';
      if (/^(diff --git|index |--- |\+\+\+ |new file|deleted file|similarity|rename |Binary files)/.test(l)) c = 'f';
      else if (l[0] === '@') c = 'h';
      else if (l[0] === '+') c = 'a';
      else if (l[0] === '-') c = 'd';
      return c ? '<span class="' + c + '">' + esc(l || ' ') + '</span>' : esc(l) + '\n';
    }).join('');
  }

  // A relative link inside a rendered document opens that file here, when
  // the report carries it.
  function resolve(from, href){
    var parts = from.split('/'); parts.pop();
    href.split('#')[0].split('/').forEach(function(s){
      if (s === '..') parts.pop(); else if (s && s !== '.') parts.push(s);
    });
    return parts.join('/');
  }
  document.getElementById('view').addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('.md a[href]');
    if (!a) return;
    var href = a.getAttribute('href');
    if (/^[a-z][a-z0-9+.-]*:/i.test(href) || href[0] === '#') return;
    var target = href[0] === '/' ? href.slice(1).split('#')[0] : resolve(current, href);
    try { target = decodeURIComponent(target); } catch(err){}
    if (byPath[target]){ e.preventDefault(); open(target); }
  });

  function open(path, keepTab){
    var f = byPath[path]; if (!f) return;
    if (current !== path || !keepTab) tab = f.html != null ? 'read' : 'diff';
    current = path;
    try { history.replaceState(null, '', '#f=' + encodeURIComponent(path) + '&t=' + tab); } catch(e){}
    Array.prototype.forEach.call(document.querySelectorAll('.row[data-path]'), function(r){
      r.classList.toggle('active', r.dataset.path === path); });
    var tabs = [];
    if (f.html != null) tabs.push(['read', L.read]);
    tabs.push(['diff', L.diff]);
    if (f.text != null) tabs.push(['src', L.src]);
    if (!tabs.some(function(t){ return t[0] === tab; })) tab = tabs[0][0];
    var v = document.getElementById('view');
    var meta = L[f.status + 'Long'] + '・' + (f.size/1024).toFixed(1) + ' KB・' + L.commits(f.commits.length);
    v.innerHTML = '<div class="vhead"><div class="vpath">' + esc(f.path) + '</div>' +
      (f.note ? '<p class="vnote">' + esc(f.note) + '</p>' : '') +
      '<div class="vmeta">' + meta + '</div><div class="tabs" role="tablist"></div></div><div class="vbody"></div>';
    var tl = v.querySelector('.tabs'), body = v.querySelector('.vbody');
    tabs.forEach(function(t){
      var b = document.createElement('button'); b.textContent = t[1]; b.setAttribute('role','tab');
      b.setAttribute('aria-selected', t[0] === tab);
      b.onclick = function(){ tab = t[0]; open(path, true); };
      tl.appendChild(b);
    });
    if (tab === 'read') body.innerHTML = '<div class="md">' + f.html + '</div>';
    else if (tab === 'src') body.innerHTML = '<pre class="src">' + esc(f.text) + '</pre>';
    else {
      var why = f.status === 'del' ? L.gone : f.withheld === 'large' ? L.large((f.size/1024).toFixed(0)) :
        f.withheld === 'binary' ? L.binary : f.withheld === 'budget' ? L.budget : '';
      body.innerHTML = f.diffs.map(function(d){
        return '<div class="chead"><code>' + esc(d.commit) + '</code>　' + esc(d.subject) + '</div><pre class="diff">' + diffHtml(d.diff) + '</pre>' +
          (d.cut === 'long' ? '<p class="cut">' + L.cutLong + '</p>' : d.cut === 'budget' ? '<p class="cut">' + L.cutBudget + '</p>' : '');
      }).join('') + (why ? '<p class="vmeta">' + esc(why) + '</p>' : '');
    }
    if (window.innerWidth <= 860 && !keepTab) v.scrollIntoView({behavior:'smooth', block:'start'});
  }

  renderTree();
  var m = /f=([^&]+)(?:&t=(\w+))?/.exec(location.hash), first = null;
  try { first = m && decodeURIComponent(m[1]); } catch(e){}
  if (first && byPath[first]){ open(first); if (m[2]){ tab = m[2]; open(current, true); } }
  else if ((D.pins || []).length) open(D.pins[0]);
  else if (files.length) open(files[0].path);
})();
</script>
</body>
